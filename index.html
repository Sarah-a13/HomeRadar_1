<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeRadar - Real Estate Intelligence</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Lora:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
        }
        
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }
        
        .card-subtle { 
            transition: all 0.2s ease;
            border: 1px solid #e0e7ff;
        }
        
        .card-subtle:hover {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border-color: #c7d2fe;
        }
        
        .sidebar-nav-item {
            transition: all 0.2s ease;
        }
        
        .sidebar-nav-item.active {
            background-color: #f0f4ff;
            border-left: 3px solid #4f46e5;
            padding-left: calc(1rem - 3px);
        }
        
        .progress-circle {
            background: conic-gradient(#4f46e5 0deg 331.2deg, #e0e7ff 331.2deg 360deg);
        }
        
        .stat-card {
            background: linear-gradient(135deg, #ffffff 0%, #f9fafb 100%);
            border: 1px solid #e5e7eb;
        }
        
        .property-image {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
    </style>
</head>
<body class="bg-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // 🔥 API Configuration
        const API_URL = 'https://homeradar-backend.onrender.com';
        let authToken = localStorage.getItem('homeradar_token');

        // Hover text for the "Why this matches" factors, shown via the title attribute on each row.
        const FACTOR_EXPLANATIONS = {
            Budget: 'How well the price fits your budget range \u2013 cheaper listings within your range score higher.',
            Location: 'Whether the listing is in one of your selected areas.',
            Market: 'How fresh the listing is \u2013 newer listings score higher than ones that have been on the market longer.',
            Value: 'How the price per m\u00b2 compares to similar properties in HomeRadar \u2013 priced below average scores higher.'
        };

        // Fresh defaults for a logged-out/new session - reused on initial mount and on sign-out so
        // a previous user's preferences/weights can't leak into the next login in the same tab.
        const DEFAULT_PREFERENCES = {
            budget: { min: 2000000, max: 8000000 },
            cities: ['Copenhagen', 'Frederiksberg'],
            sizeMode: 'size',
            minSize: 80,
            minRooms: null,
            features: ['Garden', 'Natural Light', 'Family-friendly'],
            weights: { budget: 1.0, location: 1.0, market: 1.0, value: 1.0 }
        };

        const mockProperties = [
            {
                id: 1,
                address: "Valby Langgade 123",
                city: "Copenhagen",
                price: 2500000,
                size: 145,
                score: 91,
                rooms: 5,
                bathrooms: 2,
                description: "Beautiful family home with a large garden and excellent natural light.",
                features: ["Garden", "Natural Light", "Family-friendly"],
                marketStatus: "Coming Soon",
                daysToMarket: 7,
                source: "Estate Agent"
            },
            {
                id: 2,
                address: "Vigerslev Alle 45",
                city: "Copenhagen",
                price: 2500000,
                size: 152,
                score: 89,
                rooms: 4,
                bathrooms: 1,
                description: "Charming townhouse in a quiet, well-maintained neighborhood.",
                features: ["Garden", "Parking"],
                marketStatus: "Off-Market",
                daysToMarket: 0,
                source: "Private Network"
            },
            {
                id: 3,
                address: "Godthaabsvej 178",
                city: "Copenhagen",
                price: 2300000,
                size: 118,
                score: 85,
                rooms: 4,
                bathrooms: 1,
                description: "Bright and spacious residence close to shops and green spaces.",
                features: ["Balcony", "Modern"],
                marketStatus: "Coming Soon",
                daysToMarket: 14,
                source: "Facebook"
            }
        ];

        // Single-page criteria form: reused for first-time setup and for editing preferences from the Profile page.
        function CriteriaForm({ initial, onSave, submitLabel, allCities, allFeatures }) {
            const [budgetMin, setBudgetMin] = useState(initial.budget?.min || 0);
            const [noUpperLimit, setNoUpperLimit] = useState((initial.budget?.max || 0) >= 50000000);
            const [budgetMax, setBudgetMax] = useState((initial.budget?.max || 0) >= 50000000 ? 50000000 : (initial.budget?.max || 5000000));
            const [sizeMode, setSizeMode] = useState(initial.sizeMode || 'size');
            const [minSize, setMinSize] = useState(initial.minSize || 80);
            const [minRooms, setMinRooms] = useState(initial.minRooms || 3);
            const [areas, setAreas] = useState(initial.cities || []);
            const [areaInput, setAreaInput] = useState('');
            const [features, setFeatures] = useState(initial.features || []);
            const [customFeature, setCustomFeature] = useState('');

            const addArea = () => {
                const val = areaInput.trim();
                if (val && !areas.includes(val)) setAreas([...areas, val]);
                setAreaInput('');
            };
            const removeArea = (a) => setAreas(areas.filter(x => x !== a));
            const toggleSuggestedArea = (c) => setAreas(areas.includes(c) ? areas.filter(x => x !== c) : [...areas, c]);

            const toggleFeature = (f) => setFeatures(prev => prev.includes(f) ? prev.filter(x => x !== f) : [...prev, f]);
            const addCustomFeature = () => {
                const val = customFeature.trim();
                if (val && !features.includes(val)) setFeatures([...features, val]);
                setCustomFeature('');
            };

            const handleSave = () => {
                if (areas.length === 0) {
                    alert('Please add at least one area of interest (city name or postal code)');
                    return;
                }
                onSave({
                    budget: { min: Number(budgetMin) || 0, max: noUpperLimit ? 999000000 : (Number(budgetMax) || 50000000) },
                    sizeMode,
                    minSize: sizeMode === 'size' ? (Number(minSize) || 0) : null,
                    minRooms: sizeMode === 'rooms' ? (Number(minRooms) || 0) : null,
                    cities: areas,
                    features
                });
            };

            return (
                <div className="space-y-8">
                    {/* Budget */}
                    <div>
                        <h3 className="text-lg font-semibold text-gray-900 mb-1">Budget (DKK)</h3>
                        <p className="text-sm text-gray-500 mb-4">Mandatory. Range from 0 to 50,000,000+.</p>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Minimum</label>
                                <input type="number" min="0" max="50000000" step="100000" value={budgetMin} onChange={(e) => setBudgetMin(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Maximum</label>
                                <input type="number" min="0" max="50000000" step="100000" value={budgetMax} disabled={noUpperLimit} onChange={(e) => setBudgetMax(e.target.value)} className="w-full px-4 py-3 border border-gray-300 rounded-lg disabled:bg-gray-100 disabled:text-gray-400" />
                            </div>
                        </div>
                        <label className="flex items-center gap-2 mt-3 text-sm text-gray-600">
                            <input type="checkbox" checked={noUpperLimit} onChange={(e) => setNoUpperLimit(e.target.checked)} />
                            No upper limit (50M+)
                        </label>
                    </div>

                    {/* Size or Rooms */}
                    <div>
                        <h3 className="text-lg font-semibold text-gray-900 mb-1">Minimum Size</h3>
                        <p className="text-sm text-gray-500 mb-4">Mandatory. Choose square metres or number of rooms.</p>
                        <div className="flex gap-6 mb-3">
                            <label className="flex items-center gap-2 text-sm text-gray-700">
                                <input type="radio" name="sizeMode" checked={sizeMode === 'size'} onChange={() => setSizeMode('size')} />
                                Square metres
                            </label>
                            <label className="flex items-center gap-2 text-sm text-gray-700">
                                <input type="radio" name="sizeMode" checked={sizeMode === 'rooms'} onChange={() => setSizeMode('rooms')} />
                                Number of rooms
                            </label>
                        </div>
                        {sizeMode === 'size' ? (
                            <input type="number" min="0" value={minSize} onChange={(e) => setMinSize(e.target.value)} placeholder="e.g. 80" className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                        ) : (
                            <input type="number" min="1" value={minRooms} onChange={(e) => setMinRooms(e.target.value)} placeholder="e.g. 3" className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                        )}
                    </div>

                    {/* Area of interest */}
                    <div>
                        <h3 className="text-lg font-semibold text-gray-900 mb-1">Area of Interest</h3>
                        <p className="text-sm text-gray-500 mb-4">Type a city name or postal code, or pick a suggestion below.</p>
                        <div className="flex gap-2 mb-3">
                            <input
                                type="text"
                                value={areaInput}
                                onChange={(e) => setAreaInput(e.target.value)}
                                onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addArea(); } }}
                                placeholder="e.g. Copenhagen or 2100"
                                className="flex-1 px-4 py-3 border border-gray-300 rounded-lg"
                            />
                            <button onClick={addArea} className="px-6 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition">Add</button>
                        </div>
                        <div className="flex flex-wrap gap-2 mb-3">
                            {allCities.map(c => (
                                <button
                                    key={c}
                                    onClick={() => toggleSuggestedArea(c)}
                                    className={`px-3 py-1 rounded-full text-sm font-medium transition ${areas.includes(c) ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                                >
                                    {c}
                                </button>
                            ))}
                        </div>
                        {areas.length > 0 && (
                            <div className="flex flex-wrap gap-2">
                                {areas.map(a => (
                                    <span key={a} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm font-medium flex items-center gap-2">
                                        {a}
                                        <button onClick={() => removeArea(a)} className="text-indigo-400 hover:text-indigo-700">×</button>
                                    </span>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Soft preferences */}
                    <div>
                        <h3 className="text-lg font-semibold text-gray-900 mb-1">Nice-to-Have Features</h3>
                        <p className="text-sm text-gray-500 mb-4">Optional. Pick suggestions or type your own.</p>
                        <div className="flex flex-wrap gap-2 mb-3">
                            {allFeatures.map(f => (
                                <button
                                    key={f}
                                    onClick={() => toggleFeature(f)}
                                    className={`px-3 py-1 rounded-full text-sm font-medium transition ${features.includes(f) ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                                >
                                    {f}
                                </button>
                            ))}
                        </div>
                        <div className="flex gap-2 mb-3">
                            <input
                                type="text"
                                value={customFeature}
                                onChange={(e) => setCustomFeature(e.target.value)}
                                onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); addCustomFeature(); } }}
                                placeholder="Add your own (e.g. Sea view)"
                                className="flex-1 px-4 py-3 border border-gray-300 rounded-lg"
                            />
                            <button onClick={addCustomFeature} className="px-6 py-3 bg-gray-100 text-gray-700 rounded-lg font-medium hover:bg-gray-200 transition">Add</button>
                        </div>
                        {features.filter(f => !allFeatures.includes(f)).length > 0 && (
                            <div className="flex flex-wrap gap-2">
                                {features.filter(f => !allFeatures.includes(f)).map(f => (
                                    <span key={f} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm font-medium flex items-center gap-2">
                                        {f}
                                        <button onClick={() => toggleFeature(f)} className="text-indigo-400 hover:text-indigo-700">×</button>
                                    </span>
                                ))}
                            </div>
                        )}
                    </div>

                    <button onClick={handleSave} className="w-full px-6 py-4 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition text-lg">
                        {submitLabel}
                    </button>
                </div>
            );
        }

        // Shared property card - used by both the Dashboard's matched-properties grid and the
        // All Properties page, so both show the same real data (incl. photo) instead of drifting apart.
        function PropertyCard({ prop, score, breakdown, isShortlisted, onToggleShortlist, onFeedback, onOpenDetails }) {
            const imageUrl = prop.thumbnail_url || (Array.isArray(prop.images) && prop.images.length > 0 ? prop.images[0] : null);
            return (
                <div className="card-subtle bg-white rounded-xl overflow-hidden">
                    <div
                        onClick={() => onOpenDetails(prop)}
                        className="h-48 property-image flex items-center justify-center text-gray-300 overflow-hidden bg-gray-50 cursor-pointer"
                    >
                        {imageUrl ? (
                            <img
                                src={imageUrl}
                                alt={prop.address}
                                className="w-full h-full object-cover"
                                onError={(e) => { e.target.remove(); }}
                            />
                        ) : 'Photo'}
                    </div>
                    <div className="p-8">
                        <div onClick={() => onOpenDetails(prop)} className="flex justify-between items-start mb-4 cursor-pointer">
                            <div>
                                <h3 className="text-xl font-semibold text-gray-900 hover:text-indigo-600">{prop.address}</h3>
                                <p className="text-sm text-gray-600 mt-1">{prop.city}</p>
                            </div>
                            <div className="text-right">
                                <div className="text-3xl font-bold text-indigo-600">{score}%</div>
                                <p className="text-xs text-gray-500 mt-1">Match Score</p>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-4 my-6 py-6 border-y border-gray-200">
                            <div>
                                <p className="text-xs text-gray-500 uppercase mb-1">Price</p>
                                <p className="font-semibold text-gray-900">{(prop.price/1000000).toFixed(1)}M DKK</p>
                            </div>
                            <div>
                                <p className="text-xs text-gray-500 uppercase mb-1">Size</p>
                                <p className="font-semibold text-gray-900">{prop.sqm || prop.size || 'N/A'} m²</p>
                            </div>
                            <div>
                                <p className="text-xs text-gray-500 uppercase mb-1">Rooms</p>
                                <p className="font-semibold text-gray-900">{prop.bedrooms || prop.rooms || 'N/A'}</p>
                            </div>
                        </div>

                        {/* Why this matches */}
                        <div className="mb-6">
                            <p className="text-xs font-semibold text-gray-500 uppercase mb-3">Why this matches</p>
                            <div className="space-y-2">
                                {[
                                    { label: 'Budget', val: breakdown.budget },
                                    { label: 'Location', val: breakdown.location },
                                    { label: 'Market', val: breakdown.market },
                                    { label: 'Value', val: breakdown.value }
                                ].map(f => (
                                    <div key={f.label} className="flex items-center gap-3 relative group">
                                        <div className="w-16 text-xs text-gray-500 border-b border-dotted border-gray-400 cursor-help">
                                            {f.label}
                                            <div className="hidden group-hover:block absolute left-0 bottom-full mb-2 w-56 bg-gray-900 text-white text-xs leading-snug rounded-lg p-3 shadow-xl z-20">
                                                {FACTOR_EXPLANATIONS[f.label]}
                                            </div>
                                        </div>
                                        <div className="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                                            <div className="bg-indigo-500 h-full" style={{width: `${f.val}%`}}></div>
                                        </div>
                                        <div className="w-8 text-xs font-semibold text-gray-700 text-right">{f.val}</div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <p className="text-gray-600 text-sm mb-2">{prop.description || 'Property details'}</p>
                        <div className="text-xs text-gray-500 mb-6">Source: {prop.source || 'N/A'}{prop.agent_name ? ` · ${prop.agent_name}` : ''}</div>

                        <div className="flex gap-3">
                            <button onClick={() => onToggleShortlist(prop)} className={`px-4 py-3 rounded-lg font-medium transition ${isShortlisted ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-gray-50 text-gray-700 border border-gray-200 hover:bg-gray-100'}`}>
                                {isShortlisted ? '❤️ Saved' : '🤍 Save'}
                            </button>
                            <button onClick={() => onFeedback(prop, true)} className="px-4 py-3 border border-green-200 text-green-700 rounded-lg font-medium hover:bg-green-50 transition">
                                👍
                            </button>
                            <button onClick={() => onFeedback(prop, false)} className="px-4 py-3 border border-gray-200 text-gray-500 rounded-lg font-medium hover:bg-gray-50 transition">
                                👎
                            </button>
                            <button onClick={() => onOpenDetails(prop)} className="flex-1 px-4 py-3 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition">
                                View Details
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [authChecked, setAuthChecked] = useState(false);
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [authMode, setAuthMode] = useState('signup');
            const [signupForm, setSignupForm] = useState({ name: '', email: '', password: '' });
            const [loginForm, setLoginForm] = useState({ email: '', password: '' });
            const [preferencesSetup, setPreferencesSetup] = useState(false);
            const [preferences, setPreferences] = useState({ ...DEFAULT_PREFERENCES });
            const [selectedView, setSelectedView] = useState('dashboard');
            const [shortlist, setShortlist] = useState([]);
            const [feedbackHistory, setFeedbackHistory] = useState([]);
            const [selectedProperty, setSelectedProperty] = useState(null);
            const [forgotEmail, setForgotEmail] = useState('');
            const [resetInfo, setResetInfo] = useState(null);
            const [resetPasswordForm, setResetPasswordForm] = useState({ token: '', newPassword: '', confirmPassword: '' });
            const [profileForm, setProfileForm] = useState({ name: '', email: '', currentPassword: '', newPassword: '', confirmPassword: '' });

            const allCities = ['Copenhagen', 'Frederiksberg', 'Valby', 'Aarhus', 'Odense', 'Aalborg'];
            const allFeatures = ['Garden', 'Natural Light', 'Family-friendly', 'Modern', 'Parking', 'Balcony', 'Waterfront'];

            // Danish real-estate data uses native city names with postal-district suffixes
            // (e.g. "København K", "Aarhus C"), so match by alias + prefix, not exact string equality.
            const CITY_ALIASES = { 'Copenhagen': 'København' };
            const cityMatches = (preferredCity, propertyCity) => {
                if (!preferredCity || !propertyCity) return false;
                const propLower = propertyCity.toLowerCase();
                const prefLower = preferredCity.toLowerCase();
                if (propLower.startsWith(prefLower)) return true;
                const alias = CITY_ALIASES[preferredCity];
                return alias ? propLower.startsWith(alias.toLowerCase()) : false;
            };

            // Accepts either a city name (matched via cityMatches) or a Danish postal code (matched by prefix
            // against the property's postal_code), so users can type either into the area-of-interest field.
            const matchesArea = (area, prop) => {
                const trimmed = (area || '').trim();
                if (!trimmed) return false;
                if (/^\d+$/.test(trimmed)) {
                    return (prop.postal_code || '').startsWith(trimmed);
                }
                return cityMatches(trimmed, prop.city || '');
            };

            // Restore the session on refresh: a token in localStorage means the user was
            // logged in, so re-fetch their account instead of dropping them back to the
            // landing page. If the token is missing/expired, clear it and show sign-in as usual.
            useEffect(() => {
                const restoreSession = async () => {
                    if (!authToken) { setAuthChecked(true); return; }
                    try {
                        const response = await fetch(`${API_URL}/api/users/profile`, {
                            headers: { 'Authorization': `Bearer ${authToken}` }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            setCurrentUser({
                                id: data.id,
                                name: data.first_name || 'User',
                                email: data.email,
                            });
                        } else {
                            authToken = null;
                            localStorage.removeItem('homeradar_token');
                        }
                    } catch (error) {
                        console.error('Error restoring session:', error);
                    } finally {
                        setAuthChecked(true);
                    }
                };
                restoreSession();
            }, []);

            useEffect(() => {
                if (currentUser) {
                    setProfileForm(prev => ({ ...prev, name: currentUser.name || '', email: currentUser.email || '' }));
                }
            }, [currentUser]);

            // Load any previously-saved preferences (including learned weights and feedback
            // history) so they survive a page refresh instead of resetting every session.
            useEffect(() => {
                const loadSavedProfile = async () => {
                    try {
                        const response = await fetch(`${API_URL}/api/users/profile`, {
                            headers: { 'Authorization': `Bearer ${authToken}` }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            if (data.preferences) {
                                setPreferences(prev => ({ ...prev, ...data.preferences }));
                                if (Array.isArray(data.preferences.feedbackHistory)) {
                                    setFeedbackHistory(data.preferences.feedbackHistory);
                                }
                            }
                        }
                    } catch (error) {
                        console.error('Error loading saved profile:', error);
                    }
                };
                if (currentUser) loadSavedProfile();
            }, [currentUser]);

            // 🔥 Fetch properties from API
            const [apiProperties, setApiProperties] = useState([]);
            const [propertiesLoading, setPropertiesLoading] = useState(false);
            const [propertiesError, setPropertiesError] = useState(null);
            const [showSearchingModal, setShowSearchingModal] = useState(false);
            const [detailsLoading, setDetailsLoading] = useState(false);

            // Lazily fetches the full listing (description, bathrooms, energy label, monthly
            // expense, lot size, and the agent's real phone/email) the first time it's opened,
            // so the user never has to leave HomeRadar to see what's on the original listing.
            useEffect(() => {
                if (!selectedProperty || selectedProperty.description !== null && selectedProperty.description !== undefined) return;
                let cancelled = false;
                setDetailsLoading(true);
                fetch(`${API_URL}/api/properties/${selectedProperty.id}`)
                    .then(res => res.ok ? res.json() : null)
                    .then(fullProperty => {
                        if (!cancelled && fullProperty) {
                            setSelectedProperty(prev => (prev && prev.id === fullProperty.id) ? { ...prev, ...fullProperty } : prev);
                            setApiProperties(prev => prev.map(p => p.id === fullProperty.id ? { ...p, ...fullProperty } : p));
                        }
                    })
                    .catch(error => console.error('Error loading listing details:', error))
                    .finally(() => { if (!cancelled) setDetailsLoading(false); });
                return () => { cancelled = true; };
            }, [selectedProperty?.id]);

            const fetchProperties = async () => {
                try {
                    setPropertiesLoading(true);
                    const response = await fetch(`${API_URL}/api/properties`);
                    if (response.ok) {
                        const data = await response.json();
                        setApiProperties(data.data || []);
                        setPropertiesError(null);
                    } else {
                        setPropertiesError('Failed to load properties from the server.');
                    }
                } catch (error) {
                    console.error('Error fetching properties:', error);
                    setPropertiesError('Could not reach the server. Check your connection and try again.');
                } finally {
                    setPropertiesLoading(false);
                }
            };

            useEffect(() => {
                if (currentUser) {
                    fetchProperties();
                    // Refresh every 30 seconds (for scraping updates)
                    const interval = setInterval(fetchProperties, 30000);
                    return () => clearInterval(interval);
                }
            }, [currentUser]);

            // Breaks a property's match into 5 explainable factors derived from real listing data
            // (no mock/random numbers) so "why this matches" reflects the actual property.
            const calculateBreakdown = (prop) => {
                const propPrice = prop.price || 0;
                const propSqm = parseFloat(prop.sqm) || 0;

                let budget = 0;
                if (propPrice > 0 && propPrice >= preferences.budget.min && propPrice <= preferences.budget.max) {
                    const range = (preferences.budget.max - preferences.budget.min) || 1;
                    const position = (propPrice - preferences.budget.min) / range;
                    budget = Math.round(100 - position * 25); // cheaper end of the range scores higher
                }

                const location = preferences.cities.some(c => matchesArea(c, prop)) ? 100 : 40;

                let market = 60;
                if (prop.listing_date) {
                    const daysOnMarket = Math.max(0, Math.floor((Date.now() - new Date(prop.listing_date)) / 86400000));
                    market = Math.max(40, 100 - daysOnMarket * 2); // fresher listings score higher
                }

                let value = 60;
                if (propPrice > 0 && propSqm > 0 && apiProperties.length > 0) {
                    const pricePerSqm = propPrice / propSqm;
                    const comparable = apiProperties.filter(p => parseFloat(p.sqm) > 0 && p.price > 0);
                    const avgPricePerSqm = comparable.length > 0
                        ? comparable.reduce((sum, p) => sum + (p.price / parseFloat(p.sqm)), 0) / comparable.length
                        : 0;
                    value = avgPricePerSqm > 0
                        ? Math.max(30, Math.min(100, Math.round(100 - ((pricePerSqm - avgPricePerSqm) / avgPricePerSqm) * 100)))
                        : 60;
                }

                return { budget, location, market, value };
            };

            const calculateScore = (prop) => {
                // Handle both API properties (address, price fields) and mock properties
                const propPrice = prop.price || 0;
                const propSqm = parseFloat(prop.sqm) || prop.size || 0;
                const propRooms = prop.bedrooms || prop.rooms || 0;

                const sizeOk = preferences.sizeMode === 'rooms'
                    ? (!preferences.minRooms || propRooms === 0 || propRooms >= preferences.minRooms)
                    : (!preferences.minSize || propSqm === 0 || propSqm >= preferences.minSize);

                const hardConstraints = {
                    budget: propPrice === 0 || (propPrice >= preferences.budget.min && propPrice <= preferences.budget.max),
                    area: preferences.cities.some(c => matchesArea(c, prop)),
                    size: sizeOk
                };

                if (!hardConstraints.budget || !hardConstraints.area || !hardConstraints.size) return 0;

                // Mock properties carry a canned score; real properties get the computed breakdown
                if (prop.score) return prop.score;

                const breakdown = calculateBreakdown(prop);
                const w = preferences.weights;
                const weighted = (
                    breakdown.budget * w.budget * 35 +
                    breakdown.location * w.location * 25 +
                    breakdown.market * w.market * 20 +
                    breakdown.value * w.value * 20
                ) / 100;
                return Math.max(1, Math.min(100, Math.round(weighted)));
            };

            const handleFeedback = (prop, relevant) => {
                const updatedHistory = [{ id: prop.id, relevant, timestamp: new Date() }, ...feedbackHistory].slice(0, 50);
                setFeedbackHistory(updatedHistory);

                const direction = relevant ? 1 : -1;
                const adjust = (w) => Math.max(0.5, Math.min(2.0, w + direction * 0.05));
                const updatedWeights = {
                    budget: adjust(preferences.weights.budget),
                    location: adjust(preferences.weights.location),
                    market: adjust(preferences.weights.market),
                    value: adjust(preferences.weights.value)
                };
                const updatedPreferences = { ...preferences, weights: updatedWeights, feedbackHistory: updatedHistory };
                setPreferences(updatedPreferences);

                // Persist so learned weights and feedback survive a page refresh
                fetch(`${API_URL}/api/users/preferences`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ preferences: { ...updatedPreferences, city: updatedPreferences.cities[0] } })
                }).catch(error => console.error('Error saving feedback:', error));
            };

            const toggleShortlist = (prop) => {
                setShortlist(prev => prev.find(p => p.id === prop.id) ? prev.filter(p => p.id !== prop.id) : [...prev, prop]);
            };

            const handleSignup = async () => {
                if (signupForm.name && signupForm.email && signupForm.password) {
                    try {
                        const response = await fetch(`${API_URL}/api/users/register`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                first_name: signupForm.name,
                                email: signupForm.email,
                                password: signupForm.password
                            })
                        });
                        
                        if (!response.ok) {
                            const error = await response.json();
                            alert(`Signup failed: ${error.error || 'Unknown error'}`);
                            return;
                        }

                        const data = await response.json();
                        authToken = data.token;
                        localStorage.setItem('homeradar_token', authToken);
                        
                        setCurrentUser({ 
                            name: signupForm.name, 
                            email: signupForm.email,
                            id: data.id 
                        });
                        setPreferencesSetup(true);
                        setShowAuthModal(false);
                        setSignupForm({ name: '', email: '', password: '' });
                        alert('✅ Account created! Now set up your preferences.');
                    } catch (error) {
                        console.error('Signup error:', error);
                        alert(`Connection error: ${error.message}`);
                    }
                } else {
                    alert('Please fill in all fields');
                }
            };

            const handleLogin = async () => {
                if (loginForm.email && loginForm.password) {
                    try {
                        const response = await fetch(`${API_URL}/api/users/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                email: loginForm.email,
                                password: loginForm.password
                            })
                        });
                        
                        if (!response.ok) {
                            const error = await response.json();
                            alert(`Login failed: ${error.error || 'Invalid credentials'}`);
                            return;
                        }

                        const data = await response.json();
                        authToken = data.token;
                        localStorage.setItem('homeradar_token', authToken);
                        
                        setCurrentUser({ 
                            name: data.first_name || 'User', 
                            email: loginForm.email,
                            id: data.id
                        });
                        setShowAuthModal(false);
                        setLoginForm({ email: '', password: '' });
                        alert('✅ Logged in successfully!');
                    } catch (error) {
                        console.error('Login error:', error);
                        alert(`Connection error: ${error.message}`);
                    }
                } else {
                    alert('Please enter email and password');
                }
            };

            // Shared save path for both first-time setup and later edits from the Profile page.
            // Merges into existing preferences (rather than replacing wholesale) so learned weights survive.
            const applyCriteria = async (criteria, navigateToDashboard) => {
                const merged = { ...preferences, ...criteria };
                setShowSearchingModal(true);
                try {
                    const response = await fetch(`${API_URL}/api/users/preferences`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            preferences: { ...merged, city: merged.cities[0] }
                        })
                    });

                    if (!response.ok) {
                        const error = await response.json();
                        alert(`Failed to save preferences: ${error.error}`);
                        return;
                    }

                    setPreferences(merged);

                    // Give the backend's live property search a moment, then refresh the feed
                    // so newly-found matches show up as soon as the modal closes.
                    await new Promise(resolve => setTimeout(resolve, 4000));
                    await fetchProperties();

                    if (navigateToDashboard) {
                        setPreferencesSetup(false);
                        setSelectedView('dashboard');
                    }
                } catch (error) {
                    console.error('Save preferences error:', error);
                    alert(`Connection error: ${error.message}`);
                } finally {
                    setShowSearchingModal(false);
                }
            };

            const handleCompleteSetup = (criteria) => applyCriteria(criteria, true);
            const handleUpdatePreferences = (criteria) => applyCriteria(criteria, false);

            const handleForgotPassword = async () => {
                if (!forgotEmail) {
                    alert('Please enter your email');
                    return;
                }
                try {
                    const response = await fetch(`${API_URL}/api/users/forgot-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: forgotEmail })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error || 'Failed to request password reset');
                        return;
                    }
                    if (!data.resetToken) {
                        // Generic response (no matching account) - deliberately indistinguishable
                        // from the success case to avoid leaking which emails are registered.
                        alert(data.message || 'If an account exists with that email, a password reset has been generated.');
                        return;
                    }
                    setResetInfo({ token: data.resetToken, expiresAt: data.expiresAt });
                    setResetPasswordForm({ token: data.resetToken, newPassword: '', confirmPassword: '' });
                    setAuthMode('reset');
                } catch (error) {
                    console.error('Forgot password error:', error);
                    alert(`Connection error: ${error.message}`);
                }
            };

            const handleResetPassword = async () => {
                if (!resetPasswordForm.newPassword || resetPasswordForm.newPassword.length < 8) {
                    alert('Password must be at least 8 characters');
                    return;
                }
                if (resetPasswordForm.newPassword !== resetPasswordForm.confirmPassword) {
                    alert('Passwords do not match');
                    return;
                }
                try {
                    const response = await fetch(`${API_URL}/api/users/reset-password`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: resetPasswordForm.token, newPassword: resetPasswordForm.newPassword })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error || 'Failed to reset password');
                        return;
                    }
                    alert('✅ Password reset! You can now sign in with your new password.');
                    setResetInfo(null);
                    setResetPasswordForm({ token: '', newPassword: '', confirmPassword: '' });
                    setForgotEmail('');
                    setAuthMode('login');
                } catch (error) {
                    console.error('Reset password error:', error);
                    alert(`Connection error: ${error.message}`);
                }
            };

            const handleUpdateProfile = async () => {
                const body = { first_name: profileForm.name, email: profileForm.email };
                if (profileForm.newPassword || profileForm.currentPassword) {
                    if (!profileForm.currentPassword) {
                        alert('Enter your current password to set a new one');
                        return;
                    }
                    if (profileForm.newPassword.length < 8) {
                        alert('New password must be at least 8 characters');
                        return;
                    }
                    if (profileForm.newPassword !== profileForm.confirmPassword) {
                        alert('New passwords do not match');
                        return;
                    }
                    body.current_password = profileForm.currentPassword;
                    body.new_password = profileForm.newPassword;
                }
                try {
                    const response = await fetch(`${API_URL}/api/users/profile`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify(body)
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        alert(data.error || 'Failed to update profile');
                        return;
                    }
                    setCurrentUser(prev => ({ ...prev, name: data.user.first_name, email: data.user.email }));
                    setProfileForm(prev => ({ ...prev, currentPassword: '', newPassword: '', confirmPassword: '' }));
                    alert('✅ Profile updated!');
                } catch (error) {
                    console.error('Profile update error:', error);
                    alert(`Connection error: ${error.message}`);
                }
            };

            // Avoid flashing the logged-out landing page while a saved session is still being restored.
            if (!authChecked) {
                return (
                    <div className="min-h-screen bg-white flex items-center justify-center">
                        <div className="w-10 h-10 border-4 border-gray-100 border-t-indigo-600 rounded-full animate-spin"></div>
                    </div>
                );
            }

            // Landing Page
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-white">
                        {/* Navigation */}
                        <nav className="border-b border-gray-200">
                            <div className="max-w-7xl mx-auto px-8 py-6 flex justify-between items-center">
                                <div className="flex items-center gap-2">
                                    <div className="text-2xl font-bold text-gray-900">HomeRadar</div>
                                </div>
                                <button 
                                    onClick={() => { setAuthMode('login'); setShowAuthModal(true); }} 
                                    className="px-6 py-2 text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition"
                                >
                                    Sign In
                                </button>
                            </div>
                        </nav>

                        {/* Hero Section */}
                        <div className="max-w-7xl mx-auto px-8 py-24">
                            <div className="max-w-2xl">
                                <h1 className="text-6xl font-bold text-gray-900 mb-6 leading-tight">
                                    Find your perfect home
                                </h1>
                                <p className="text-xl text-gray-600 mb-12 leading-relaxed">
                                    HomeRadar uses advanced intelligence to understand your preferences and match you with properties that truly fit your lifestyle and investment goals.
                                </p>
                                <button 
                                    onClick={() => { setAuthMode('signup'); setShowAuthModal(true); }} 
                                    className="px-8 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition"
                                >
                                    Get Started
                                </button>
                            </div>
                        </div>

                        {/* Features Section */}
                        <div className="bg-gray-50 border-t border-gray-200">
                            <div className="max-w-7xl mx-auto px-8 py-20">
                                <h2 className="text-3xl font-bold text-gray-900 mb-16">How it works</h2>
                                <div className="grid grid-cols-3 gap-12">
                                    <div>
                                        <div className="text-sm font-semibold text-indigo-600 mb-3">STEP ONE</div>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-3">Share Your Criteria</h3>
                                        <p className="text-gray-600">Tell us about your ideal home, budget, preferred locations, and must-have features.</p>
                                    </div>
                                    <div>
                                        <div className="text-sm font-semibold text-indigo-600 mb-3">STEP TWO</div>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-3">Intelligent Matching</h3>
                                        <p className="text-gray-600">Our AI analyzes hundreds of properties and identifies the best matches for your specific needs.</p>
                                    </div>
                                    <div>
                                        <div className="text-sm font-semibold text-indigo-600 mb-3">STEP THREE</div>
                                        <h3 className="text-xl font-semibold text-gray-900 mb-3">Expert Insights</h3>
                                        <p className="text-gray-600">Get detailed market analysis, property scoring, and expert recommendations to guide your decision.</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Auth Modal */}
                        {showAuthModal && (
                            <div className="fixed inset-0 bg-black/20 flex items-center justify-center z-50">
                                <div className="bg-white rounded-xl p-8 max-w-md w-full mx-4 border border-gray-200">
                                    <div className="flex justify-between items-center mb-8">
                                        <h2 className="text-2xl font-semibold text-gray-900">
                                            {authMode === 'login' ? 'Sign In' : authMode === 'signup' ? 'Create Account' : authMode === 'forgot' ? 'Forgot Password' : 'Reset Password'}
                                        </h2>
                                        <button onClick={() => setShowAuthModal(false)} className="text-2xl text-gray-400 hover:text-gray-600">×</button>
                                    </div>

                                    {authMode === 'login' && (
                                        <div className="space-y-4">
                                            <input
                                                type="email"
                                                placeholder="Email"
                                                value={loginForm.email}
                                                onChange={(e) => setLoginForm({ ...loginForm, email: e.target.value })}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <input
                                                type="password"
                                                placeholder="Password"
                                                value={loginForm.password}
                                                onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <button onClick={() => setAuthMode('forgot')} className="text-sm text-gray-500 hover:text-gray-900 hover:underline">
                                                Forgot password?
                                            </button>
                                            <button onClick={handleLogin} className="w-full px-4 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition">
                                                Sign In
                                            </button>
                                            <p className="text-center text-gray-600 text-sm">
                                                Don't have an account?{' '}
                                                <button onClick={() => setAuthMode('signup')} className="text-gray-900 font-semibold hover:underline">
                                                    Create one
                                                </button>
                                            </p>
                                        </div>
                                    )}

                                    {authMode === 'signup' && (
                                        <div className="space-y-4">
                                            <input
                                                type="text"
                                                placeholder="Full name"
                                                value={signupForm.name}
                                                onChange={(e) => setSignupForm({ ...signupForm, name: e.target.value })}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <input
                                                type="email"
                                                placeholder="Email"
                                                value={signupForm.email}
                                                onChange={(e) => setSignupForm({ ...signupForm, email: e.target.value })}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <input
                                                type="password"
                                                placeholder="Password"
                                                value={signupForm.password}
                                                onChange={(e) => setSignupForm({ ...signupForm, password: e.target.value })}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <button onClick={handleSignup} className="w-full px-4 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition">
                                                Create Account
                                            </button>
                                            <p className="text-center text-gray-600 text-sm">
                                                Already have an account?{' '}
                                                <button onClick={() => setAuthMode('login')} className="text-gray-900 font-semibold hover:underline">
                                                    Sign in
                                                </button>
                                            </p>
                                        </div>
                                    )}

                                    {authMode === 'forgot' && (
                                        <div className="space-y-4">
                                            <p className="text-sm text-gray-600">Enter your email and we'll generate a password reset link for you.</p>
                                            <input
                                                type="email"
                                                placeholder="Email"
                                                value={forgotEmail}
                                                onChange={(e) => setForgotEmail(e.target.value)}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <button onClick={handleForgotPassword} className="w-full px-4 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition">
                                                Send Reset Link
                                            </button>
                                            <p className="text-center text-gray-600 text-sm">
                                                <button onClick={() => setAuthMode('login')} className="text-gray-900 font-semibold hover:underline">
                                                    Back to Sign In
                                                </button>
                                            </p>
                                        </div>
                                    )}

                                    {authMode === 'reset' && (
                                        <div className="space-y-4">
                                            {resetInfo && (
                                                <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 text-xs text-amber-800 break-all">
                                                    <p className="font-semibold mb-1">Demo mode — no email service configured</p>
                                                    <p>A reset token has been generated and pre-filled below. In production this would be emailed to you instead of shown here.</p>
                                                </div>
                                            )}
                                            <input
                                                type="password"
                                                placeholder="New password"
                                                value={resetPasswordForm.newPassword}
                                                onChange={(e) => setResetPasswordForm({ ...resetPasswordForm, newPassword: e.target.value })}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <input
                                                type="password"
                                                placeholder="Confirm new password"
                                                value={resetPasswordForm.confirmPassword}
                                                onChange={(e) => setResetPasswordForm({ ...resetPasswordForm, confirmPassword: e.target.value })}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:border-gray-400"
                                            />
                                            <button onClick={handleResetPassword} className="w-full px-4 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition">
                                                Reset Password
                                            </button>
                                            <p className="text-center text-gray-600 text-sm">
                                                <button onClick={() => setAuthMode('login')} className="text-gray-900 font-semibold hover:underline">
                                                    Back to Sign In
                                                </button>
                                            </p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // Preferences Setup (single page — budget, size/rooms, area of interest, nice-to-haves)
            if (preferencesSetup) {
                return (
                    <>
                    <div className="min-h-screen bg-white p-8">
                        <div className="max-w-2xl mx-auto">
                            <div className="mb-12">
                                <h1 className="text-4xl font-bold text-gray-900 mb-2">Welcome, {currentUser?.name}</h1>
                                <p className="text-gray-600">Let's set up your preferences to find your ideal home.</p>
                            </div>

                            <div className="bg-white border border-gray-200 rounded-xl p-12">
                                <CriteriaForm
                                    initial={{ budget: { min: 2000000, max: 5000000 }, cities: [], sizeMode: 'size', minSize: 80, minRooms: 3, features: [] }}
                                    onSave={handleCompleteSetup}
                                    submitLabel="🚀 Start Browsing!"
                                    allCities={allCities}
                                    allFeatures={allFeatures}
                                />
                            </div>
                        </div>
                    </div>
                    {showSearchingModal && (
                        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
                            <div className="bg-white rounded-2xl p-10 max-w-sm w-full mx-4 text-center shadow-2xl">
                                <div className="w-14 h-14 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-6"></div>
                                <h3 className="text-lg font-semibold text-gray-900 mb-2">Searching for your perfect home</h3>
                                <p className="text-sm text-gray-500">We're checking real listings that match your criteria…</p>
                            </div>
                        </div>
                    )}
                    </>
                );
            }

            // Main Dashboard
            const matchedProperties = (apiProperties.length > 0 ? apiProperties : mockProperties).filter(p => calculateScore(p) > 0);
            const relevantFeedbackCount = feedbackHistory.filter(f => f.relevant).length;
            const learningAccuracy = feedbackHistory.length > 0 ? Math.round((relevantFeedbackCount / feedbackHistory.length) * 100) : 0;

            return (
                <>
                <div className="min-h-screen bg-white flex">
                    {/* Sidebar */}
                    <div className="w-64 border-r border-gray-200 fixed left-0 top-0 bottom-0 bg-white">
                        <div className="p-8 border-b border-gray-200">
                            <h1 className="text-2xl font-bold text-gray-900">HomeRadar</h1>
                        </div>
                        
                        <nav className="p-6 space-y-2">
                            {[
                                { label: 'Dashboard', view: 'dashboard' },
                                { label: 'Properties', view: 'properties' },
                                { label: 'Saved', view: 'saved' },
                                { label: 'Messages', view: 'messages' },
                                { label: 'Profile', view: 'profile' }
                            ].map(item => (
                                <button
                                    key={item.view}
                                    onClick={() => setSelectedView(item.view)}
                                    className={`sidebar-nav-item w-full text-left px-4 py-3 rounded-lg font-medium transition ${
                                        selectedView === item.view
                                            ? 'active bg-indigo-50 text-indigo-700'
                                            : 'text-gray-700 hover:bg-gray-50'
                                    }`}
                                >
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <div className="absolute bottom-8 left-6 right-6 border-t border-gray-200 pt-6">
                            <div className="mb-4">
                                <p className="text-sm text-gray-600">{currentUser?.name}</p>
                                <p className="text-xs text-gray-500">{currentUser?.email}</p>
                            </div>
                            <button 
                                onClick={() => {
                                    authToken = null;
                                    localStorage.removeItem('homeradar_token');
                                    setCurrentUser(null);
                                    setPreferences({ ...DEFAULT_PREFERENCES });
                                    setShortlist([]);
                                    setFeedbackHistory([]);
                                    setSelectedProperty(null);
                                    setApiProperties([]);
                                }}
                                className="w-full px-4 py-2 text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition text-sm"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 ml-64">
                        {selectedView === 'dashboard' && (
                            <div className="p-12">
                                {/* Header */}
                                <div className="mb-12">
                                    <h1 className="text-4xl font-bold text-gray-900 mb-2">Good morning, {currentUser?.name?.split(' ')[0]}</h1>
                                    <p className="text-gray-600">We found {matchedProperties.length} properties that match your criteria</p>
                                </div>

                                {/* Stats */}
                                <div className="grid grid-cols-4 gap-6 mb-12">
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-indigo-600 mb-1">{matchedProperties.length}</div>
                                        <div className="text-sm text-gray-600 font-medium">Matched Properties</div>
                                    </div>
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-green-600 mb-1">{shortlist.length}</div>
                                        <div className="text-sm text-gray-600 font-medium">Shortlisted</div>
                                    </div>
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-purple-600 mb-1">{feedbackHistory.length}</div>
                                        <div className="text-sm text-gray-600 font-medium">Feedback Given</div>
                                    </div>
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-orange-600 mb-1">{learningAccuracy}%</div>
                                        <div className="text-sm text-gray-600 font-medium">Learning Accuracy</div>
                                    </div>
                                </div>

                                {/* Profile Section */}
                                <div className="mb-12">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-6">Your Criteria</h2>
                                    <div className="grid grid-cols-2 gap-6">
                                        <div className="card-subtle bg-white rounded-xl p-8">
                                            <h3 className="text-sm font-semibold text-gray-500 uppercase mb-3">Budget</h3>
                                            <p className="text-2xl font-semibold text-gray-900">DKK {(preferences.budget.min/1000000).toFixed(1)}M \u2013 {preferences.budget.max >= 50000000 ? '50M+' : (preferences.budget.max/1000000).toFixed(1) + 'M'}</p>
                                        </div>
                                        <div className="card-subtle bg-white rounded-xl p-8">
                                            <h3 className="text-sm font-semibold text-gray-500 uppercase mb-3">Areas</h3>
                                            <p className="text-lg font-semibold text-gray-900">{preferences.cities.join(', ')}</p>
                                        </div>
                                        <div className="card-subtle bg-white rounded-xl p-8 col-span-2">
                                            <h3 className="text-sm font-semibold text-gray-500 uppercase mb-3">Must-Have Features</h3>
                                            <div className="flex flex-wrap gap-2">
                                                {preferences.features.map(f => (
                                                    <span key={f} className="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-sm font-medium">
                                                        {f}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Preference Learning */}
                                <div className="mb-12 grid grid-cols-2 gap-6">
                                    <div className="card-subtle bg-white rounded-xl p-8">
                                        <h3 className="text-sm font-semibold text-gray-500 uppercase mb-4">Preference Learning</h3>
                                        <p className="text-xs text-gray-500 mb-4">Weight multipliers adjust ±5% each time you rate a match.</p>
                                        <div className="grid grid-cols-4 gap-3">
                                            {Object.entries(preferences.weights).map(([key, val]) => (
                                                <div key={key} className="bg-indigo-50 rounded-lg p-3 text-center">
                                                    <div className="text-[10px] font-semibold text-gray-500 uppercase mb-1">{key}</div>
                                                    <div className="text-lg font-bold text-indigo-600">{val.toFixed(2)}x</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="card-subtle bg-white rounded-xl p-8">
                                        <h3 className="text-sm font-semibold text-gray-500 uppercase mb-4">Recent Feedback</h3>
                                        {feedbackHistory.length === 0 ? (
                                            <p className="text-sm text-gray-500">Rate a match below to see feedback history</p>
                                        ) : (
                                            <div className="space-y-2 max-h-32 overflow-y-auto">
                                                {feedbackHistory.slice(0, 5).map((f, idx) => (
                                                    <div key={idx} className="text-xs text-gray-600">
                                                        {f.relevant ? '👍 Relevant' : '👎 Not for me'}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Properties */}
                                <div>
                                    <h2 className="text-xl font-semibold text-gray-900 mb-6">Matched Properties</h2>

                                    {propertiesError && (
                                        <div className="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 mb-6 text-sm">
                                            {propertiesError}
                                        </div>
                                    )}

                                    {propertiesLoading && apiProperties.length === 0 && (
                                        <div className="text-center py-16 text-gray-500">
                                            Loading properties…
                                        </div>
                                    )}

                                    {!propertiesLoading && !propertiesError && matchedProperties.length === 0 && (
                                        <div className="text-center py-16 text-gray-500 border border-dashed border-gray-300 rounded-xl">
                                            <p className="font-medium mb-1">No properties match your criteria yet.</p>
                                            <p className="text-sm">Try widening your budget, size, or area of interest in your Profile.</p>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-8">
                                        {matchedProperties.map(prop => (
                                            <PropertyCard
                                                key={prop.id}
                                                prop={prop}
                                                score={calculateScore(prop)}
                                                breakdown={calculateBreakdown(prop)}
                                                isShortlisted={!!shortlist.find(p => p.id === prop.id)}
                                                onToggleShortlist={toggleShortlist}
                                                onFeedback={handleFeedback}
                                                onOpenDetails={setSelectedProperty}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {selectedView === 'properties' && (
                            <div className="p-12">
                                <h1 className="text-3xl font-bold text-gray-900 mb-8">All Properties</h1>

                                {!propertiesLoading && !propertiesError && matchedProperties.length === 0 && (
                                    <div className="text-center py-16 text-gray-500 border border-dashed border-gray-300 rounded-xl">
                                        <p className="font-medium mb-1">No properties match your criteria yet.</p>
                                        <p className="text-sm">Try widening your budget, size, or area of interest in your Profile.</p>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-8">
                                    {matchedProperties.map(prop => (
                                        <PropertyCard
