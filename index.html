                                            key={prop.id}
                                            prop={prop}
                                            score={calculateScore(prop)}
                                            breakdown={calculateBreakdown(prop)}
                                            isShortlisted={!!shortlist.find(p => p.id === prop.id)}
                                            onToggleShortlist={toggleShortlist}
                                            onFeedback={handleFeedback}
                                            onOpenDetails={setSelectedProperty}
                                        />
                                    ))}
                                </div>
                            </div>
                        )}

                        {selectedView === 'saved' && (
                            <div className="p-12">
                                <h1 className="text-3xl font-bold text-gray-900 mb-8">Saved Properties</h1>
                                {shortlist.length === 0 ? (
                                    <p className="text-gray-600">Your saved properties will appear here.</p>
                                ) : (
                                    <div className="grid grid-cols-2 gap-8">
                                        {shortlist.map(prop => (
                                            <PropertyCard
                                                key={prop.id}
                                                prop={prop}
                                                score={calculateScore(prop)}
                                                breakdown={calculateBreakdown(prop)}
                                                isShortlisted={true}
                                                onToggleShortlist={toggleShortlist}
                                                onFeedback={handleFeedback}
                                                onOpenDetails={setSelectedProperty}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {selectedView === 'messages' && (
                            <div className="p-12">
                                <h1 className="text-3xl font-bold text-gray-900">Messages</h1>
                                <p className="text-gray-600 mt-4">Your messages will appear here.</p>
                            </div>
                        )}

                        {selectedView === 'profile' && (
                            <div className="p-12 max-w-3xl">
                                <h1 className="text-3xl font-bold text-gray-900 mb-8">Profile</h1>

                                <div className="card-subtle bg-white rounded-xl p-8 mb-8">
                                    <h2 className="text-lg font-semibold text-gray-900 mb-6">Account Details</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                            <input type="text" value={profileForm.name} onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                            <input type="email" value={profileForm.email} onChange={(e) => setProfileForm({ ...profileForm, email: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        </div>
                                    </div>
                                </div>

                                <div className="card-subtle bg-white rounded-xl p-8 mb-8">
                                    <h2 className="text-lg font-semibold text-gray-900 mb-2">Change Password</h2>
                                    <p className="text-xs text-gray-500 mb-6">Leave blank if you don't want to change your password.</p>
                                    <div className="space-y-4">
                                        <input type="password" placeholder="Current password" value={profileForm.currentPassword} onChange={(e) => setProfileForm({ ...profileForm, currentPassword: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        <input type="password" placeholder="New password" value={profileForm.newPassword} onChange={(e) => setProfileForm({ ...profileForm, newPassword: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        <input type="password" placeholder="Confirm new password" value={profileForm.confirmPassword} onChange={(e) => setProfileForm({ ...profileForm, confirmPassword: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                    </div>
                                </div>

                                <button onClick={handleUpdateProfile} className="px-6 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition mb-12">
                                    Save Account Changes
                                </button>

                                <div className="card-subtle bg-white rounded-xl p-8">
                                    <h2 className="text-lg font-semibold text-gray-900 mb-6">Search Preferences</h2>
                                    <CriteriaForm
                                        initial={preferences}
                                        onSave={handleUpdatePreferences}
                                        submitLabel="Save Preferences"
                                        allCities={allCities}
                                        allFeatures={allFeatures}
                                    />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
                {showSearchingModal && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
                        <div className="bg-white rounded-2xl p-10 max-w-sm w-full mx-4 text-center shadow-2xl">
                            <div className="w-14 h-14 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mx-auto mb-6"></div>
                            <h3 className="text-lg font-semibold text-gray-900 mb-2">Searching for your perfect home</h3>
                            <p className="text-sm text-gray-500">We're checking real listings that match your criteria…</p>
                        </div>
                    </div>
                )}
                {selectedProperty && (() => {
                    const prop = selectedProperty;
                    const score = calculateScore(prop);
                    const breakdown = calculateBreakdown(prop);
                    const isShortlisted = !!shortlist.find(p => p.id === prop.id);
                    const imageUrl = prop.thumbnail_url || (Array.isArray(prop.images) && prop.images.length > 0 ? prop.images[0] : null);
                    return (
                        <div className="fixed inset-0 bg-black/50 flex items-start justify-center z-50 p-4 overflow-y-auto" onClick={() => setSelectedProperty(null)}>
                            <div className="bg-white rounded-2xl max-w-3xl w-full my-8 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                                <div className="h-72 bg-gray-100 rounded-t-2xl overflow-hidden flex items-center justify-center text-gray-300">
                                    {imageUrl ? (
                                        <img src={imageUrl} alt={prop.address} className="w-full h-full object-cover" onError={(e) => { e.target.remove(); }} />
                                    ) : 'Photo'}
                                </div>
                                <div className="p-8">
                                    <button onClick={() => setSelectedProperty(null)} className="text-sm text-gray-500 hover:text-gray-700 font-medium mb-4">
                                        ← Back
                                    </button>

                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h2 className="text-2xl font-bold text-gray-900">{prop.address}</h2>
                                            <p className="text-gray-600 mt-1">{prop.city}{prop.postal_code ? ` · ${prop.postal_code}` : ''}</p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-3xl font-bold text-indigo-600">{score}%</div>
                                            <p className="text-xs text-gray-500 mt-1">Match Score</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 gap-4 my-6 py-6 border-y border-gray-200">
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Price</p>
                                            <p className="font-semibold text-gray-900">{(prop.price/1000000).toFixed(1)}M DKK</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Size</p>
                                            <p className="font-semibold text-gray-900">{prop.sqm || prop.size || 'N/A'} m²</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Rooms</p>
                                            <p className="font-semibold text-gray-900">{prop.bedrooms || prop.rooms || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Bathrooms</p>
                                            <p className="font-semibold text-gray-900">{prop.bathrooms || 'N/A'}</p>
                                        </div>
                                    </div>

                                    <div className="mb-6">
                                        <p className="text-xs font-semibold text-gray-500 uppercase mb-3">Why this matches</p>
                                        <div className="space-y-2">
                                            {[
                                                { label: 'Budget', val: breakdown.budget },
                                                { label: 'Location', val: breakdown.location },
                                                { label: 'Market', val: breakdown.market },
                                                { label: 'Value', val: breakdown.value }
                                            ].map(f => (
                                                <div key={f.label} className="flex items-center gap-3 relative group">
                                                    <div className="w-16 text-xs text-gray-500 border-b border-dotted border-gray-400 cursor-help">
                                                        {f.label}
                                                        <div className="hidden group-hover:block absolute left-0 bottom-full mb-2 w-56 bg-gray-900 text-white text-xs leading-snug rounded-lg p-3 shadow-xl z-20">
                                                            {FACTOR_EXPLANATIONS[f.label]}
                                                        </div>
                                                    </div>
                                                    <div className="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                                                        <div className="bg-indigo-500 h-full" style={{width: `${f.val}%`}}></div>
                                                    </div>
                                                    <div className="w-8 text-xs font-semibold text-gray-700 text-right">{f.val}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mb-6">
                                        <p className="text-xs font-semibold text-gray-500 uppercase mb-2">Description</p>
                                        <p className="text-gray-700 text-sm">
                                            {detailsLoading ? 'Loading full listing details…' : (prop.description || 'No additional description available for this listing.')}
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4 mb-6 text-sm">
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Property Type</p>
                                            <p className="text-gray-900">{prop.property_type || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Year Built</p>
                                            <p className="text-gray-900">{prop.year_built || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Listed</p>
                                            <p className="text-gray-900">{prop.listing_date ? new Date(prop.listing_date).toLocaleDateString('da-DK') : 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Energy Label</p>
                                            <p className="text-gray-900">{prop.energy_label || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Monthly Expense</p>
                                            <p className="text-gray-900">{prop.monthly_expense ? `${Number(prop.monthly_expense).toLocaleString('da-DK')} DKK` : 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Lot Size</p>
                                            <p className="text-gray-900">{prop.lot_area ? `${prop.lot_area} m²` : 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Source</p>
                                            <p className="text-gray-900">{prop.source || 'N/A'}{prop.verified ? ' · Verified' : ''}</p>
                                        </div>
                                    </div>

                                    {/* Contact Agent - keeps the user inside HomeRadar instead of needing to visit the original listing */}
                                    <div className="bg-gray-50 rounded-xl p-6 mb-6">
                                        <p className="text-xs font-semibold text-gray-500 uppercase mb-3">Contact Agent</p>
                                        {prop.agent_name && <p className="font-medium text-gray-900 mb-3">{prop.agent_name}</p>}
                                        <div className="flex flex-wrap gap-3">
                                            {prop.agent_email && (
                                                <a
                                                    href={`mailto:${prop.agent_email}?subject=${encodeURIComponent('Inquiry about ' + prop.address)}&body=${encodeURIComponent(`Hi ${prop.agent_name || ''},\n\nI'm interested in ${prop.address} (found via HomeRadar). Could you share more details or arrange a viewing?\n\nThanks!`)}`}
                                                    className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 transition"
                                                >
                                                    ✉️ Email Agent
                                                </a>
                                            )}
                                            {prop.agent_phone && (
                                                <a href={`tel:${prop.agent_phone}`} className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                                                    📞 {prop.agent_phone}
                                                </a>
                                            )}
                                            {!prop.agent_email && !prop.agent_phone && prop.source_url && !detailsLoading && (
                                                <a href={prop.source_url} target="_blank" rel="noopener noreferrer" className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                                                    View original listing to contact the agent →
                                                </a>
                                            )}
                                            {!prop.agent_email && !prop.agent_phone && detailsLoading && (
                                                <p className="text-sm text-gray-500">Checking for agent contact info…</p>
                                            )}
                                            {!prop.agent_email && !prop.agent_phone && !prop.source_url && !detailsLoading && (
                                                <p className="text-sm text-gray-500">No agent contact info available for this listing yet.</p>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex gap-3">
                                        <button onClick={() => toggleShortlist(prop)} className={`px-4 py-3 rounded-lg font-medium transition ${isShortlisted ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-gray-50 text-gray-700 border border-gray-200 hover:bg-gray-100'}`}>
                                            {isShortlisted ? '❤️ Saved' : '🤍 Save'}
                                        </button>
                                        <button onClick={() => handleFeedback(prop, true)} className="px-4 py-3 border border-green-200 text-green-700 rounded-lg font-medium hover:bg-green-50 transition">
                                            👍 Relevant
                                        </button>
                                        <button onClick={() => handleFeedback(prop, false)} className="px-4 py-3 border border-gray-200 text-gray-500 rounded-lg font-medium hover:bg-gray-50 transition">
                                            👎 Not for me
                                        </button>
                                        {prop.source_url && (
                                            <a href={prop.source_url} target="_blank" rel="noopener noreferrer" className="flex-1 px-4 py-3 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition text-center">
                                                View Original Listing
                                            </a>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                })()}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
