<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;
const { motion, AnimatePresence } = Motion;

/* ============================================================
   API — the real HomeRadar backend
   ============================================================ */
const API_URL = 'https://homeradar-backend.onrender.com';
const EASE = [0.16, 1, 0.3, 1];

const getToken = () => localStorage.getItem('homeradar_token');
const setToken = (t) => t ? localStorage.setItem('homeradar_token', t) : localStorage.removeItem('homeradar_token');

async function request(path, options = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  const token = getToken();
  if (token) headers.Authorization = 'Bearer ' + token;

  let res;
  try {
    res = await fetch(API_URL + path, Object.assign({}, options, { headers }));
  } catch (e) {
    // The free Render instance sleeps; say so instead of surfacing a raw TypeError.
    throw new Error('Could not reach HomeRadar. The service may be waking up (this can take ~50s) — try again shortly.');
  }
  const text = await res.text();
  let body = null;
  try { body = text ? JSON.parse(text) : null; } catch (e) { body = null; }
  if (!res.ok) throw new Error((body && body.error) || ('Request failed (' + res.status + ')'));
  return body;
}

const api = {
  login: (email, password) => request('/api/users/login', { method: 'POST', body: JSON.stringify({ email, password }) }),
  register: (email, password, first_name) => request('/api/users/register', { method: 'POST', body: JSON.stringify({ email, password, first_name }) }),
  profile: () => request('/api/users/profile'),
  savePreferences: (preferences) => request('/api/users/preferences', { method: 'PUT', body: JSON.stringify({ preferences }) }),
  feedback: (payload) => request('/api/users/feedback', { method: 'POST', body: JSON.stringify(payload) }),
  getFeedback: () => request('/api/users/feedback'),
  undoFeedback: (propertyId) => request('/api/users/feedback/' + propertyId, { method: 'DELETE' }),
  dingeo: (id) => request('/api/properties/' + id + '/dingeo'),
  property: (id) => request('/api/properties/' + id),
  properties: async (query = {}) => {
    const params = new URLSearchParams();
    Object.keys(query).forEach((k) => {
      if (query[k] !== undefined && query[k] !== null && query[k] !== '') params.set(k, String(query[k]));
    });
    const qs = params.toString() ? ('?' + params.toString()) : '';
    const body = await request('/api/properties' + qs);
    if (Array.isArray(body)) return body;
    return (body && (body.properties || body.data)) || [];
  }
};

/* ============================================================
   Formatting
   ============================================================ */
const num = (v) => {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : Number(v);
  return isFinite(n) ? n : null;
};
const dkkFmt = new Intl.NumberFormat('da-DK', { style: 'currency', currency: 'DKK', maximumFractionDigits: 0 });
const formatDkk = (v) => { const n = num(v); return n === null ? 'Price unknown' : dkkFmt.format(n); };
const formatDkkCompact = (v) => {
  const n = num(v);
  if (n === null) return 'Price unknown';
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M DKK';
  return Math.round(n / 1000) + 'k DKK';
};
const formatArea = (v) => { const n = num(v); return n === null ? '\u2014' : Math.round(n) + ' m\u00B2'; };
const fmtK = (v) => Math.abs(v) >= 1000000
  ? (v / 1000000).toFixed(1).replace(/\.0$/, '') + 'M DKK'
  : Math.round(v / 1000) + 'k DKK';
const formatDayMonth = (d) => d ? new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' }).format(d) : '\u2014';
const formatRelative = (d) => {
  if (!d) return 'unknown';
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hours = Math.round(mins / 60);
  if (hours < 24) return hours + ' h ago';
  const days = Math.round(hours / 24);
  if (days === 1) return 'yesterday';
  if (days < 30) return days + ' days ago';
  return new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).format(d);
};
const CHANNEL_LABELS = {
  agent_portal: 'Agent portal', boiq: 'Public portal', boligsiden: 'Public portal',
  facebook: 'Social channel', instagram: 'Social channel', developer: 'Developer site', newsletter: 'Newsletter'
};
const channelLabel = (s) => {
  if (!s) return 'Unknown channel';
  return CHANNEL_LABELS[s] || s.replace(/[_-]+/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
};
const toDate = (v) => { if (!v) return null; const d = new Date(v); return isNaN(d.getTime()) ? null : d; };
const daysBetween = (a, b) => Math.max(0, Math.round((b.getTime() - a.getTime()) / 86400000));

/* ============================================================
   LEAD TIME — the hero metric.
   Derived only from timestamps we hold: created_at (first seen by HomeRadar)
   vs listing_date (public). We never claim "pre-market", only the observed gap.
   ============================================================ */
const PRE_PUBLIC_SOURCES = ['agent_portal', 'instagram', 'facebook', 'developer', 'newsletter'];

function computeLeadTime(p) {
  const firstSeen = toDate(p.created_at);
  const publishedAt = toDate(p.listing_date);
  const daysOnRadar = firstSeen ? daysBetween(firstSeen, new Date()) : 0;
  let state = 'public';
  let daysEarly = null;

  if (!publishedAt) {
    state = PRE_PUBLIC_SOURCES.indexOf(p.source) !== -1 ? 'not_public' : 'public';
  } else if (firstSeen && publishedAt.getTime() > firstSeen.getTime()) {
    daysEarly = daysBetween(firstSeen, publishedAt);
    state = daysEarly > 0 ? 'early' : 'public';
  }

  let headline;
  if (state === 'not_public') headline = 'Not public yet \u00B7 Day ' + daysOnRadar + ' on your radar';
  else if (state === 'early') headline = 'You saw this ' + daysEarly + (daysEarly === 1 ? ' day early' : ' days early');
  else headline = daysOnRadar === 0 ? 'Found today' : ('On your radar for ' + daysOnRadar + ' days');

  return { state, daysEarly, daysOnRadar, firstSeen, publishedAt, headline };
}
const leadTimeRank = (l) => l.state === 'not_public' ? 2000 + l.daysOnRadar
  : l.state === 'early' ? 1000 + (l.daysEarly || 0)
  : Math.max(0, 100 - l.daysOnRadar);

/* ============================================================
   MATCHING — deterministic, band-first, always names a compromise
   ============================================================ */
const BASE_WEIGHTS = { budget: 24, location: 18, size: 14, features: 20, opportunity: 24 };
const BAND_LABEL = { excellent: 'Excellent match', strong: 'Strong match', partial: 'Partial match', weak: 'Weak match' };
const bandFor = (s) => s >= 85 ? 'excellent' : s >= 70 ? 'strong' : s >= 50 ? 'partial' : 'weak';

const normaliseArea = (v) => (v || '').trim().toLocaleLowerCase('da-DK')
  .replace(/k\u00f8benhavn/g, 'copenhagen')
  .replace(/\u00e5rhus/g, 'aarhus');

const POSTAL_AREA_NAMES = {
  '1000':'Copenhagen','1050':'Copenhagen','1100':'Copenhagen','1150':'Copenhagen','1200':'Copenhagen','1250':'Copenhagen','1300':'Copenhagen','1350':'Copenhagen','1400':'Copenhagen','1450':'Copenhagen','1500':'Copenhagen',
  '2000':'Frederiksberg','2100':'Copenhagen','2150':'Nordhavn','2200':'Copenhagen','2300':'Copenhagen','2400':'Copenhagen','2450':'Copenhagen','2500':'Valby','2600':'Glostrup','2610':'R\u00f8dovre','2620':'Albertslund','2630':'Taastrup','2650':'Hvidovre','2660':'Br\u00f8ndby Strand','2700':'Br\u00f8nsh\u00f8j','2720':'Vanl\u00f8se','2730':'Herlev','2800':'Kongens Lyngby',
  '3000':'Helsing\u00f8r','3400':'Hiller\u00f8d','4000':'Roskilde','4100':'Ringsted','4200':'Slagelse','4300':'Holb\u00e6k','4600':'K\u00f8ge','4700':'N\u00e6stved','4800':'Nyk\u00f8bing Falster',
  '5000':'Odense','5200':'Odense','5210':'Odense','5220':'Odense','5230':'Odense','5240':'Odense','5250':'Odense','5260':'Odense','5270':'Odense','5300':'Kerteminde','5500':'Middelfart','5600':'Faaborg','5700':'Svendborg','5800':'Nyborg',
  '6000':'Kolding','6100':'Haderslev','6200':'Aabenraa','6300':'Gr\u00e5sten','6400':'S\u00f8nderborg','6500':'Vojens','6600':'Vejen','6700':'Esbjerg','6800':'Varde','6900':'Skjern',
  '7000':'Fredericia','7100':'Vejle','7200':'Grindsted','7300':'Jelling','7400':'Herning','7500':'Holstebro','7600':'Struer','7700':'Thisted','7800':'Skive',
  '8000':'Aarhus','8200':'Aarhus','8210':'Aarhus','8220':'Brabrand','8230':'Aarhus','8240':'Risskov','8250':'Eg\u00e5','8260':'Viby J','8270':'H\u00f8jbjerg','8300':'Odder','8400':'Ebeltoft','8500':'Grenaa','8600':'Silkeborg','8700':'Horsens','8800':'Viborg','8900':'Randers',
  '9000':'Aalborg','9200':'Aalborg','9210':'Aalborg','9220':'Aalborg','9230':'Svenstrup J','9400':'N\u00f8rresundby','9500':'Hobro','9600':'Aars','9700':'Br\u00f8nderslev','9800':'Hj\u00f8rring','9900':'Frederikshavn'
};

const isPostalCode = (v) => /^\d{4}$/.test(String(v || '').trim());

/** Accepts "odense", "2100", "koebenhavn" and returns a tidy display token. */
function canonicalAreaName(value) {
  const trimmed = String(value || '').trim();
  if (!trimmed) return '';
  if (isPostalCode(trimmed)) return trimmed;
  return trimmed.toLocaleLowerCase('da-DK').replace(/(^|[\s-])\p{L}/gu, (m) => m.toLocaleUpperCase('da-DK'));
}

/** A postal code still needs a city name, because that is what the backend scraper resolves. */
function areaToCityName(token) {
  if (isPostalCode(token)) return POSTAL_AREA_NAMES[token] || null;
  return token;
}

// Listings are stored under Danish names ("K\u00f8benhavn \u00d8"), so an English-only
// query silently excludes almost the whole database.
const CITY_QUERY_ALIASES = {
  copenhagen: ['Copenhagen', 'K\u00f8benhavn'],
  aarhus: ['Aarhus', '\u00c5rhus']
};

/** Resolves the user's area tokens into the city strings the backend understands. */
function areasToCities(areas) {
  const out = [];
  (areas || []).forEach((a) => {
    const city = areaToCityName(a);
    if (city && out.indexOf(city) === -1) out.push(city);
  });
  return out;
}

function cityQueryTerms(areas) {
  const out = [];
  areasToCities(areas).forEach((c) => {
    const aliases = CITY_QUERY_ALIASES[normaliseArea(c)] || [c];
    aliases.forEach((a) => { if (out.indexOf(a) === -1) out.push(a); });
  });
  return out;
}
function areaMatches(p, areas) {
  const tokens = (areas || []).filter(Boolean);
  if (!tokens.length) return true;
  const city = normaliseArea(p.city);
  const postal = (p.postal_code || '').trim();
  return tokens.some((t) => {
    // A postal code is the precise signal; a name is a broader contains-match.
    if (isPostalCode(t)) return postal === t;
    const n = normaliseArea(t);
    return city && (city === n || city.indexOf(n) !== -1 || n.indexOf(city) !== -1);
  });
}

function budgetDimension(p, prefs, ctx) {
  const price = num(p.price);
  const min = prefs.budget.min, max = prefs.budget.max;
  if (price === null) return { dimension:'budget', score:50, text:'Price not published yet \u2014 we cannot check it against your budget.', isCompromise:true };
  if (price > max) return { dimension:'budget', score:0, text: fmtK(price - max) + ' above your ceiling.', isCompromise:true };

  const span = Math.max(1, max - min);
  const headroom = Math.round(100 - ((price - min) / span) * 40);

  // Position in your range says little when the range is wide; price per m2 against
  // comparable homes on the same radar is what actually separates these listings.
  const sqm = num(p.sqm);
  const perSqm = (sqm && price) ? price / sqm : null;
  let value = 55;
  let valueText = '';
  if (perSqm && ctx && ctx.medianPerSqm) {
    const delta = (perSqm - ctx.medianPerSqm) / ctx.medianPerSqm;
    value = Math.round(Math.min(100, Math.max(0, 55 - delta * 160)));
    const pct = Math.round(Math.abs(delta) * 100);
    if (pct >= 3) {
      valueText = pct + '% ' + (delta < 0 ? 'cheaper' : 'dearer') + ' per m\u00B2 than similar homes on your radar.';
    } else {
      valueText = 'Priced in line with similar homes on your radar.';
    }
  }

  const score = Math.round(headroom * 0.35 + value * 0.65);
  const under = max - price;
  const head = price < min
    ? 'Below the ' + fmtK(min) + ' floor you set.'
    : (under > 0 ? fmtK(under) + ' below your ceiling.' : 'Exactly at your ceiling.');

  return {
    dimension: 'budget',
    score,
    text: valueText ? (valueText + ' ' + head) : head,
    isCompromise: value < 45
  };
}

// The product's thesis, scored: how early you are, and how well corroborated.
function opportunityDimension(lead, sightings) {
  const channels = {};
  (sightings || []).forEach((s) => { if (s.source) channels[s.source] = true; });
  const corroboration = Math.max(1, Object.keys(channels).length);
  const bonus = Math.min(15, (corroboration - 1) * 10);

  if (lead.state === 'not_public') {
    return { dimension:'opportunity', score: Math.min(100, 92 + bonus),
      text: 'Not public anywhere else yet \u2014 day ' + lead.daysOnRadar + ' on your radar.', isCompromise:false };
  }
  if (lead.state === 'early') {
    const d = lead.daysEarly || 0;
    return { dimension:'opportunity', score: Math.min(100, 62 + Math.min(28, d * 4) + bonus),
      text: 'You reached this ' + d + ' day' + (d === 1 ? '' : 's') + ' before its public listing date.', isCompromise:false };
  }
  // Already public: the only edge left is freshness.
  const age = lead.publishedAt ? daysBetween(lead.publishedAt, new Date()) : lead.daysOnRadar;
  const score = Math.max(10, Math.round(58 - age * 1.4)) + bonus;
  return {
    dimension: 'opportunity',
    score: Math.min(100, score),
    text: age <= 3
      ? 'Published ' + (age === 0 ? 'today' : age + ' days ago') + ' \u2014 still early to the wider market.'
      : 'Publicly listed ' + age + ' days ago, so others have seen it too.',
    isCompromise: age > 21
  };
}

function locationDimension(p, prefs) {
  const inArea = areaMatches(p, prefs.areas || prefs.cities);
  const where = p.city || p.postal_code || 'an unlisted area';
  return {
    dimension:'location',
    score: inArea ? 100 : 35,
    text: inArea ? ('In ' + where + ', one of your chosen areas.') : (where + ' is outside the areas you chose.'),
    isCompromise: !inArea
  };
}

function sizeDimension(p, prefs) {
  if (prefs.sizeMode === 'rooms') {
    const rooms = p.bedrooms, min = prefs.minRooms || 0;
    if (rooms === null || rooms === undefined) return { dimension:'size', score:50, text:'Room count not published \u2014 ask the agent.', isCompromise:true };
    const ok = rooms >= min;
    return {
      dimension:'size',
      score: ok ? Math.min(100, 80 + (rooms - min) * 10) : 25,
      text: ok ? (rooms + ' rooms, ' + (rooms - min >= 1 ? (rooms - min) + ' more than' : 'exactly') + ' your minimum.')
               : (rooms + ' rooms is below your minimum of ' + min + '.'),
      isCompromise: !ok
    };
  }
  const sqm = num(p.sqm), min = prefs.minSize || 0;
  if (sqm === null) return { dimension:'size', score:50, text:'Floor area not published \u2014 ask the agent.', isCompromise:true };
  const ok = sqm >= min;
  return {
    dimension:'size',
    score: ok ? Math.min(100, 80 + Math.round(((sqm - min) / Math.max(min, 1)) * 40)) : 25,
    text: ok ? (Math.round(sqm) + ' m\u00B2, ' + Math.round(sqm - min) + ' m\u00B2 above your minimum.')
             : (Math.round(sqm) + ' m\u00B2 is under your ' + min + ' m\u00B2 minimum.'),
    isCompromise: !ok
  };
}

// Words too generic to be evidence of anything if they appear in a listing blurb.
const BRIEF_STOPWORDS = ['and','the','with','that','have','want','need','would','like','close','near','some','more','room','home','house','flat','looking','prefer','must','also','for','from','into','very','good','nice'];

function briefTerms(notes) {
  return String(notes || '')
    .toLocaleLowerCase('da-DK')
    .split(/[^\p{L}\p{N}]+/u)
    .filter((w) => w.length > 3 && BRIEF_STOPWORDS.indexOf(w) === -1)
    .slice(0, 12);
}

function featureDimension(p, prefs) {
  const chips = (prefs.features || []).filter(Boolean);
  const terms = briefTerms(prefs.notes);
  const wanted = chips.concat(terms.filter((t) => chips.every((c) => c.toLocaleLowerCase('da-DK') !== t)));

  if (!wanted.length) return { dimension:'features', score:70, text:'No must-have features set, so this is not scored.', isCompromise:false };
  const hay = ((p.description || '') + ' ' + (p.property_type || '')).toLocaleLowerCase('da-DK');
  const hits = wanted.filter((f) => hay.indexOf(f.toLocaleLowerCase('da-DK')) !== -1);
  const ratio = hits.length / wanted.length;
  const score = Math.round(40 + ratio * 60);
  if (!hits.length) return { dimension:'features', score, text:'None of what you asked for (' + wanted.slice(0, 4).join(', ') + ') is mentioned in the listing.', isCompromise:true };
  const missing = wanted.filter((f) => hits.indexOf(f) === -1);
  return {
    dimension:'features',
    score,
    text: missing.length ? ('Mentions ' + hits.join(', ') + '. No mention of ' + missing.slice(0, 4).join(', ') + '.')
                         : ('Mentions everything you asked for: ' + hits.join(', ') + '.'),
    isCompromise: missing.length > 0 && ratio < 0.5
  };
}

function hardConstraintFailure(p, prefs) {
  const price = num(p.price);
  if (price !== null && price > prefs.budget.max) return fmtK(price - prefs.budget.max) + ' over your budget ceiling';
  if (!areaMatches(p, prefs.areas || prefs.cities)) return (p.city || 'This area') + ' is not on your radar';
  if (prefs.sizeMode === 'size' && prefs.minSize) {
    const sqm = num(p.sqm);
    if (sqm !== null && sqm < prefs.minSize) return Math.round(prefs.minSize - sqm) + ' m\u00B2 under your minimum';
  }
  if (prefs.sizeMode === 'rooms' && prefs.minRooms) {
    const r = p.bedrooms;
    if (r !== null && r !== undefined && r < prefs.minRooms) return (prefs.minRooms - r) + ' room(s) under your minimum';
  }
  return null;
}

const clampWeight = (w) => isFinite(w) ? Math.min(2, Math.max(0.5, w)) : 1;

function computeMatch(p, prefs, ctx, lead, sightings) {
  const reasons = [
    budgetDimension(p, prefs, ctx),
    locationDimension(p, prefs),
    sizeDimension(p, prefs),
    featureDimension(p, prefs)
  ];
  if (lead) reasons.push(opportunityDimension(lead, sightings));
  let weighted = 0, total = 0;
  reasons.forEach((r) => {
    const w = BASE_WEIGHTS[r.dimension] * clampWeight((prefs.weights || {})[r.dimension]);
    weighted += r.score * w; total += w;
  });
  const score = Math.round(Math.min(100, Math.max(0, weighted / Math.max(total, 1))));
  const blockedBy = hardConstraintFailure(p, prefs);
  // Always name one compromise. A product that only reports good news is not trusted.
  const compromises = reasons.filter((r) => r.isCompromise).sort((a, b) => a.score - b.score);
  const compromise = compromises[0] || reasons.slice().sort((a, b) => a.score - b.score)[0] || null;
  return { score, band: bandFor(score), eligible: blockedBy === null, blockedBy, reasons, compromise };
}

/* ============================================================
   CONFIDENCE — calculated and shown separately from match
   ============================================================ */
const CONFIDENCE_BLURB = 'Confidence reflects how complete and reliable the available property information is \u2014 not how good the property is.';

function computeConfidence(p, sightings) {
  const channels = {};
  sightings.forEach((s) => { if (s.source) channels[s.source] = true; });
  const distinct = Object.keys(channels).length;
  const updated = toDate(p.updated_at) || toDate(p.created_at);
  const ageDays = updated ? Math.round((Date.now() - updated.getTime()) / 86400000) : 999;
  const hasImages = (p.images && p.images.length > 0) || !!p.thumbnail_url;

  const checks = [
    { pass: distinct > 1, w: 25, ok: distinct + ' independent sources agree', gap: 'Only one channel has reported this.' },
    { pass: !!p.verified, w: 15, ok: 'Source verified', gap: 'The source has not been verified.' },
    { pass: num(p.price) !== null, w: 20, ok: 'Price published', gap: 'No price published yet.' },
    { pass: num(p.sqm) !== null, w: 12, ok: 'Floor area published', gap: 'Floor area is not published.' },
    { pass: !!p.postal_code, w: 12, ok: 'Address precise to postcode', gap: 'Address is not precise to a postcode.' },
    { pass: ageDays <= 7, w: 10, ok: 'Observed within the last week', gap: 'Last observed ' + ageDays + ' days ago.' },
    { pass: hasImages, w: 6, ok: 'Images available', gap: 'No images published.' }
  ];
  const value = checks.reduce((s, c) => s + (c.pass ? c.w : 0), 0);
  return {
    label: value >= 70 ? 'high' : value >= 45 ? 'medium' : 'low',
    value,
    positives: checks.filter((c) => c.pass).map((c) => c.ok),
    gaps: checks.filter((c) => !c.pass).map((c) => c.gap)
  };
}

/* ============================================================
   DEDUPLICATION + PROVENANCE
   The backend enforces UNIQUE(source, source_id), so one home seen on three
   channels arrives as three rows. Grouping by normalised address turns them
   back into one opportunity — and the extra rows become the Discovery Timeline.
   ============================================================ */
const addressKey = (p) => ((p.address || '').toLocaleLowerCase('da-DK').replace(/[.,]/g, ' ').replace(/\s+/g, ' ').trim()) + '|' + ((p.postal_code || '').trim());

function groupSightings(rows) {
  const buckets = {};
  rows.forEach((r) => {
    const k = addressKey(r);
    (buckets[k] = buckets[k] || []).push(r);
  });
  return Object.keys(buckets).map((k) => buckets[k].slice().sort((a, b) =>
    ((toDate(b.updated_at) || 0) && toDate(b.updated_at).getTime() || 0) - ((toDate(a.updated_at) && toDate(a.updated_at).getTime()) || 0)
  ));
}

function completeness(p) {
  let s = 0;
  if (num(p.price) !== null) s += 3;
  if (num(p.sqm) !== null) s += 2;
  if (p.bedrooms) s += 1;
  if (p.description) s += 1;
  if ((p.images && p.images.length) || p.thumbnail_url) s += 1;
  if (p.agent_name) s += 1;
  if (p.verified) s += 2;
  return s;
}
const canonical = (sightings) => sightings.slice().sort((a, b) => completeness(b) - completeness(a))[0] || sightings[0];

function describeContribution(p) {
  const parts = [];
  if (num(p.price) !== null) parts.push('price');
  if (num(p.sqm) !== null) parts.push('floor area');
  if (p.bedrooms) parts.push('rooms');
  if ((p.images && p.images.length) || p.thumbnail_url) parts.push('images');
  if (p.agent_name) parts.push('agent contact');
  return parts.length ? ('Gave us: ' + parts.join(', ')) : 'Address sighting only';
}

function buildProvenance(sightings) {
  const primary = canonical(sightings);
  const events = [];
  sightings.forEach((s) => {
    const published = toDate(s.listing_date);
    if (published) events.push({
      at: published, channel: channelLabel(s.source), title: 'Published by source',
      detail: describeContribution(s), evidence: s.verified ? 'confirmed' : 'reported', isHomeRadar: false
    });
    const seen = toDate(s.created_at);
    if (seen) events.push({
      at: seen, channel: channelLabel(s.source), title: published ? 'Observed by HomeRadar' : 'First seen by HomeRadar',
      detail: describeContribution(s), evidence: s.verified ? 'confirmed' : 'reported', isHomeRadar: false
    });
  });
  events.sort((a, b) => a.at.getTime() - b.at.getTime());

  const channels = [];
  sightings.forEach((s) => { const c = channelLabel(s.source); if (channels.indexOf(c) === -1) channels.push(c); });
  const lastUpdated = toDate(primary.updated_at) || toDate(primary.created_at);
  if (lastUpdated) events.push({
    at: lastUpdated, channel: 'HomeRadar',
    title: sightings.length > 1 ? 'Merged and matched to your radar' : 'Matched to your radar',
    detail: sightings.length > 1 ? (channels.length + ' independent channels agree on this address') : 'Scored against your radar criteria',
    evidence: 'confirmed', isHomeRadar: true
  });

  return {
    events, corroboration: channels.length, sightings: sightings.length, channels, lastUpdated,
    verified: sightings.some((s) => !!s.verified), sourceUrl: primary.source_url || null
  };
}

const EVIDENCE_COPY = {
  confirmed:   { label: 'Confirmed',        help: 'Published by a verified source.', glyph: '\u2713' },
  reported:    { label: 'Reported',         help: 'From a source we have not independently verified.', glyph: '~' },
  unknown:     { label: 'Unknown',          help: 'Not published anywhere we can see. Ask the agent.', glyph: '?' },
  conflicting: { label: 'Sources disagree', help: 'Two or more sources report different values.', glyph: '\u2260' }
};

function pickEvidence(present, conflicting, verified) {
  if (conflicting) return 'conflicting';
  if (!present) return 'unknown';
  return verified ? 'confirmed' : 'reported';
}

function buildFacts(p, sightings) {
  const uniq = (vals) => { const out = []; vals.forEach((v) => { if (v !== null && out.indexOf(v) === -1) out.push(v); }); return out; };
  const prices = uniq(sightings.map((s) => num(s.price)));
  const areas = uniq(sightings.map((s) => num(s.sqm)));
  const note = channelLabel(p.source);

  return [
    { label:'Price', value: formatDkk(p.price), evidence: pickEvidence(num(p.price) !== null, prices.length > 1, p.verified), sourceNote: prices.length > 1 ? (prices.length + ' sources disagree') : note },
    { label:'Floor area', value: num(p.sqm) !== null ? (Math.round(num(p.sqm)) + ' m\u00B2') : 'Not published', evidence: pickEvidence(num(p.sqm) !== null, areas.length > 1, p.verified), sourceNote: areas.length > 1 ? (areas.length + ' sources disagree') : note },
    { label:'Rooms', value: p.bedrooms ? String(p.bedrooms) : 'Not published', evidence: pickEvidence(!!p.bedrooms, false, p.verified), sourceNote: note },
    { label:'Property type', value: p.property_type || 'Not published', evidence: pickEvidence(!!p.property_type, false, p.verified), sourceNote: note },
    { label:'Year built', value: p.year_built ? String(p.year_built) : 'Not published', evidence: p.year_built ? 'reported' : 'unknown', sourceNote: p.year_built ? 'Public address register' : 'Ask the agent' },
    { label:'Energy label', value: p.energy_label || 'Not published', evidence: p.energy_label ? 'confirmed' : 'unknown', sourceNote: p.energy_label ? note : 'Ask the agent' },
    { label:'Monthly expense', value: p.monthly_expense ? formatDkk(p.monthly_expense) : 'Not published', evidence: p.monthly_expense ? 'reported' : 'unknown', sourceNote: p.monthly_expense ? note : 'Ask the agent' },
    { label:'Lot size', value: p.lot_area ? (p.lot_area + ' m\u00B2') : 'Not published', evidence: p.lot_area ? 'reported' : 'unknown', sourceNote: p.lot_area ? note : 'Ask the agent' }
  ];
}

function buildContext(rows) {
  const perSqm = rows
    .map((r) => { const pr = num(r.price), s = num(r.sqm); return (pr && s) ? pr / s : null; })
    .filter((v) => v !== null)
    .sort((a, b) => a - b);
  return { medianPerSqm: perSqm.length ? perSqm[Math.floor(perSqm.length / 2)] : null };
}

function buildOpportunities(rows, prefs) {
  const ctx = buildContext(rows);
  return groupSightings(rows).map((sightings) => {
    const property = canonical(sightings);
    const leadTime = computeLeadTime(property);
    return {
      property, sightings, leadTime, ctx,
      match: computeMatch(property, prefs, ctx, leadTime, sightings),
      confidence: computeConfidence(property, sightings),
      provenance: buildProvenance(sightings),
      facts: buildFacts(property, sightings)
    };
  });
}

function sortOpportunities(items, key) {
  const s = items.slice();
  if (key === 'match') return s.sort((a, b) => b.match.score - a.match.score);
  if (key === 'newest') return s.sort((a, b) => ((b.leadTime.firstSeen && b.leadTime.firstSeen.getTime()) || 0) - ((a.leadTime.firstSeen && a.leadTime.firstSeen.getTime()) || 0));
  if (key === 'confidence') return s.sort((a, b) => (b.confidence.value - a.confidence.value) || (b.match.score - a.match.score));
  return s.sort((a, b) => (leadTimeRank(b.leadTime) - leadTimeRank(a.leadTime)) || (b.match.score - a.match.score));
}

const MATCH_DISCLAIMER = 'Match measures fit with your radar. It is not a valuation or a recommendation to buy. Always confirm details with the seller or estate agent.';

/* ============================================================
   FEEDBACK -> LEARNING
   A written reason is mapped to the scoring dimensions it actually mentions,
   so "too close to a noisy road" moves location rather than nudging every
   weight equally. Quick chips carry the same mapping without any typing.
   ============================================================ */
const FEEDBACK_SIGNAL_KEYWORDS = {
  budget: ['price','priced','expensive','cheap','cheaper','afford','affordable','budget','cost','costly','overpriced','pricey','value for money'],
  location: ['location','area','neighbourhood','neighborhood','close','closer','near','far','distance','commute','work','school','transport','transit','metro','station','central','centre','center','quiet','noisy','noise','street','traffic','safe','safety','walk','district'],
  size: ['size','space','spacious','small','tiny','big','large','room','rooms','bedroom','bathroom','sqm','m2','square','floor area','layout','cramped'],
  features: ['garden','balcony','terrace','parking','condition','renovated','renovation','modern','old','dated','quality','light','bright','dark','view','kitchen','bathroom fittings','style','character','outdoor']
};

function analyzeFeedbackReason(reason) {
  const text = String(reason || '').toLowerCase();
  if (!text.trim()) return [];
  return Object.keys(FEEDBACK_SIGNAL_KEYWORDS).filter((dim) =>
    FEEDBACK_SIGNAL_KEYWORDS[dim].some((kw) => text.indexOf(kw) !== -1)
  );
}

const FEEDBACK_CHIPS = {
  relevant: [
    { label: 'Right price', dim: 'budget' },
    { label: 'Right area', dim: 'location' },
    { label: 'Right size', dim: 'size' },
    { label: 'Has what I want', dim: 'features' },
    { label: 'Good condition', dim: 'features' }
  ],
  not: [
    { label: 'Too expensive', dim: 'budget' },
    { label: 'Wrong area', dim: 'location' },
    { label: 'Too small', dim: 'size' },
    { label: 'Missing features', dim: 'features' },
    { label: 'Condition concerns', dim: 'features' }
  ]
};

const DIMENSION_NAMES = { budget: 'price', location: 'location', size: 'size', features: 'features', opportunity: 'how early it is' };

function listPhrase(items) {
  if (!items.length) return 'these criteria';
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}

const DEFAULT_PREFERENCES = {
  budget: { min: 1000000, max: 5000000 },
  areas: ['Copenhagen'],
  cities: ['Copenhagen'],
  sizeMode: 'size',
  minSize: 80,
  minRooms: 3,
  features: ['Garden'],
  notes: '',
  weights: { budget: 1, location: 1, size: 1, features: 1, opportunity: 1 },
  consent: { criteria: true, explicitFeedback: true, behaviour: false }
};

/** `cities` is what the backend scraper consumes, so always derive it from `areas`. */
function withDerivedCities(prefs) {
  const areas = (prefs.areas || []).filter(Boolean);
  return Object.assign({}, prefs, { areas, cities: areasToCities(areas) });
}

function normalisePrefs(input) {
  if (!input) return null;
  // Accounts created before free-text areas existed only have `cities`.
  const areas = (Array.isArray(input.areas) && input.areas.length)
    ? input.areas
    : (Array.isArray(input.cities) && input.cities.length ? input.cities : DEFAULT_PREFERENCES.areas);
  return withDerivedCities(Object.assign({}, DEFAULT_PREFERENCES, input, {
    budget: Object.assign({}, DEFAULT_PREFERENCES.budget, input.budget || {}),
    weights: Object.assign({}, DEFAULT_PREFERENCES.weights, input.weights || {}),
    consent: Object.assign({}, DEFAULT_PREFERENCES.consent, input.consent || {}),
    areas: areas.map(canonicalAreaName).filter(Boolean),
    features: Array.isArray(input.features) ? input.features : [],
    notes: typeof input.notes === 'string' ? input.notes : ''
  }));
}

/** The free backend tier sleeps; after a few seconds say so rather than spinning silently. */
function ColdStartNotice({ after = 4000 }) {
  const [show, setShow] = useState(false);

function Button({ children, onClick, variant = 'primary', disabled, className = '', type = 'button' }) {

    </button>
  );
}

// Driven by rAF rather than Motion.animate, whose numeric overload isn't in the UMD build.
// rAF is paused in background tabs, so a timer guarantees the final value lands regardless.
function CountUp({ to, className }) {
  const target = Number(to) || 0;
  const [v, setV] = useState(target);
  useEffect(() => {
    const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) { setV(target); return; }

    setV(0);
    let frame;
    const start = performance.now();
    const duration = 900;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      setV(Math.round(target * (1 - Math.pow(1 - t, 3))));
      if (t < 1) frame = requestAnimationFrame(tick);
    };
    frame = requestAnimationFrame(tick);
    const settle = window.setTimeout(() => setV(target), duration + 120);
    return () => { cancelAnimationFrame(frame); window.clearTimeout(settle); };
  }, [target]);
  return <span className={className}>{v}</span>;
}

/* ---------- Match + confidence ---------- */
function MatchDial({ match, size = 'md' }) {
  const dim = size === 'lg' ? 148 : size === 'sm' ? 72 : 104;

        <svg width={dim} height={dim} style={{ transform: 'rotate(-90deg)' }}>

          <motion.circle cx={dim / 2} cy={dim / 2} r={r} fill="none" stroke="#14213D" strokeWidth={stroke} strokeLinecap="round"
            strokeDasharray={circ}

function DiscoveryTimeline({ provenance, lead }) {
  const receipt = lead.state === 'not_public'
    ? ('You are seeing this ' + lead.daysOnRadar + ' day' + (lead.daysOnRadar === 1 ? '' : 's') + ' into its life, and before any public portal we watch has published it.')
    : lead.state === 'early' && lead.daysEarly
      ? ('HomeRadar observed this ' + lead.daysEarly + ' day' + (lead.daysEarly === 1 ? '' : 's') + ' before its recorded public listing date.')
      : 'This was already public when HomeRadar first observed it.';

  return (
    <section>
      <p className="hr-label">How we found it</p>

      {provenance.sightings > 1 && (
        <div className="mt-3 rounded-control bg-navy-50 p-4 ring-1 ring-navy-100">
          <p className="text-sm font-semibold text-navy-700">
            Merged from {provenance.sightings} sightings across {provenance.corroboration} channels
          </p>
          <p className="mt-1 text-xs text-navy-400">You would have found this {provenance.sightings} separate times elsewhere.</p>
        </div>
      )}

      <ol className="mt-5">
        {provenance.events.map((e, i) => (
          <motion.li key={i} initial={{ opacity: 0, y: 8 }} animate={{ opacity: 1, y: 0 }}
            transition={{ delay: i * 0.06, duration: 0.28, ease: EASE }}
            className="relative flex gap-4 pb-6 last:pb-0">
            {i !== provenance.events.length - 1 && <span aria-hidden="true" className="absolute left-[7px] top-4 h-full w-px bg-navy-100" />}
            <span aria-hidden="true" className={'relative z-10 mt-1 h-3.5 w-3.5 shrink-0 rounded-full ring-4 ring-white ' + (e.isHomeRadar ? 'bg-signal-500' : 'bg-navy-300')} />
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-baseline gap-x-3 gap-y-1">
                <time className="text-xs font-semibold text-navy-400">{formatDayMonth(e.at)}</time>
                <p className="text-sm font-semibold text-navy-700">{e.title}</p>
                <EvidencePill state={e.evidence} />
              </div>
              <p className="mt-1 text-sm text-navy-500">{e.channel}</p>
              <p className="mt-0.5 text-xs text-navy-400">{e.detail}</p>
            </div>
          </motion.li>
        ))}
      </ol>

      <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }}
        transition={{ delay: provenance.events.length * 0.06 + 0.1, duration: 0.3 }}
        className="mt-2 rounded-control border border-signal-200 bg-signal-50 p-4">
        <p className="text-sm font-semibold text-navy-700">{receipt}</p>
      </motion.div>
    </section>
  );
}

function ProvenancePanel({ provenance, facts }) {
  return (
    <section>
      <p className="hr-label">What we know, and how we know it</p>
      <div className="mt-3 overflow-hidden rounded-card ring-1 ring-navy-100">
        <table className="w-full border-collapse text-sm">
          <thead>
            <tr className="bg-navy-50 text-left">
              <th className="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-navy-400">Attribute</th>
              <th className="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-navy-400">Value</th>
              <th className="px-4 py-3 text-xs font-semibold uppercase tracking-wide text-navy-400">Evidence</th>
              <th className="hidden px-4 py-3 text-xs font-semibold uppercase tracking-wide text-navy-400 sm:table-cell">Source</th>
            </tr>
          </thead>
          <tbody>
            {facts.map((f) => (
              <tr key={f.label} className="border-t border-navy-100">
                <th scope="row" className="px-4 py-3 text-left font-medium text-navy-600">{f.label}</th>
                <td className={'px-4 py-3 ' + (f.evidence === 'unknown' ? 'text-slate-400' : 'text-navy-700')}>{f.value}</td>
                <td className="px-4 py-3"><EvidencePill state={f.evidence} /></td>
                <td className="hidden px-4 py-3 text-xs text-navy-400 sm:table-cell">{f.sourceNote}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="mt-4 flex flex-wrap items-center gap-x-6 gap-y-2 text-xs text-navy-400">
        <span>Channels: {provenance.channels.join(' \u00B7 ')}</span>
        <span>Last updated {formatRelative(provenance.lastUpdated)}</span>
        {provenance.verified && <span className="font-semibold text-verify-700">Source verified</span>}
        {provenance.sourceUrl && (
          <a href={provenance.sourceUrl} target="_blank" rel="noopener noreferrer" className="font-semibold text-navy-600 underline underline-offset-2">
            View original listing
          </a>
        )}
      </div>
    </section>
  );
}

function CorroborationRow({ provenance }) {
  return (
    <div className="flex flex-wrap items-center gap-x-2 gap-y-1 text-xs text-navy-400">
      <span aria-hidden="true" className="flex gap-1">
        {provenance.channels.slice(0, 4).map((c) => <span key={c} className="h-1.5 w-1.5 rounded-full bg-navy-300" />)}
      </span>
      <span className="font-semibold text-navy-500">
        {provenance.corroboration} {provenance.corroboration === 1 ? 'source' : 'independent sources'}
      </span>
      <span aria-hidden="true">{'\u00B7'}</span>
      <span>{provenance.channels.join(', ')}</span>
    </div>
  );
}

/* ---------- Opportunity card ---------- */
function OpportunityCard({ opportunity, saved, onToggleSave, onVerdict, onOpen, index = 0 }) {
  const p = opportunity.property;
  const image = p.thumbnail_url || (p.images && p.images[0]) || null;
  return (
    <motion.article initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }}
      transition={{ delay: Math.min(index * 0.05, 0.3), duration: 0.32, ease: EASE }}
      whileHover={{ y: -3 }} className="hr-card overflow-hidden transition-shadow hover:shadow-lift">
      <div className="p-6 sm:p-8">
        <div className="flex flex-wrap items-center justify-between gap-3">
          <LeadTimeBadge lead={opportunity.leadTime} />
          <button type="button" onClick={onToggleSave} aria-pressed={saved}
            className={'rounded-full px-3 py-1.5 text-xs font-semibold ring-1 transition ' +
              (saved ? 'bg-navy-700 text-white ring-navy-700' : 'bg-white text-navy-500 ring-navy-200 hover:ring-navy-400')}>
            {saved ? 'Shortlisted' : 'Shortlist'}
          </button>
        </div>

        <div className="mt-5 flex flex-col gap-6 sm:flex-row">
          {image && <img src={image} alt={p.address} loading="lazy" className="h-40 w-full rounded-control object-cover sm:w-56" />}
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-baseline gap-x-4 gap-y-1">
              <p className="text-lg font-bold text-navy-700">{BAND_LABEL[opportunity.match.band]}</p>
              <span className="text-sm font-semibold text-navy-300">{opportunity.match.score}</span>
              <span aria-hidden="true" className="text-navy-200">|</span>
              <span className="text-sm font-medium capitalize text-navy-500">{opportunity.confidence.label} confidence</span>
            </div>
            <h3 className="mt-2 truncate text-base font-semibold text-navy-700">
              <a href={'#/opportunity/' + p.id} className="hover:underline">{p.address}</a>
            </h3>
            <p className="text-sm text-navy-400">{[p.city, p.postal_code].filter(Boolean).join(' \u00B7 ') || 'Area not published'}</p>
            <p className="mt-3 text-sm text-navy-600">
              {formatDkkCompact(p.price)} {'\u00B7'} {formatArea(p.sqm)}{p.bedrooms ? ' \u00B7 ' + p.bedrooms + ' rooms' : ''}
            </p>
          </div>
        </div>

        <div className="mt-6"><WhyThisMatches match={opportunity.match} compact /></div>
        <div className="mt-5 border-t border-navy-100 pt-4"><CorroborationRow provenance={opportunity.provenance} /></div>

        <div className="mt-5 flex flex-wrap gap-3">
          <button type="button" onClick={onOpen} className="rounded-control bg-navy-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-navy-600">
            View opportunity
          </button>
          <button type="button" onClick={() => onVerdict(true)} className="rounded-control border border-verify-100 bg-verify-50 px-4 py-3 text-sm font-semibold text-verify-700 transition hover:border-verify-500">
            Relevant
          </button>
          <button type="button" onClick={() => onVerdict(false)} className="rounded-control border border-navy-200 px-4 py-3 text-sm font-semibold text-navy-500 transition hover:border-navy-400">
            Not for me
          </button>
        </div>
      </div>
    </motion.article>
  );
}

/* ============================================================
   Shell + navigation (hash routing so it works from file://)
   ============================================================ */
const NAV = [
  { path: '/home', label: 'Home' },
  { path: '/discoveries', label: 'Discoveries' },
  { path: '/shortlist', label: 'Shortlist' },
  { path: '/radar', label: 'Your Radar' }
];

function NavIcon({ path }) {
  if (path === '/home') return <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>;
  if (path === '/discoveries') return <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" strokeWidth="1.7" /><circle cx="12" cy="12" r="4" stroke="currentColor" strokeWidth="1.7" /><path d="M12 12 19 6.5" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /></svg>;
  if (path === '/shortlist') return <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.35-7-9a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 4.65-7 9-7 9Z" stroke="currentColor" strokeWidth="1.7" strokeLinejoin="round" /></svg>;
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" /><circle cx="9" cy="7" r="2" fill="currentColor" /><circle cx="15" cy="12" r="2" fill="currentColor" /><circle cx="11" cy="17" r="2" fill="currentColor" /></svg>;
}

function AppShell({ route, user, onSignOut, count, children }) {
  return (
    <div className="min-h-screen bg-canvas">
      <aside className="fixed inset-y-0 left-0 hidden w-64 flex-col border-r border-navy-100 bg-white lg:flex">
        <a href="#/" className="flex items-center gap-2.5 px-6 py-6 text-navy-700 transition hover:opacity-80" aria-label="HomeRadar home">
          <BrandMark size={34} />
          <span className="font-bold tracking-display">HomeRadar</span>
        </a>
        <nav className="flex-1 px-3">
          {NAV.map((n) => {
            const active = route.indexOf(n.path) === 0;
            return (
              <a key={n.path} href={'#' + n.path}
                className={'mb-1 flex items-center gap-3 rounded-control px-3 py-2.5 text-sm font-medium transition ' +
                  (active ? 'bg-navy-50 text-navy-700' : 'text-navy-400 hover:bg-navy-50 hover:text-navy-600')}>
                <NavIcon path={n.path} />
                <span className="flex-1">{n.label}</span>
                {n.path === '/discoveries' && count ? (
                  <span className="rounded-full bg-navy-100 px-2 py-0.5 text-[11px] font-semibold text-navy-600">{count}</span>
                ) : null}
              </a>
            );
          })}
        </nav>
        <div className="border-t border-navy-100 p-4">
          <div className="flex items-center gap-2 text-xs font-semibold text-verify-700">
            <span className="h-2 w-2 rounded-full bg-verify-500" />Radar active
          </div>
          <p className="mt-2 truncate text-xs text-navy-400">{user && user.email}</p>
          <button type="button" onClick={onSignOut} className="mt-2 text-xs font-semibold text-navy-500 hover:text-navy-700">Sign out</button>
        </div>
      </aside>

      <main className="pb-24 lg:ml-64 lg:pb-0">{children}</main>

      <nav className="fixed inset-x-0 bottom-0 z-20 flex border-t border-navy-100 bg-white lg:hidden">
        {NAV.map((n) => {
          const active = route.indexOf(n.path) === 0;
          return (
            <a key={n.path} href={'#' + n.path}
              className={'flex flex-1 flex-col items-center gap-1 py-3 text-[11px] font-medium ' + (active ? 'text-navy-700' : 'text-navy-300')}>
              <NavIcon path={n.path} />{n.label}
            </a>
          );
        })}
      </nav>
    </div>
  );
}

function PageHeader({ title, subtitle }) {
  return (
    <header className="border-b border-navy-100 px-6 py-8 sm:px-10">
      <h1 className="text-3xl font-bold tracking-display text-navy-700 sm:text-4xl">{title}</h1>
      {subtitle && <p className="mt-2 text-sm text-navy-400">{subtitle}</p>}
    </header>
  );
}

/* ============================================================
   PRIORITY 1: Discovery Dashboard
   Answers "what changed and what deserves attention first" — deliberately not
   a duplicate of the Discoveries feed.
   ============================================================ */
function BigRadar() {
  return (
    <svg aria-hidden="true" viewBox="0 0 200 200" className="pointer-events-none absolute -right-10 -top-10 h-64 w-64 opacity-40 sm:h-80 sm:w-80">
      <circle cx="100" cy="100" r="90" stroke="white" strokeOpacity=".18" fill="none" />
      <circle cx="100" cy="100" r="60" stroke="white" strokeOpacity=".18" fill="none" />
      <circle cx="100" cy="100" r="30" stroke="white" strokeOpacity=".18" fill="none" />
      <path className="hr-sweep" d="M100 100 L100 10 A90 90 0 0 1 163 37 Z" fill="#FCA311" fillOpacity=".28" style={{ transformOrigin: '100px 100px' }} />
    </svg>
  );
}

function Kpi({ label, value, hint, accent }) {
  return (
    <div className={'hr-card p-5 ' + (accent ? 'ring-1 ring-signal-200' : '')}>
      <p className={'text-3xl font-bold ' + (accent ? 'text-signal-600' : 'text-navy-700')}>{value}</p>
      <p className="mt-1 text-sm font-medium text-navy-600">{label}</p>
      <p className="text-xs text-navy-400">{hint}</p>
    </div>
  );
}

function HomePage({ user, data, onOpen }) {
  const { loading, error, eligible, nearMiss } = data;
  const lead = eligible[0] || null;
  const notPublic = eligible.filter((o) => o.leadTime.state === 'not_public');
  const early = eligible.filter((o) => o.leadTime.state === 'early');
  const fresh = eligible.filter((o) => o.leadTime.daysOnRadar <= 1);
  const avg = eligible.length ? Math.round(eligible.reduce((s, o) => s + o.match.score, 0) / eligible.length) : 0;
  const channelSet = {};
  eligible.forEach((o) => o.provenance.channels.forEach((c) => { channelSet[c] = true; }));

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

  return (
    <div className="mx-auto max-w-5xl px-6 py-10 sm:px-10">
      <p className="text-sm text-navy-400">{greeting}, {(user && user.first_name) || 'there'}</p>

      <motion.section initial={{ opacity: 0, y: 12 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.4, ease: EASE }}
        className="relative mt-4 overflow-hidden rounded-card bg-navy-700 p-8 text-white sm:p-10">
        <BigRadar />
        <div className="relative max-w-xl">
          <h1 className="text-3xl font-bold leading-tight tracking-display sm:text-4xl">
            {loading ? 'Sweeping your channels\u2026'
              : 'HomeRadar is tracking ' + eligible.length + (eligible.length === 1 ? ' opportunity' : ' opportunities')}
          </h1>
          <p className="mt-3 text-navy-100">
            {notPublic.length > 0
              ? notPublic.length + (notPublic.length === 1 ? " isn't" : " aren't") + ' public anywhere else yet.'
              : early.length > 0
                ? 'You reached ' + early.length + ' of them before their public listing date.'
                : 'Your radar is quiet right now.'}
          </p>
          <a href="#/discoveries" className="mt-6 inline-block rounded-control bg-signal-500 px-5 py-3 text-sm font-semibold text-navy-800 transition hover:bg-signal-400">
            Review discoveries
          </a>
        </div>
      </motion.section>

      <div className="mt-6 grid grid-cols-2 gap-4 lg:grid-cols-4">
        <Kpi label="New discoveries" value={fresh.length} hint="in the last 24 hours" />
        <Kpi label="Avg. match" value={avg} hint="across your radar" />
        <Kpi label="Source signals" value={Object.keys(channelSet).length} hint="channels reporting" />
        <Kpi label="Not public yet" value={notPublic.length} hint="ahead of the portals" accent />
      </div>

      {error && <p role="alert" className="mt-6 rounded-control bg-red-50 p-4 text-sm text-red-700">{error}</p>}
{loading && <div className="mt-10"><Spinner label="Scanning your channels\u2026" /><ColdStartNotice /></div>}

      {!loading && lead && (
        <section className="mt-10">
          <p className="hr-label">Today's lead</p>
          <motion.article initial={{ opacity: 0, y: 16 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.4, ease: EASE }} className="hr-card mt-3 overflow-hidden">
            <div className="flex flex-col gap-8 p-6 sm:p-8 lg:flex-row">
              <div className="lg:w-64">
                {(lead.property.thumbnail_url || (lead.property.images && lead.property.images[0]))
                  ? <img src={lead.property.thumbnail_url || lead.property.images[0]} alt={lead.property.address} className="h-48 w-full rounded-control object-cover" />
                  : <div className="grid h-48 w-full place-items-center rounded-control bg-navy-50 text-xs text-navy-300">No image published</div>}
                <div className="mt-6 flex justify-center"><MatchDial match={lead.match} /></div>
              </div>
              <div className="min-w-0 flex-1">
                <LeadTimeBadge lead={lead.leadTime} size="lg" />
                <h2 className="mt-4 text-xl font-bold text-navy-700">{lead.property.address}</h2>
                <p className="text-sm text-navy-400">{[lead.property.city, lead.property.postal_code].filter(Boolean).join(' \u00B7 ')}</p>
                <p className="mt-2 text-sm text-navy-600">
                  {formatDkkCompact(lead.property.price)} {'\u00B7'} {formatArea(lead.property.sqm)}
                  {lead.property.bedrooms ? ' \u00B7 ' + lead.property.bedrooms + ' rooms' : ''} {'\u00B7'} {lead.confidence.label} confidence
                </p>
                <div className="mt-6"><WhyThisMatches match={lead.match} compact /></div>
                <div className="mt-5 border-t border-navy-100 pt-4">
                  <CorroborationRow provenance={lead.provenance} />
                  <p className="mt-1 text-xs text-navy-400">Updated {formatRelative(lead.provenance.lastUpdated)}</p>
                </div>
                <button type="button" onClick={() => onOpen(lead.property.id)} className="mt-6 rounded-control bg-navy-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-navy-600">
                  View opportunity
                </button>
              </div>
            </div>
          </motion.article>
        </section>
      )}

      {/* The dashboard must never resolve to nothing. */}
      {!loading && !lead && (
        <section className="mt-10">
          <div className="hr-card p-8">
            <h2 className="text-lg font-bold text-navy-700">Nothing inside your radar yet</h2>
            <p className="mt-2 text-sm text-navy-400">
              {nearMiss.length > 0
                ? nearMiss.length + (nearMiss.length === 1 ? ' opportunity misses' : ' opportunities miss') + ' by a single criterion. Widening one dial would bring them in.'
                : 'We are still sweeping your channels. New observations appear here as they arrive.'}
            </p>
            {nearMiss.length > 0 && (
              <ul className="mt-5 space-y-3">
                {nearMiss.slice(0, 4).map((o) => (
                  <li key={o.property.id} className="flex flex-wrap items-center justify-between gap-3 rounded-control bg-navy-50 p-4">
                    <div className="min-w-0">
                      <p className="truncate text-sm font-semibold text-navy-700">{o.property.address}</p>
                      <p className="text-xs text-navy-400">{o.match.blockedBy}</p>
                    </div>
                    <button type="button" onClick={() => onOpen(o.property.id)} className="text-xs font-semibold text-navy-600 underline underline-offset-2">Preview</button>
                  </li>
                ))}
              </ul>
            )}
            <a href="#/radar" className="mt-6 inline-block text-sm font-semibold text-navy-600 underline underline-offset-2">Adjust your radar</a>
          </div>
        </section>
      )}

      {!loading && eligible.length > 1 && (
        <section className="mt-10">
          <p className="hr-label">Since you were away</p>
          <div className="no-scrollbar mt-3 flex gap-4 overflow-x-auto pb-2">
            {eligible.slice(1, 7).map((o) => (
              <button key={o.property.id} type="button" onClick={() => onOpen(o.property.id)} className="hr-card w-56 shrink-0 p-5 text-left transition hover:shadow-lift">
                <LeadTimeBadge lead={o.leadTime} size="sm" />
                <p className="mt-3 truncate text-sm font-semibold text-navy-700">{o.property.address}</p>
                <p className="text-xs text-navy-400">{o.property.city}</p>
                <p className="mt-2 text-sm text-navy-600">{formatDkkCompact(o.property.price)}</p>
              </button>
            ))}
          </div>
        </section>
      )}

      <p className="mt-12 border-t border-navy-100 pt-6 text-xs leading-relaxed text-navy-400">{MATCH_DISCLAIMER}</p>
    </div>
  );
}

/* ---------- Discoveries feed ---------- */
const SORTS = [
  { key: 'lead', label: 'Earliest lead' },
  { key: 'match', label: 'Highest match' },
  { key: 'newest', label: 'Newest' },
  { key: 'confidence', label: 'High confidence' }
];

function Group({ title, items, savedIds, onToggle, onVerdict, onOpen, limit }) {
  const [expanded, setExpanded] = useState(false);
  if (!items.length) return null;
  const cap = limit && !expanded ? limit : items.length;
  const shown = items.slice(0, cap);
  const hidden = items.length - shown.length;

  return (
    <section>
      <div className="flex items-center gap-3">
        <p className="hr-label">{title}</p>
        <span className="h-px flex-1 bg-navy-100" />
        <span className="text-xs font-semibold text-navy-400">{items.length}</span>
      </div>
      <div className="mt-4 space-y-5">
        {shown.map((o, i) => (
          <OpportunityCard key={o.property.id} opportunity={o} index={i}
            saved={savedIds.indexOf(String(o.property.id)) !== -1}
            onToggleSave={() => onToggle(String(o.property.id))}
            onVerdict={(rel) => onVerdict(o, rel)}
            onOpen={() => onOpen(o.property.id)} />
        ))}
      </div>
      {hidden > 0 && (
        <button type="button" onClick={() => setExpanded(true)}
          className="mt-5 w-full rounded-control border border-navy-200 bg-white px-5 py-3 text-sm font-semibold text-navy-600 transition hover:border-navy-400">
          Show {hidden} more
        </button>
      )}
    </section>
  );
}

/* ---------- Just outside your radar: recovers everything a hard constraint hides ---------- */
function NearMissPanel({ items, onOpen }) {
  if (!items.length) return null;

  // Group by the single criterion that blocked each one, so the fix is obvious.
  const buckets = {};
  items.forEach((o) => {
    const key = o.match.blockedBy || 'Outside your radar';
    (buckets[key] = buckets[key] || []).push(o);
  });
  const rows = Object.keys(buckets).map((k) => ({ label: k, list: buckets[k] }))
    .sort((a, b) => b.list.length - a.list.length).slice(0, 4);

  return (
    <section className="rounded-card bg-navy-700 p-6 text-white sm:p-8">

function DiscoveriesPage({ data, savedIds, onToggle, onVerdict, onOpen }) {
  const { loading, error, eligible, nearMiss } = data;
  const [sort, setSort] = useState('lead');
  const [onlyEarly, setOnlyEarly] = useState(false);

  const visible = useMemo(() => {
    const base = onlyEarly ? eligible.filter((o) => o.leadTime.state !== 'public') : eligible;
    return sortOpportunities(base, sort);
  }, [eligible, onlyEarly, sort]);

  const notPublic = visible.filter((o) => o.leadTime.state === 'not_public');
  const early = visible.filter((o) => o.leadTime.state === 'early');
  const rest = visible.filter((o) => o.leadTime.state === 'public');

  return (
    <div>
      <PageHeader title="Discoveries"
        subtitle={loading ? 'Sweeping your channels\u2026' : (eligible.length + ' on your radar \u00B7 ' + notPublic.length + ' not public yet')} />
      <div className="mx-auto max-w-4xl px-6 py-8 sm:px-10">
        <div className="flex flex-wrap items-center gap-2">
          {SORTS.map((s) => (
            <button key={s.key} type="button" onClick={() => setSort(s.key)} aria-pressed={sort === s.key}
              className={'rounded-full px-4 py-2 text-sm font-medium transition ' +
                (sort === s.key ? 'bg-navy-700 text-white' : 'bg-white text-navy-500 ring-1 ring-navy-200 hover:ring-navy-400')}>
              {s.label}
            </button>
          ))}
          <button type="button" onClick={() => setOnlyEarly(!onlyEarly)} aria-pressed={onlyEarly}
            className={'rounded-full px-4 py-2 text-sm font-medium transition ' +
              (onlyEarly ? 'bg-signal-500 text-navy-800' : 'bg-white text-navy-500 ring-1 ring-navy-200 hover:ring-navy-400')}>
            Early only
          </button>
        </div>

        {error && <p role="alert" className="mt-6 rounded-control bg-red-50 p-4 text-sm text-red-700">{error}</p>}
        {loading && <div className="mt-10"><Spinner label="Cross-referencing observations\u2026" /><ColdStartNotice /></div>}

        {!loading && (
          <div className="mt-8 space-y-10">
            <Group title="Not public anywhere else" items={notPublic} savedIds={savedIds} onToggle={onToggle} onVerdict={onVerdict} onOpen={onOpen} />
            <Group title="Early, now public" items={early} savedIds={savedIds} onToggle={onToggle} onVerdict={onVerdict} onOpen={onOpen} />
            <Group title="Also on your radar" items={rest} savedIds={savedIds} onToggle={onToggle} onVerdict={onVerdict} onOpen={onOpen} limit={8} />

            {!visible.length && (
              <div className="hr-card p-8">
                <h2 className="text-lg font-bold text-navy-700">Nothing inside your radar yet</h2>
                <p className="mt-2 text-sm text-navy-400">We are still sweeping your channels, or your criteria are tighter than the current inventory.</p>
              </div>
            )}

            <NearMissPanel items={nearMiss} onOpen={onOpen} />
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------- Address insights (DinGeo) ----------
   Third-party public geodata, kept visually distinct from HomeRadar's own
   provenance so users never mistake a statistical estimate for a confirmed fact. */
function AddressInsights({ propertyId }) {
  const [state, setState] = useState({ loading: true, data: null });

  useEffect(() => {
    let cancelled = false;
    setState({ loading: true, data: null });
    api.dingeo(propertyId)
      .then((d) => { if (!cancelled) setState({ loading: false, data: d }); })
      .catch(() => { if (!cancelled) setState({ loading: false, data: { available: false } }); });
    return () => { cancelled = true; };
  }, [propertyId]);

  const d = state.data;
  const items = d && d.available ? [
    { label: 'Radon risk', value: d.radonRisk },
    { label: 'Burglary risk', value: d.burglaryRisk },
    { label: 'Flood risk', value: d.floodRisk },
    { label: 'Traffic noise', value: d.noiseLevel },
    { label: 'School district', value: d.schoolDistrict },
    { label: 'DinGeo estimate', value: d.valuationEstimate ? formatDkk(d.valuationEstimate) : null }
  ].filter((i) => i.value) : [];

  return (
    <section>
      <div className="flex flex-wrap items-baseline justify-between gap-3">
        <p className="hr-label">What the neighbourhood data says</p>
        {d && d.available && d.url && (
          <a href={d.url} target="_blank" rel="noopener noreferrer" className="text-xs font-semibold text-navy-600 underline underline-offset-2">
            Full DinGeo report
          </a>
        )}
      </div>

      <div className="mt-3 rounded-card bg-navy-50 p-6 ring-1 ring-navy-100">
        {state.loading && <Spinner label="Loading address insights\u2026" />}

        {!state.loading && !items.length && (
          <p className="text-sm text-slate-500">
            <span aria-hidden="true" className="mr-2 font-semibold">?</span>
            No neighbourhood data published for this address yet.
          </p>
        )}

        {!state.loading && items.length > 0 && (
          <React.Fragment>
            <dl className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              {items.map((i, idx) => (
                <motion.div key={i.label} initial={{ opacity: 0, y: 6 }} animate={{ opacity: 1, y: 0 }}
                  transition={{ delay: idx * 0.05, duration: 0.24, ease: EASE }}
                  className="rounded-control bg-white p-4 ring-1 ring-navy-100">
                  <dt className="text-xs font-medium text-navy-400">{i.label}</dt>
                  <dd className="mt-1 text-sm font-semibold text-navy-700">{i.value}</dd>
                </motion.div>
              ))}
            </dl>
            <p className="mt-4 text-xs leading-relaxed text-navy-400">
              Public address data from DinGeo. Risk ratings are statistical estimates for the area, not measurements of this property.
            </p>
          </React.Fragment>
        )}
      </div>
    </section>
  );
}

/* ---------- Feedback: relevant / not for me, with a reason ---------- */
function FeedbackModal({ prompt, onClose, onSubmit }) {
  const [reason, setReason] = useState('');
  const [chips, setChips] = useState([]);
  const relevant = prompt.relevant;
  const options = relevant ? FEEDBACK_CHIPS.relevant : FEEDBACK_CHIPS.not;

  const toggleChip = (label) => setChips((c) => c.indexOf(label) !== -1 ? c.filter((x) => x !== label) : c.concat([label]));

  function submit() {
    const chipDims = options.filter((o) => chips.indexOf(o.label) !== -1).map((o) => o.dim);
    const textDims = analyzeFeedbackReason(reason);
    const dims = [];
    chipDims.concat(textDims).forEach((d) => { if (dims.indexOf(d) === -1) dims.push(d); });
    onSubmit({ reason: reason.trim(), chips, dims });
  }

  return (
    // No exit animation: unmounting must not depend on an animation finishing,
    // which never happens in a background tab and would strand the modal open.
    <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }}
      className="fixed inset-0 z-40 grid place-items-center bg-navy-900/40 p-4" onClick={onClose}>
      <motion.div initial={{ opacity: 0, y: 16, scale: 0.98 }} animate={{ opacity: 1, y: 0, scale: 1 }}
        transition={{ duration: 0.24, ease: EASE }}
        role="dialog" aria-modal="true" aria-label="Give feedback"
        className="w-full max-w-lg rounded-card bg-white p-6 shadow-lift sm:p-8"
        onClick={(e) => e.stopPropagation()}>

        <div className="flex items-start justify-between gap-4">
          <div>
            <p className={'hr-label ' + (relevant ? 'text-verify-700' : 'text-navy-400')}>
              {relevant ? 'Relevant match' : 'Not for me'}
            </p>
            <h3 className="mt-1 text-lg font-bold text-navy-700">
              {relevant ? 'What made this one work?' : 'What was wrong with it?'}
            </h3>
          </div>
          <button type="button" onClick={onClose} aria-label="Close" className="text-navy-300 hover:text-navy-600">{'\u00D7'}</button>
        </div>

        <p className="mt-1 truncate text-sm text-navy-400">{prompt.opportunity.property.address}</p>

        <div className="mt-5 flex flex-wrap gap-2">
          {options.map((o) => (
            <button key={o.label} type="button" onClick={() => toggleChip(o.label)} aria-pressed={chips.indexOf(o.label) !== -1}
              className={'rounded-full px-4 py-2 text-sm font-medium transition ' +
                (chips.indexOf(o.label) !== -1 ? 'bg-navy-700 text-white' : 'bg-white text-navy-500 ring-1 ring-navy-200 hover:ring-navy-400')}>
              {o.label}
            </button>
          ))}
        </div>

        <label className="mt-5 block">
          <span className="hr-label">Anything else? (optional)</span>
          <textarea rows="3" value={reason} onChange={(e) => setReason(e.target.value)} autoFocus
            placeholder={relevant ? 'e.g. Great room sizes and close to work' : 'e.g. Too close to a noisy street'}
            className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
        </label>

        <p className="mt-2 text-xs text-navy-400">
          HomeRadar reads this for the criteria it mentions, so your ranking changes in the direction you meant.
        </p>

        <div className="mt-6 flex justify-end gap-3">
          <button type="button" onClick={onClose} className="rounded-control px-4 py-3 text-sm font-semibold text-navy-500 hover:text-navy-700">
            Cancel
          </button>
          <Button variant={relevant ? 'positive' : 'primary'} onClick={submit}>Save feedback</Button>
        </div>
      </motion.div>
    </motion.div>
  );
}
