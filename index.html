                    <>
                    <div className="min-h-screen bg-[#FAF9F6] p-8">
                        <div className="max-w-2xl mx-auto">
                            <div className="mb-12">
                                <h1 className="text-4xl font-bold text-gray-900 mb-2">Welcome, {currentUser?.name}</h1>
                                <p className="text-gray-600">Let's set up your preferences to find your ideal home.</p>
                            </div>

                            <div className="bg-white border border-gray-200 rounded-xl p-12">
                                <CriteriaForm
                                    initial={{ budget: { min: 2000000, max: 5000000 }, cities: [], sizeMode: 'size', minSize: 80, minRooms: 3, features: [] }}
                                    onSave={handleCompleteSetup}
                                    submitLabel="🚀 Start Browsing!"
                                    allCities={allCities}
                                    allFeatures={allFeatures}
                                />
                            </div>
                        </div>
                    </div>
                    {showSearchingModal && (
                        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
                            <div className="bg-white rounded-2xl p-10 max-w-sm w-full mx-4 text-center shadow-2xl">
                                <div className="w-14 h-14 border-4 border-brand-100 border-t-brand-600 rounded-full animate-spin mx-auto mb-6"></div>
                                <h3 className="text-lg font-semibold text-gray-900 mb-2">Searching for your perfect home</h3>
                                <p className="text-sm text-gray-500">We're checking real listings that match your criteria...</p>
                            </div>
                        </div>
                    )}
                    </>
                );
            }

            // Main Dashboard
            const matchedProperties = (apiProperties.length > 0 ? apiProperties : mockProperties).filter(p => calculateScore(p) > 0);
            const relevantFeedbackCount = feedbackHistory.filter(f => f.relevant).length;
            const learningAccuracy = feedbackHistory.length > 0 ? Math.round((relevantFeedbackCount / feedbackHistory.length) * 100) : 0;

            // How well the current matches align with the saved profile - the average of each
            // matched property's own score, not to be confused with learningAccuracy (which is
            // derived from 👍/👎 feedback instead).
            const profileMatchAccuracy = matchedProperties.length > 0
                ? Math.round(matchedProperties.reduce((sum, p) => sum + calculateScore(p), 0) / matchedProperties.length)
                : 0;

            // Real, lightweight market signals computed from the properties HomeRadar already has
            // on file - no external market-data feed required.
            const realListings = apiProperties.length > 0 ? apiProperties : [];
            const oneWeekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const newThisWeek = realListings.filter(p => p.listing_date && new Date(p.listing_date).getTime() >= oneWeekAgo).length;
            const daysOnMarketList = realListings
                .filter(p => p.listing_date)
                .map(p => Math.max(0, Math.floor((Date.now() - new Date(p.listing_date)) / 86400000)));
            const avgDaysOnMarket = daysOnMarketList.length > 0
                ? Math.round(daysOnMarketList.reduce((a, b) => a + b, 0) / daysOnMarketList.length)
                : null;
            const verifiedSourceCount = new Set(realListings.filter(p => p.verified).map(p => p.source)).size;

            return (
                <>
                <div className="min-h-screen bg-[#FAF9F6] flex">
                    {/* Sidebar */}
                    <div className="w-64 border-r border-gray-200 fixed left-0 top-0 bottom-0 bg-white">
                        <div className="p-8 border-b border-gray-200">
                            <button onClick={() => { setSelectedProperty(null); setShowLandingPage(true); }} className="flex items-center gap-2 text-left" aria-label="Go to HomeRadar homepage">
                                <img src={LOGO_ICON_URL} alt="HomeRadar" className="h-9 w-9" />
                                <h1 className="text-2xl font-bold"><span className="text-gray-900">Home</span><span className="text-brand-600">Radar</span></h1>
                            </button>
                        </div>
                        
                        <nav className="p-6 space-y-2">
                            {[
                                { label: 'Dashboard', view: 'dashboard' },
                                { label: 'Matches', view: 'properties' },
                                { label: 'Watchlist', view: 'saved' },
                                { label: 'Messages', view: 'messages' },
                                { label: 'Profile', view: 'profile' }
                            ].map(item => (
                                <button
                                    key={item.view}
                                    onClick={() => setSelectedView(item.view)}
                                    className={`sidebar-nav-item w-full text-left px-4 py-3 rounded-lg font-medium transition ${
                                        selectedView === item.view
                                            ? 'active bg-brand-50 text-brand-700'
                                            : 'text-gray-700 hover:bg-gray-50'
                                    }`}
                                >
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <div className="absolute bottom-8 left-6 right-6 border-t border-gray-200 pt-6">
                            <div className="mb-4">
                                <p className="text-sm text-gray-600">{currentUser?.name}</p>
                                <p className="text-xs text-gray-500">{currentUser?.email}</p>
                            </div>
                            <button 
                                onClick={() => {
                                    authToken = null;
                                    localStorage.removeItem('homeradar_token');
                                    setCurrentUser(null);
                                    setPreferences({ ...DEFAULT_PREFERENCES });
                                    setShortlist([]);
                                    setFeedbackHistory([]);
                                    setSelectedProperty(null);
                                    setApiProperties([]);
                                }}
                                className="w-full px-4 py-2 text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition text-sm"
                            >
                                Sign Out
                            </button>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 ml-64">
                        {selectedView === 'dashboard' && (
                            <div className="p-12">
                                {/* Header */}
                                <div className="mb-12 flex items-start justify-between">
                                    <div>
                                        <h1 className="text-4xl font-bold text-gray-900 mb-2">Good morning, {currentUser?.name?.split(' ')[0]}</h1>
                                        <p className="text-gray-600">We found {matchedProperties.length} new matches for you.</p>
                                    </div>
                                    <button onClick={() => setSelectedView('profile')} className="px-6 py-3 bg-brand-600 text-white rounded-lg font-medium hover:bg-brand-700 transition whitespace-nowrap">
                                        Edit my profile
                                    </button>
                                </div>

                                {/* Stats */}
                                <div className="grid grid-cols-4 gap-6 mb-12">
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-brand-600 mb-1">{matchedProperties.length}</div>
                                        <div className="text-sm text-gray-600 font-medium">Matched Properties</div>
                                    </div>
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-green-600 mb-1">{shortlist.length}</div>
                                        <div className="text-sm text-gray-600 font-medium">Shortlisted</div>
                                    </div>
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-purple-600 mb-1">{feedbackHistory.length}</div>
                                        <div className="text-sm text-gray-600 font-medium">Feedback Given</div>
                                    </div>
                                    <div className="stat-card rounded-xl p-6">
                                        <div className="text-3xl font-bold text-orange-600 mb-1">{learningAccuracy}%</div>
                                        <div className="text-sm text-gray-600 font-medium">Learning Accuracy</div>
                                    </div>
                                </div>

                                {/* Home Profile Card */}
                                <div className="mb-12">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-6">Your Home Profile</h2>
                                    <div className="card-subtle bg-white rounded-xl p-8 flex items-center gap-8">
                                        <div className="flex-1 grid grid-cols-2 gap-x-8 gap-y-6">
                                            <div>
                                                <h3 className="text-xs font-semibold text-gray-500 uppercase mb-2">Areas</h3>
                                                <p className="text-base font-semibold text-gray-900">{preferences.cities.join(', ')}</p>
                                            </div>
                                            <div>
                                                <h3 className="text-xs font-semibold text-gray-500 uppercase mb-2">Budget</h3>
                                                <p className="text-base font-semibold text-gray-900">DKK {(preferences.budget.min/1000000).toFixed(1)}M {'\u2013'} {preferences.budget.max >= 50000000 ? '50M+' : (preferences.budget.max/1000000).toFixed(1) + 'M'}</p>
                                            </div>
                                            <div>
                                                <h3 className="text-xs font-semibold text-gray-500 uppercase mb-2">{preferences.sizeMode === 'rooms' ? 'Rooms' : 'Size'}</h3>
                                                <p className="text-base font-semibold text-gray-900">{preferences.sizeMode === 'rooms' ? `${preferences.minRooms}+ rooms` : `${preferences.minSize}+ m²`}</p>
                                            </div>
                                            <div>
                                                <h3 className="text-xs font-semibold text-gray-500 uppercase mb-2">Must-haves</h3>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {preferences.features.length > 0 ? preferences.features.map(f => (
                                                        <span key={f} className="bg-brand-50 text-brand-700 px-2.5 py-0.5 rounded-full text-xs font-medium">
                                                            {f}
                                                        </span>
                                                    )) : <span className="text-sm text-gray-400">None set</span>}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-center shrink-0 pl-8 border-l border-gray-100">
                                            <div className="progress-circle w-20 h-20 rounded-full flex items-center justify-center" style={{'--pct': `${profileMatchAccuracy}%`}}>
                                                <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center">
                                                    <span className="text-lg font-bold text-brand-600">{profileMatchAccuracy}%</span>
                                                </div>
                                            </div>
                                            <p className="text-xs text-gray-500 mt-2 text-center">Profile Match<br/>Accuracy</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Market Monitoring */}
                                <div className="mb-12">
                                    <div className="bg-sage-50 border border-sage-200 rounded-xl p-8">
                                        <div className="flex items-start gap-4">
                                            <div className="w-12 h-12 rounded-full bg-brand-600 text-white flex items-center justify-center text-xl shrink-0">📡</div>
                                            <div>
                                                <h3 className="text-lg font-semibold text-gray-900 mb-1">We're always scanning the market</h3>
                                                <p className="text-sm text-gray-600 mb-4">HomeRadar continuously checks real listings so you don't have to search for them yourself.</p>
                                                <div className="flex flex-wrap gap-3">
                                                    <span className="bg-white border border-sage-200 px-4 py-2 rounded-lg text-sm font-medium text-gray-700">Boligsiden</span>
                                                    <span className="bg-white border border-sage-200 px-4 py-2 rounded-lg text-sm font-medium text-gray-700">Agent Portal</span>
                                                    <span className="bg-white border border-sage-200 px-4 py-2 rounded-lg text-sm font-medium text-gray-700">More Sources Soon</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Market Insights */}
                                <div className="mb-12">
                                    <h2 className="text-xl font-semibold text-gray-900 mb-6">Market insights for you</h2>
                                    <div className="grid grid-cols-3 gap-6">
                                        <div className="card-subtle bg-white rounded-xl p-6">
                                            <div className="text-2xl font-bold text-gray-900 mb-1">{newThisWeek}</div>
                                            <div className="text-sm text-gray-600">New listings this week</div>
                                        </div>
                                        <div className="card-subtle bg-white rounded-xl p-6">
                                            <div className="text-2xl font-bold text-gray-900 mb-1">{avgDaysOnMarket !== null ? `${avgDaysOnMarket} days` : 'N/A'}</div>
                                            <div className="text-sm text-gray-600">Average days on market</div>
                                        </div>
                                        <div className="card-subtle bg-white rounded-xl p-6">
                                            <div className="text-2xl font-bold text-gray-900 mb-1">{verifiedSourceCount}</div>
                                            <div className="text-sm text-gray-600">Verified sources monitored</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Preference Learning */}
                                <div className="mb-12 grid grid-cols-2 gap-6">
                                    <div className="card-subtle bg-white rounded-xl p-8">
                                        <h3 className="text-sm font-semibold text-gray-500 uppercase mb-4">Preference Learning</h3>
                                        <p className="text-xs text-gray-500 mb-4">Weight multipliers adjust ±5% each time you rate a match.</p>
                                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                            {Object.entries(preferences.weights).map(([key, val]) => (
                                                <div key={key} className="bg-brand-50 rounded-lg p-3 text-center">
                                                    <div className="text-[10px] font-semibold text-gray-500 uppercase mb-1">{key}</div>
                                                    <div className="text-lg font-bold text-brand-600">{val.toFixed(2)}x</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="card-subtle bg-white rounded-xl p-8">
                                        <h3 className="text-sm font-semibold text-gray-500 uppercase mb-4">Recent Feedback</h3>
                                        {feedbackHistory.length === 0 ? (
                                            <p className="text-sm text-gray-500">Rate a match below to see feedback history</p>
                                        ) : (
                                            <div className="space-y-2 max-h-32 overflow-y-auto">
                                                {feedbackHistory.slice(0, 5).map((f, idx) => (
                                                    <div key={idx} className="text-xs text-gray-600">
                                                        {f.relevant ? '👍 Relevant' : '👎 Not for me'}
                                                        {f.reason && <span className="text-gray-500">: {f.reason}</span>}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Properties */}
                                <div>
                                    <div className="flex items-end justify-between mb-6">
                                        <div>
                                            <h2 className="text-xl font-semibold text-gray-900">New matches</h2>
                                            <p className="text-sm text-gray-500 mt-1">Properties we think you'll love</p>
                                        </div>
                                        <button onClick={() => setSelectedView('properties')} className="text-sm font-medium text-brand-600 hover:text-brand-700">
                                            View all matches →
                                        </button>
                                    </div>

                                    {propertiesError && (
                                        <div className="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 mb-6 text-sm">
                                            {propertiesError}
                                        </div>
                                    )}

                                    {propertiesLoading && apiProperties.length === 0 && (
                                        <div className="text-center py-16 text-gray-500">
                                            Loading properties...
                                        </div>
                                    )}

                                    {!propertiesLoading && !propertiesError && matchedProperties.length === 0 && (
                                        <div className="text-center py-16 text-gray-500 border border-dashed border-gray-300 rounded-xl">
                                            <p className="font-medium mb-1">No properties match your criteria yet.</p>
                                            <p className="text-sm">Try widening your budget, size, or area of interest in your Profile.</p>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-8">
                                        {matchedProperties.map(prop => (
                                            <PropertyCard
                                                key={prop.id}
                                                prop={prop}
                                                score={calculateScore(prop)}
                                                breakdown={calculateBreakdown(prop)}
                                                isShortlisted={!!shortlist.find(p => p.id === prop.id)}
                                                onToggleShortlist={toggleShortlist}
                                                onFeedback={requestFeedback}
                                                onOpenDetails={setSelectedProperty}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {selectedView === 'properties' && (
                            <div className="p-12">
                                <h1 className="text-3xl font-bold text-gray-900 mb-8">Matches</h1>

                                {!propertiesLoading && !propertiesError && matchedProperties.length === 0 && (
                                    <div className="text-center py-16 text-gray-500 border border-dashed border-gray-300 rounded-xl">
                                        <p className="font-medium mb-1">No properties match your criteria yet.</p>
                                        <p className="text-sm">Try widening your budget, size, or area of interest in your Profile.</p>
                                    </div>
                                )}

                                <div className="grid grid-cols-2 gap-8">
                                    {matchedProperties.map(prop => (
                                        <PropertyCard
                                            key={prop.id}
                                            prop={prop}
                                            score={calculateScore(prop)}
                                            breakdown={calculateBreakdown(prop)}
                                            isShortlisted={!!shortlist.find(p => p.id === prop.id)}
                                            onToggleShortlist={toggleShortlist}
                                            onFeedback={requestFeedback}
                                            onOpenDetails={setSelectedProperty}
                                        />
                                    ))}
                                </div>
                            </div>
                        )}

                        {selectedView === 'saved' && (
                            <div className="p-12">
                                <h1 className="text-3xl font-bold text-gray-900 mb-8">Watchlist</h1>
                                {shortlist.length === 0 ? (
                                    <p className="text-gray-600">Your saved properties will appear here.</p>
                                ) : (
                                    <div className="grid grid-cols-2 gap-8">
                                        {shortlist.map(prop => (
                                            <PropertyCard
                                                key={prop.id}
                                                prop={prop}
                                                score={calculateScore(prop)}
                                                breakdown={calculateBreakdown(prop)}
                                                isShortlisted={true}
                                                onToggleShortlist={toggleShortlist}
                                                onFeedback={requestFeedback}
                                                onOpenDetails={setSelectedProperty}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {selectedView === 'messages' && (
                            <div className="p-12">
                                <h1 className="text-3xl font-bold text-gray-900">Messages</h1>
                                <p className="text-gray-600 mt-4">Your messages will appear here.</p>
                            </div>
                        )}

                        {selectedView === 'profile' && (
                            <div className="p-12 max-w-3xl">
                                <h1 className="text-3xl font-bold text-gray-900 mb-8">Profile</h1>

                                <div className="card-subtle bg-white rounded-xl p-8 mb-8">
                                    <h2 className="text-lg font-semibold text-gray-900 mb-6">Account Details</h2>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                                            <input type="text" value={profileForm.name} onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                            <input type="email" value={profileForm.email} onChange={(e) => setProfileForm({ ...profileForm, email: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        </div>
                                    </div>
                                </div>

                                <div className="card-subtle bg-white rounded-xl p-8 mb-8">
                                    <h2 className="text-lg font-semibold text-gray-900 mb-2">Change Password</h2>
                                    <p className="text-xs text-gray-500 mb-6">Leave blank if you don't want to change your password.</p>
                                    <div className="space-y-4">
                                        <input type="password" placeholder="Current password" value={profileForm.currentPassword} onChange={(e) => setProfileForm({ ...profileForm, currentPassword: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        <input type="password" placeholder="New password" value={profileForm.newPassword} onChange={(e) => setProfileForm({ ...profileForm, newPassword: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                        <input type="password" placeholder="Confirm new password" value={profileForm.confirmPassword} onChange={(e) => setProfileForm({ ...profileForm, confirmPassword: e.target.value })} className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                                    </div>
                                </div>

                                <button onClick={handleUpdateProfile} className="px-6 py-3 bg-gray-900 text-white rounded-lg font-medium hover:bg-gray-800 transition mb-12">
                                    Save Account Changes
                                </button>

                                <div className="card-subtle bg-white rounded-xl p-8">
                                    <h2 className="text-lg font-semibold text-gray-900 mb-6">Search Preferences</h2>
                                    <CriteriaForm
                                        initial={preferences}
                                        onSave={handleUpdatePreferences}
                                        submitLabel="Save Preferences"
                                        allCities={allCities}
                                        allFeatures={allFeatures}
                                    />
                                </div>
                            </div>
                        )}
                    </div>
                </div>
                {feedbackPrompt && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[60] p-4" onClick={() => setFeedbackPrompt(null)}>
                        <div className="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl" onClick={(e) => e.stopPropagation()}>
                            <div className="flex items-start justify-between gap-4 mb-2">
                                <div>
                                    <p className={`text-xs font-semibold uppercase tracking-wide mb-1 ${feedbackPrompt.relevant ? 'text-green-700' : 'text-gray-500'}`}>
                                        {feedbackPrompt.relevant ? '👍 Relevant match' : '👎 Not for me'}
                                    </p>
                                    <h3 className="text-xl font-semibold text-gray-900">What made you choose this?</h3>
                                </div>
                                <button onClick={() => setFeedbackPrompt(null)} className="text-2xl leading-none text-gray-400 hover:text-gray-700" aria-label="Close">×</button>
                            </div>
                            <p className="text-sm text-gray-600 mb-5">Your explanation helps HomeRadar understand what matters to you.</p>
                            <textarea
                                autoFocus
                                value={feedbackReason}
                                onChange={(e) => setFeedbackReason(e.target.value)}
                                placeholder={feedbackPrompt.relevant ? 'e.g. Great bedroom size and close to work' : 'e.g. Too close to a noisy street'}
                                rows="4"
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-brand-200"
                            />
                            <div className="flex justify-end gap-3 mt-5">
                                <button onClick={() => setFeedbackPrompt(null)} className="px-4 py-2 text-gray-600 font-medium hover:text-gray-900">Cancel</button>
                                <button onClick={submitFeedback} className={`px-5 py-2 text-white rounded-lg font-medium ${feedbackPrompt.relevant ? 'bg-green-700 hover:bg-green-800' : 'bg-gray-800 hover:bg-gray-900'}`}>
                                    Save feedback
                                </button>
                            </div>
                        </div>
                    </div>
                )}
                {showSearchingModal && (
                    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
                        <div className="bg-white rounded-2xl p-10 max-w-sm w-full mx-4 text-center shadow-2xl">
                            <div className="w-14 h-14 border-4 border-brand-100 border-t-brand-600 rounded-full animate-spin mx-auto mb-6"></div>
                            <h3 className="text-lg font-semibold text-gray-900 mb-2">Searching for your perfect home</h3>
                            <p className="text-sm text-gray-500">We're checking real listings that match your criteria...</p>
                        </div>
                    </div>
                )}
                {selectedProperty && (() => {
                    const prop = selectedProperty;
                    const score = calculateScore(prop);
                    const breakdown = calculateBreakdown(prop);
                    const isShortlisted = !!shortlist.find(p => p.id === prop.id);
                    const imageUrl = prop.thumbnail_url || (Array.isArray(prop.images) && prop.images.length > 0 ? prop.images[0] : null);
                    return (
                        <div className="fixed inset-0 bg-black/50 flex items-start justify-center z-50 p-4 overflow-y-auto" onClick={() => setSelectedProperty(null)}>
                            <div className="bg-white rounded-2xl max-w-3xl w-full my-8 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                                <div className="h-72 bg-gray-100 rounded-t-2xl overflow-hidden flex items-center justify-center text-gray-300">
                                    {imageUrl ? (
                                        <img src={imageUrl} alt={prop.address} className="w-full h-full object-cover" onError={(e) => { e.target.remove(); }} />
                                    ) : 'Photo'}
                                </div>
                                <div className="p-8">
                                    <button onClick={() => setSelectedProperty(null)} className="text-sm text-gray-500 hover:text-gray-700 font-medium mb-4">
                                        ← Back
                                    </button>

                                    <div className="flex justify-between items-start mb-4">
                                        <div>
                                            <h2 className="text-2xl font-bold text-gray-900">{prop.address}</h2>
                                            <p className="text-gray-600 mt-1">{prop.city}{prop.postal_code ? ` • ${prop.postal_code}` : ''}</p>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-3xl font-bold text-brand-600">{score}%</div>
                                            <p className="text-xs text-gray-500 mt-1">Match Score</p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-4 gap-4 my-6 py-6 border-y border-gray-200">
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Price</p>
                                            <p className="font-semibold text-gray-900">{(prop.price/1000000).toFixed(1)}M DKK</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Size</p>
                                            <p className="font-semibold text-gray-900">{prop.sqm || prop.size || 'N/A'} m²</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Rooms</p>
                                            <p className="font-semibold text-gray-900">{prop.bedrooms || prop.rooms || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Bathrooms</p>
                                            <p className="font-semibold text-gray-900">{prop.bathrooms || 'N/A'}</p>
                                        </div>
                                    </div>

                                    <div className="mb-6">
                                        <p className="text-xs font-semibold text-gray-500 uppercase mb-3">Why we think you'll love it</p>
                                        <div className="space-y-2">
                                            {[
                                                { label: 'Budget', val: breakdown.budget },
                                                { label: 'Location', val: breakdown.location },
                                                { label: 'Market', val: breakdown.market },
                                                { label: 'Value', val: breakdown.value }
                                            ].map(f => (
                                                <div key={f.label} className="flex items-center gap-3 relative group">
                                                    <div className="w-16 text-xs text-gray-500 border-b border-dotted border-gray-400 cursor-help">
                                                        {f.label}
                                                        <div className="hidden group-hover:block absolute left-0 bottom-full mb-2 w-56 bg-gray-900 text-white text-xs leading-snug rounded-lg p-3 shadow-xl z-20">
                                                            {FACTOR_EXPLANATIONS[f.label]}
                                                        </div>
                                                    </div>
                                                    <div className="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                                                        <div className="bg-brand-500 h-full" style={{width: `${f.val}%`}}></div>
                                                    </div>
                                                    <div className="w-8 text-xs font-semibold text-gray-700 text-right">{f.val}</div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mb-6">
                                        <p className="text-xs font-semibold text-gray-500 uppercase mb-2">Description</p>
                                        <p className="text-gray-700 text-sm">
                                            {detailsLoading ? 'Loading full listing details...' : (prop.description || 'No additional description available for this listing.')}
                                        </p>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4 mb-6 text-sm">
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Property Type</p>
                                            <p className="text-gray-900">{prop.property_type || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Year Built</p>
                                            <p className="text-gray-900">{prop.year_built || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Listed</p>
                                            <p className="text-gray-900">{prop.listing_date ? new Date(prop.listing_date).toLocaleDateString('da-DK') : 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Energy Label</p>
                                            <p className="text-gray-900">{prop.energy_label || 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Monthly Expense</p>
                                            <p className="text-gray-900">{prop.monthly_expense ? `${Number(prop.monthly_expense).toLocaleString('da-DK')} DKK` : 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Lot Size</p>
                                            <p className="text-gray-900">{prop.lot_area ? `${prop.lot_area} m²` : 'N/A'}</p>
                                        </div>
                                        <div>
                                            <p className="text-xs text-gray-500 uppercase mb-1">Source</p>
                                            <p className="text-gray-900">{prop.source || 'N/A'}{prop.verified ? ' • Verified' : ''}</p>
                                        </div>
                                    </div>

                                    <div className="bg-sage-50 border border-sage-200 rounded-xl p-6 mb-6">
                                        <div className="flex items-start justify-between gap-4 mb-5">
                                            <div>
                                                <p className="text-xs font-semibold text-brand-700 uppercase tracking-wide mb-1">Address insights</p>
                                                <h3 className="text-lg font-semibold text-gray-900">What the neighbourhood data says</h3>
                                            </div>
                                            {dingeoInsights?.available && dingeoInsights.url && (
                                                <a href={dingeoInsights.url} target="_blank" rel="noopener noreferrer" className="shrink-0 text-sm font-medium text-brand-700 hover:text-brand-800">
                                                    Full DinGeo report →
                                                </a>
                                            )}
                                        </div>
                                        {dingeoLoading && (
                                            <div className="flex items-center gap-3 text-sm text-gray-600">
                                                <div className="w-4 h-4 border-2 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
                                                Loading address insights...
                                            </div>
                                        )}
                                        {!dingeoLoading && dingeoInsights?.available && (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                {[
                                                    { label: 'Radon risk', value: dingeoInsights.radonRisk, tone: 'amber' },
                                                    { label: 'Burglary risk', value: dingeoInsights.burglaryRisk, tone: 'amber' },
                                                    { label: 'Flood risk', value: dingeoInsights.floodRisk, tone: 'green' },
                                                    { label: 'Traffic noise', value: dingeoInsights.noiseLevel, tone: 'slate' },
                                                    { label: 'School district', value: dingeoInsights.schoolDistrict, tone: 'green' },
                                                    { label: 'DinGeo estimate', value: dingeoInsights.valuationEstimate ? `${(dingeoInsights.valuationEstimate / 1000000).toFixed(2)}M DKK` : null, tone: 'green' }
                                                ].filter(item => item.value).map(item => (
                                                    <div key={item.label} className="bg-white border border-sage-200 rounded-lg p-3">
                                                        <p className="text-xs text-gray-500 mb-1">{item.label}</p>
                                                        <p className={`text-sm font-semibold ${item.tone === 'amber' ? 'text-amber-700' : item.tone === 'green' ? 'text-brand-700' : 'text-gray-700'}`}>{item.value}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                        {!dingeoLoading && !dingeoInsights?.available && (
                                            <p className="text-sm text-gray-600">Address insights are not available for this listing yet.</p>
                                        )}
                                        {!dingeoLoading && dingeoInsights?.available && (
                                            <p className="text-xs text-gray-500 mt-4">Public address data from DinGeo. Risk ratings are statistical estimates, not measurements.</p>
                                        )}
                                    </div>

                                    {/* Contact Agent - keeps the user inside HomeRadar instead of needing to visit the original listing */}
                                    <div className="bg-gray-50 rounded-xl p-6 mb-6">
                                        <p className="text-xs font-semibold text-gray-500 uppercase mb-3">Contact Agent</p>
                                        {prop.agent_name && <p className="font-medium text-gray-900 mb-3">{prop.agent_name}</p>}
                                        <div className="flex flex-wrap gap-3">
                                            {prop.agent_email && (
                                                <a
                                                    href={`mailto:${prop.agent_email}?subject=${encodeURIComponent('Inquiry about ' + prop.address)}&body=${encodeURIComponent(`Hi ${prop.agent_name || ''},\n\nI'm interested in ${prop.address} (found via HomeRadar). Could you share more details or arrange a viewing?\n\nThanks!`)}`}
                                                    className="px-4 py-2 bg-brand-600 text-white rounded-lg text-sm font-medium hover:bg-brand-700 transition"
                                                >
                                                    📧 Email Agent
                                                </a>
                                            )}
                                            {prop.agent_phone && (
                                                <a href={`tel:${prop.agent_phone}`} className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                                                    📞 {prop.agent_phone}
                                                </a>
                                            )}
                                            {!prop.agent_email && !prop.agent_phone && prop.source_url && !detailsLoading && (
                                                <a href={prop.source_url} target="_blank" rel="noopener noreferrer" className="px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                                                    View original listing to contact the agent →
                                                </a>
                                            )}
                                            {!prop.agent_email && !prop.agent_phone && detailsLoading && (
                                                <p className="text-sm text-gray-500">Checking for agent contact info...</p>
                                            )}
                                            {!prop.agent_email && !prop.agent_phone && !prop.source_url && !detailsLoading && (
                                                <p className="text-sm text-gray-500">No agent contact info available for this listing yet.</p>
                                            )}
                                        </div>
                                    </div>

                                    <div className="flex gap-3">
                                        <button onClick={() => toggleShortlist(prop)} className={`px-4 py-3 rounded-lg font-medium transition ${isShortlisted ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-gray-50 text-gray-700 border border-gray-200 hover:bg-gray-100'}`}>
                                            {isShortlisted ? '❤️ Saved' : '🤍 Save'}
                                        </button>
                                        <button onClick={() => requestFeedback(prop, true)} className="px-4 py-3 border border-green-200 text-green-700 rounded-lg font-medium hover:bg-green-50 transition">
                                            👍 Relevant
                                        </button>
                                        <button onClick={() => requestFeedback(prop, false)} className="px-4 py-3 border border-gray-200 text-gray-500 rounded-lg font-medium hover:bg-gray-50 transition">
                                            👎 Not for me
                                        </button>
                                        {prop.source_url && (
                                            <a href={prop.source_url} target="_blank" rel="noopener noreferrer" className="flex-1 px-4 py-3 border border-gray-300 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition text-center">
                                                View Original Listing
                                            </a>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                })()}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
