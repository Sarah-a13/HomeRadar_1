// Static OSM tiles rather than the embed iframe, which browsers block from file://.
function LocationMap({ p }) {
  if (!p.latitude || !p.longitude) return null;
  const lat = Number(p.latitude), lon = Number(p.longitude);
  if (!isFinite(lat) || !isFinite(lon)) return null;

  const z = 15;
  const n = Math.pow(2, z);
  const xf = (lon + 180) / 360 * n;
  const latRad = lat * Math.PI / 180;
  const yf = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  const x0 = Math.floor(xf) - 1;
  const y0 = Math.floor(yf) - 1;
  const offsetX = (xf - x0) * 256;
  const offsetY = (yf - y0) * 256;

  const tiles = [];
  for (let dy = 0; dy < 3; dy++) {
    for (let dx = 0; dx < 3; dx++) {
      tiles.push({ x: x0 + dx, y: y0 + dy, left: dx * 256, top: dy * 256 });
    }
  }

  return (
    <section>
      <p className="hr-label">Where it is</p>
      <div className="relative mt-3 h-64 overflow-hidden rounded-card bg-navy-50 ring-1 ring-navy-100">
        <div className="absolute" style={{ left: 'calc(50% - ' + offsetX + 'px)', top: 'calc(50% - ' + offsetY + 'px)', width: 768, height: 768 }}>
          {tiles.map((t) => (
            <img key={t.x + '/' + t.y} alt="" aria-hidden="true" loading="lazy"
              src={'https://tile.openstreetmap.org/' + z + '/' + t.x + '/' + t.y + '.png'}
              style={{ position: 'absolute', left: t.left, top: t.top, width: 256, height: 256 }} />
          ))}
        </div>
        <span aria-hidden="true" className="absolute left-1/2 top-1/2 h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white bg-signal-500 shadow-lift" />
        <span className="sr-only">Approximate location of {p.address}</span>
      </div>
      <p className="mt-2 text-xs text-navy-400">Approximate position {'\u00B7'} Map data {'\u00A9'} OpenStreetMap contributors.</p>
    </section>
  );
}

/* ---------- Opportunity detail ---------- */
function nextAction(o) {
  const conflict = o.facts.filter((f) => f.evidence === 'conflicting')[0];
  if (conflict) return 'ask the agent to confirm the ' + conflict.label.toLowerCase() + ' \u2014 our sources disagree.';
  const missing = o.facts.filter((f) => f.evidence === 'unknown')[0];
  if (missing) return 'ask the agent for the ' + missing.label.toLowerCase() + ', which no source has published.';
  if (o.confidence.label === 'low') return 'treat these details as unconfirmed until a second source reports them.';
  // Only claim a head start when the lead time actually supports it.
  if (o.leadTime.state !== 'public') return 'contact the agent while this is still ahead of the public portals.';
  return 'call or email the agent to arrange a viewing.';
}

function OpportunityPage({ opportunity, prefs, saved, onToggleSave, onBack, onVerdict }) {
  const baseId = opportunity ? opportunity.property.id : null;
  const [detail, setDetail] = useState(null);
  const [loadingDetail, setLoadingDetail] = useState(false);

  // The list endpoint returns a thin row; /api/properties/:id lazily scrapes the
  // full listing (description, energy label, expenses, agent contact, photos).
  useEffect(() => {
    if (!baseId) return;
    let cancelled = false;
    setDetail(null);
    setLoadingDetail(true);
    api.property(baseId)
      .then((d) => { if (!cancelled) setDetail(d); })
      .catch(() => {})
      .finally(() => { if (!cancelled) setLoadingDetail(false); });
    return () => { cancelled = true; };
  }, [baseId]);

  const view = useMemo(() => {
    if (!opportunity) return null;
    if (!detail) return opportunity;
    const merged = Object.assign({}, opportunity.property, detail);
    const sightings = opportunity.sightings.map((s) => String(s.id) === String(merged.id) ? merged : s);
    const leadTime = computeLeadTime(merged);
    return {
      property: merged,
      sightings,
      leadTime,
      match: computeMatch(merged, prefs, opportunity.ctx || null, leadTime, sightings),
      confidence: computeConfidence(merged, sightings),
      provenance: buildProvenance(sightings),
      facts: buildFacts(merged, sightings)
    };
  }, [opportunity, detail, prefs]);

  if (!view) {
    return (
      <div className="mx-auto max-w-4xl px-6 py-16">
        <p className="rounded-control bg-slate-100 p-4 text-sm text-slate-700">That opportunity is no longer on your radar.</p>
        <button type="button" onClick={onBack} className="mt-4 text-sm font-semibold text-navy-600 underline">Back to discoveries</button>
      </div>
    );
  }

  const p = view.property;
  const sqm = num(p.sqm);
  const price = num(p.price);
  const perSqm = (price !== null && sqm) ? Math.round(price / sqm) : null;

  return (
    <div className="mx-auto max-w-4xl px-6 py-8 sm:px-10">
      <button type="button" onClick={onBack} className="text-sm font-semibold text-navy-400 hover:text-navy-700">{'\u2190'} Discoveries</button>

      <div className="mt-5"><LeadTimeBanner lead={view.leadTime} /></div>

      <div className="mt-8 flex flex-col gap-8 lg:flex-row">
        <div className="lg:w-2/3">
          <Gallery p={p} />
          <h1 className="mt-6 text-2xl font-bold tracking-display text-navy-700 sm:text-3xl">{p.address}</h1>
          <p className="mt-1 text-sm text-navy-400">{[p.city, p.postal_code, p.property_type].filter(Boolean).join(' \u00B7 ')}</p>

          <div className="mt-5 grid grid-cols-2 gap-3 sm:grid-cols-4">
            <div className="rounded-control bg-navy-50 p-3">
              <p className="text-xs text-navy-400">Price</p>
              <p className="text-sm font-semibold text-navy-700">{formatDkkCompact(p.price)}</p>
            </div>
            <div className="rounded-control bg-navy-50 p-3">
              <p className="text-xs text-navy-400">Size</p>
              <p className="text-sm font-semibold text-navy-700">{formatArea(p.sqm)}</p>
            </div>
            <div className="rounded-control bg-navy-50 p-3">
              <p className="text-xs text-navy-400">Rooms</p>
              <p className="text-sm font-semibold text-navy-700">{p.bedrooms || '\u2014'}{num(p.bathrooms) ? ' \u00B7 ' + String(num(p.bathrooms)) + ' bath' : ''}</p>
            </div>
            <div className="rounded-control bg-navy-50 p-3">
              <p className="text-xs text-navy-400">Price per m{'\u00B2'}</p>
              <p className="text-sm font-semibold text-navy-700">{perSqm ? perSqm.toLocaleString('da-DK') + ' kr.' : '\u2014'}</p>
            </div>
          </div>

          {p.description
            ? <p className="mt-5 text-sm leading-relaxed text-navy-600">{p.description}</p>
            : loadingDetail
              ? <div className="mt-5"><Spinner label="Fetching the full listing\u2026" /></div>
              : null}
        </div>

        <aside className="lg:w-1/3">
          <div className="hr-card p-6"><MatchDial match={view.match} size="lg" /></div>
          <div className="mt-4"><ConfidencePanel confidence={view.confidence} /></div>
          <div className="mt-4"><ContactAgent p={p} loading={loadingDetail} /></div>
        </aside>
      </div>

      {!view.match.eligible && view.match.blockedBy && (
        <p className="mt-8 rounded-control bg-slate-100 p-4 text-sm text-slate-700">
          <span className="font-semibold">Outside your radar:</span> {view.match.blockedBy}.
        </p>
      )}

      <div className="mt-10"><WhyThisMatches match={view.match} /></div>
      <div className="mt-12"><DiscoveryTimeline provenance={view.provenance} lead={view.leadTime} /></div>
      <div className="mt-12"><ProvenancePanel provenance={view.provenance} facts={view.facts} /></div>
      <div className="mt-12"><AddressInsights propertyId={p.id} /></div>
      <div className="mt-12"><LocationMap p={p} /></div>

      <section className="mt-12">
        <p className="hr-label">Is this one right?</p>
        <p className="mt-2 text-sm text-navy-400">Your answer tunes what reaches you next. You can undo it in Your Radar.</p>
        <div className="mt-3 flex flex-wrap gap-3">
          <button type="button" onClick={() => onVerdict(view, true)}
            className="rounded-control border border-verify-100 bg-verify-50 px-5 py-3 text-sm font-semibold text-verify-700 transition hover:border-verify-500">
            Relevant
          </button>
          <button type="button" onClick={() => onVerdict(view, false)}
            className="rounded-control border border-navy-200 px-5 py-3 text-sm font-semibold text-navy-500 transition hover:border-navy-400">
            Not for me
          </button>
        </div>
      </section>

      <section className="mt-12">
        <p className="hr-label">Your move</p>
        <div className="mt-3 flex flex-wrap gap-3">
          <Button variant={saved ? 'primary' : 'secondary'} onClick={onToggleSave}>{saved ? 'Shortlisted' : 'Add to shortlist'}</Button>
          {p.agent_phone && (
            <a href={'tel:' + String(p.agent_phone).replace(/\s+/g, '')}
              className="rounded-control border border-navy-200 bg-white px-5 py-3 text-sm font-semibold text-navy-700 transition hover:border-navy-300">
              Call {p.agent_name || 'agent'}
            </a>
          )}
          {p.source_url && (
            <a href={p.source_url} target="_blank" rel="noopener noreferrer"
              className="rounded-control border border-navy-200 bg-white px-5 py-3 text-sm font-semibold text-navy-700 transition hover:border-navy-300">
              View original listing
            </a>
          )}
        </div>
        <p className="mt-6 rounded-control bg-navy-50 p-4 text-sm text-navy-600">
          <span className="font-semibold">Recommended next action:</span> {nextAction(view)}
        </p>
      </section>

      <p className="mt-10 border-t border-navy-100 pt-6 text-xs leading-relaxed text-navy-400">{MATCH_DISCLAIMER}</p>
    </div>
  );
}

/* ---------- Shortlist ---------- */
function ShortlistPage({ data, savedIds, onToggle, onOpen }) {
  const all = data.eligible.concat(data.nearMiss);
  const saved = all.filter((o) => savedIds.indexOf(String(o.property.id)) !== -1);
  return (
    <div>
      <PageHeader title="Shortlist" subtitle={saved.length + ' saved'} />
      <div className="mx-auto max-w-4xl px-6 py-8 sm:px-10">
        {data.loading && <Spinner label="Loading your shortlist\u2026" />}
        {!data.loading && !saved.length && (
          <div className="hr-card p-8">
            <h2 className="text-lg font-bold text-navy-700">Nothing shortlisted yet</h2>
            <p className="mt-2 text-sm text-navy-400">Shortlisted opportunities keep their lead time, match and signal trail so you can compare them later.</p>
            <a href="#/discoveries" className="mt-5 inline-block text-sm font-semibold text-navy-600 underline underline-offset-2">Browse discoveries</a>
          </div>
        )}
        <div className="space-y-5">
          {saved.map((o, i) => (
            <OpportunityCard key={o.property.id} opportunity={o} index={i} saved
              onToggleSave={() => onToggle(String(o.property.id))}
              onVerdict={() => {}} onOpen={() => onOpen(o.property.id)} />
          ))}
        </div>
      </div>
    </div>

}

/* ---------- Your Radar ---------- */
const SUGGESTED_AREAS = ['Copenhagen', 'Frederiksberg', 'Aarhus', 'Odense', 'Aalborg', 'Roskilde'];
const SUGGESTED_FEATURES = ['Garden', 'Balcony', 'Parking', 'Terrace', 'Renovated', 'Sea view'];

function ConsentRow({ label, help, checked, disabled, onChange }) {
  return (
    <label className="flex gap-3 rounded-control bg-navy-50 p-4">
      <input type="checkbox" checked={checked} disabled={disabled} onChange={(e) => onChange(e.target.checked)} className="mt-1 h-4 w-4" />
      <span>
        <span className="block text-sm font-semibold text-navy-700">{label}</span>
        <span className="block text-xs text-navy-400">{help}</span>
      </span>
    </label>
  );
}

/** Free-text city or postcode entry, with suggestions and removable chips. */
function TokenInput({ value, onChange, placeholder, suggestions, transform, describe }) {
  const [draft, setDraft] = useState('');

  const add = (raw) => {
    const v = transform ? transform(raw) : String(raw || '').trim();
    if (!v) { setDraft(''); return; }
    if (!value.some((x) => x.toLocaleLowerCase('da-DK') === v.toLocaleLowerCase('da-DK'))) onChange(value.concat([v]));
    setDraft('');
  };
  const remove = (v) => onChange(value.filter((x) => x !== v));

  return (
    <div>
      <div className="flex gap-2">
        <input type="text" value={draft} placeholder={placeholder}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); add(draft); } }}
          className="flex-1 rounded-control border border-navy-200 px-4 py-3 text-sm" />
        <button type="button" onClick={() => add(draft)}
          className="rounded-control bg-navy-700 px-5 py-3 text-sm font-semibold text-white transition hover:bg-navy-600">
          Add
        </button>
      </div>

      {suggestions && suggestions.length > 0 && (
        <div className="mt-3 flex flex-wrap gap-2">
          {suggestions.map((s) => {
            const on = value.some((x) => x.toLocaleLowerCase('da-DK') === s.toLocaleLowerCase('da-DK'));
            return (
              <button key={s} type="button" onClick={() => on ? remove(s) : add(s)} aria-pressed={on}
                className={'rounded-full px-4 py-2 text-sm font-medium transition ' +
                  (on ? 'bg-navy-700 text-white' : 'bg-white text-navy-500 ring-1 ring-navy-200 hover:ring-navy-400')}>
                {s}
              </button>
            );
          })}
        </div>
      )}

      {value.length > 0 && (
        <div className="mt-3 flex flex-wrap gap-2">
          {value.map((v) => (
            <span key={v} className="flex items-center gap-2 rounded-full bg-navy-50 px-3 py-1.5 text-sm font-medium text-navy-700 ring-1 ring-navy-100">
              {v}{describe && describe(v) ? <span className="text-xs font-normal text-navy-400">{describe(v)}</span> : null}
              <button type="button" onClick={() => remove(v)} aria-label={'Remove ' + v}
                className="text-navy-300 transition hover:text-navy-700">{'\u00D7'}</button>
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

function RadarPage({ initial, setup, onSave, feedback, hiddenCount, onRestoreAll }) {
  const [prefs, setPrefs] = useState(initial || DEFAULT_PREFERENCES);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const update = (patch) => setPrefs((c) => Object.assign({}, c, patch));

  async function save() {
    if (!prefs.areas.length) { setError('Add at least one area so the radar knows where to look.'); return; }
    const unknown = prefs.areas.filter((a) => isPostalCode(a) && !POSTAL_AREA_NAMES[a]);
    if (unknown.length) { setError('We do not recognise postcode ' + unknown[0] + '. Try the city name instead.'); return; }
    setBusy(true); setError(null);
    try { await onSave(withDerivedCities(prefs)); }
    catch (e) { setError(e.message); }
    finally { setBusy(false); }
  }

  return (
    <div>
      <PageHeader title={setup ? 'Calibrate your radar' : 'Your Radar'}
        subtitle={setup ? 'Three things, then we sweep your channels.' : 'The instrument that decides what reaches you.'} />
      <div className="mx-auto max-w-3xl px-6 py-8 sm:px-10">
        <section className="hr-card p-6 sm:p-8">
          <p className="hr-label">Non-negotiable</p>
          <div className="mt-4 grid gap-4 sm:grid-cols-2">
            <label className="block">
              <span className="text-sm font-medium text-navy-600">Budget floor (DKK)</span>
              <input type="number" min="0" step="100000" value={prefs.budget.min}
                onChange={(e) => update({ budget: Object.assign({}, prefs.budget, { min: Number(e.target.value) }) })}
                className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
            </label>
            <label className="block">
              <span className="text-sm font-medium text-navy-600">Budget ceiling (DKK)</span>
              <input type="number" min="0" step="100000" value={prefs.budget.max}
                onChange={(e) => update({ budget: Object.assign({}, prefs.budget, { max: Number(e.target.value) }) })}
                className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
            </label>
          </div>

          <div className="mt-6">
            <span className="text-sm font-medium text-navy-600">Areas</span>
            <p className="mt-1 text-xs text-navy-400">
              Type any Danish city or a 4-digit postcode. A postcode narrows the radar to that district exactly.
            </p>
            <div className="mt-3">
              <TokenInput
                value={prefs.areas}
                onChange={(areas) => update({ areas })}
                placeholder="e.g. Odense, Aarhus or 2100"
                suggestions={SUGGESTED_AREAS}
                transform={canonicalAreaName}
                describe={(v) => isPostalCode(v) ? (POSTAL_AREA_NAMES[v] ? ('\u00B7 ' + POSTAL_AREA_NAMES[v]) : '\u00B7 unknown postcode') : ''} />
            </div>
          </div>

          <div className="mt-6">
            <span className="text-sm font-medium text-navy-600">Measure the home by</span>
            <div className="mt-2 flex flex-wrap gap-6">
              <label className="flex items-center gap-2 text-sm text-navy-700">
                <input type="radio" name="sizeMode" checked={prefs.sizeMode === 'size'}
                  onChange={() => update({ sizeMode: 'size' })} className="h-4 w-4" />
                Floor area (m{'\u00B2'})
              </label>
              <label className="flex items-center gap-2 text-sm text-navy-700">
                <input type="radio" name="sizeMode" checked={prefs.sizeMode === 'rooms'}
                  onChange={() => update({ sizeMode: 'rooms' })} className="h-4 w-4" />
                Number of rooms
              </label>
            </div>
            <label className="mt-3 block max-w-xs">
              <span className="text-xs font-medium text-navy-500">
                {prefs.sizeMode === 'size' ? 'Minimum m\u00B2' : 'Minimum rooms'}
              </span>
              <input type="number" min={prefs.sizeMode === 'size' ? 0 : 1}
                value={prefs.sizeMode === 'size' ? (prefs.minSize || 0) : (prefs.minRooms || 1)}
                onChange={(e) => update(prefs.sizeMode === 'size'
                  ? { minSize: Number(e.target.value) }
                  : { minRooms: Number(e.target.value) })}
                className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
            </label>
          </div>
        </section>

        <section className="hr-card mt-6 p-6 sm:p-8">
          <p className="hr-label">Preferences</p>
          <p className="mt-2 text-sm text-navy-400">
            Soft signals. They shape ranking but never exclude a home.
          </p>

          <div className="mt-4">
            <TokenInput
              value={prefs.features}
              onChange={(features) => update({ features })}
              placeholder="Add your own, e.g. Sea view"
              suggestions={SUGGESTED_FEATURES} />
          </div>

          <label className="mt-6 block">
            <span className="text-sm font-medium text-navy-600">Anything else that matters?</span>
            <textarea rows="4" value={prefs.notes} onChange={(e) => update({ notes: e.target.value })}
              placeholder="e.g. Ground floor is fine, but I want a quiet street and space for a home office."
              className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
            <span className="mt-1.5 block text-xs text-navy-400">
              HomeRadar reads this for the words it can check against a listing, and says which ones it found.
            </span>
          </label>
        </section>

        <section className="hr-card mt-6 p-6 sm:p-8">
          <p className="hr-label">What HomeRadar has learned</p>

          {hiddenCount > 0 && (
            <div className="mt-4 flex flex-wrap items-center justify-between gap-3 rounded-control bg-navy-50 px-4 py-3">
              <span className="text-sm text-navy-600">
                <span className="font-semibold text-navy-700">{hiddenCount}</span> {hiddenCount === 1 ? 'listing is' : 'listings are'} hidden from your feed
              </span>
              <button type="button" onClick={onRestoreAll}
                className="text-xs font-semibold text-navy-600 underline underline-offset-2 hover:text-navy-700">
                Show them again
              </button>
            </div>
          )}
          <ul className="mt-4 space-y-2">
            {Object.keys(prefs.weights).map((dim) => {
              const w = prefs.weights[dim];
              const strength = w >= 1.3 ? 'Strong' : w >= 1.1 ? 'Medium' : w <= 0.8 ? 'Avoiding' : 'Neutral';
              return (
                <li key={dim} className="flex items-center justify-between rounded-control bg-navy-50 px-4 py-3 text-sm">
                  <span className="capitalize text-navy-700">{dim}</span>
                  <span className="flex items-center gap-3">
                    <span className="text-navy-400">{strength}</span>
                    <button type="button" onClick={() => update({ weights: Object.assign({}, prefs.weights, { [dim]: 1 }) })}
                      className="text-xs font-semibold text-navy-500 underline underline-offset-2">Reset</button>
                  </span>
                </li>
              );
            })}
          </ul>

          {feedback && feedback.length > 0 && (
            <div className="mt-6 border-t border-navy-100 pt-5">
              <p className="hr-label">Recent feedback</p>
              <ul className="mt-3 space-y-2">
                {feedback.slice(0, 5).map((f, i) => (
                  <li key={i} className="flex gap-3 text-sm">
                    <span aria-hidden="true" className={'mt-0.5 font-bold ' + (f.relevant ? 'text-verify-600' : 'text-slate-400')}>
                      {f.relevant ? '\u2713' : '\u2715'}
                    </span>
                    <span className="min-w-0 flex-1">
                      <span className="block truncate text-navy-700">{f.address}</span>
                      <span className="block text-xs text-navy-400">
                        {(f.chips && f.chips.length ? f.chips.join(', ') : '') + (f.reason ? (f.chips && f.chips.length ? ' \u00B7 ' : '') + '\u201C' + f.reason + '\u201D' : '') || 'No reason given'}
                      </span>
                    </span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </section>

        <section className="hr-card mt-6 p-6 sm:p-8">
          <p className="hr-label">Data &amp; learning</p>
          <div className="mt-4 space-y-4">
            <ConsentRow label="Remember my criteria" help="Without this there is no radar." checked disabled onChange={() => {}} />
            <ConsentRow label="Learn from what I say" help="When you mark an opportunity relevant or not, HomeRadar adjusts what it looks for."
              checked={prefs.consent.explicitFeedback}
              onChange={(v) => update({ consent: Object.assign({}, prefs.consent, { explicitFeedback: v }) })} />
            <ConsentRow label="Learn from what I do" help="Which opportunities you open and return to. Off by default."
              checked={prefs.consent.behaviour}
              onChange={(v) => update({ consent: Object.assign({}, prefs.consent, { behaviour: v }) })} />
          </div>
        </section>

        {error && <p role="alert" className="mt-6 rounded-control bg-red-50 p-4 text-sm text-red-700">{error}</p>}
        <Button onClick={save} disabled={busy} className="mt-6 w-full">
          {busy ? 'Saving\u2026' : setup ? 'Start my first sweep' : 'Save radar'}
        </Button>
      </div>
    </div>
  );
}

/* ---------- Brand ---------- */
function BrandMark({ size = 36 }) {
  return (
    // Always paired with the visible "HomeRadar" wordmark, so it stays decorative.
    <svg width={size} height={size} viewBox="0 0 40 40" aria-hidden="true" className="shrink-0">
      <rect width="40" height="40" rx="10" fill="#14213D" />
      <circle cx="20" cy="20" r="13" fill="none" stroke="#fff" strokeOpacity="0.22" strokeWidth="1.4" />
      <circle cx="20" cy="20" r="7.5" fill="none" stroke="#fff" strokeOpacity="0.22" strokeWidth="1.4" />
      <path d="M20 20 L20 7 A13 13 0 0 1 31.3 13.5 Z" fill="#FCA311" fillOpacity="0.9" />
      <path d="M25.6 10.4l3.4 2.9v3.6h-2.2v-2.2h-2.4v2.2h-2.2v-3.6z" fill="#fff" />
      <circle cx="20" cy="20" r="2" fill="#fff" />
    </svg>
  );
}

function Wordmark({ size = 36, className = '' }) {
  return (
    <span className={'flex items-center gap-2.5 ' + className}>
      <BrandMark size={size} />
      <span className="text-lg font-bold tracking-display">HomeRadar</span>
    </span>
  );
}

/* ---------- Live radar: what HomeRadar is watching, right now ---------- */
const RADAR_CHANNELS = [
  { key: 'agent_portal', label: 'Agent portals' },
  { key: 'developer', label: 'Developer sites' },
  { key: 'newsletter', label: 'Newsletters' },
  { key: 'boligsiden', label: 'Public portals' },
  { key: 'partner', label: 'Partner submissions' },
  { key: 'social', label: 'Social (permitted)' }
];

function LiveRadar() {
  const [stats, setStats] = useState({ loading: true, total: 0, fresh: 0, live: {} });
  const [beam, setBeam] = useState(0);

  // Real, unauthenticated counts — the landing claim should be checkable.
  // The newest 100 rows skew to one channel, so pre-market sources are counted separately.
  useEffect(() => {
    let cancelled = false;
    Promise.all([
      api.properties({ limit: 100 }).catch(() => []),
      api.properties({ source: 'agent_portal', limit: 20 }).catch(() => [])
    ])
      .then(([recent, early]) => {
        if (cancelled) return;
        const byId = {};
        recent.concat(early).forEach((r) => { byId[String(r.id)] = r; });
        const rows = Object.keys(byId).map((k) => byId[k]);
        const sources = {};
        let fresh = 0;
        rows.forEach((r) => {
          if (r.source) sources[r.source] = true;
          const seen = toDate(r.created_at);
          if (seen && (Date.now() - seen.getTime()) < 7 * 86400000) fresh++;
        });
        setStats({ loading: false, total: rows.length, fresh, live: sources });
      })
      .catch(() => { if (!cancelled) setStats({ loading: false, total: 0, fresh: 0, live: {} }); });
    return () => { cancelled = true; };
  }, []);

  // Drives which channel chip is "being swept" so the two stay in sync.
  useEffect(() => {
    const id = window.setInterval(() => setBeam((b) => (b + 1) % RADAR_CHANNELS.length), 1000);
    return () => window.clearInterval(id);
  }, []);

  const blips = [
    { r: 34, a: 20, d: 0 }, { r: 58, a: 115, d: 0.6 }, { r: 44, a: 205, d: 1.2 },
    { r: 70, a: 300, d: 1.8 }, { r: 24, a: 255, d: 2.4 }
  ];

  return (
    <div className="w-full max-w-[400px] rounded-[28px] border border-navy-100 bg-white p-5 shadow-lift">
      <div className="flex items-center justify-between gap-3">
        <span className="inline-flex items-center gap-2 text-[11px] font-semibold uppercase tracking-[0.1em] text-navy-400">
          <span aria-hidden="true" className="h-2 w-2 animate-pulse rounded-full bg-verify-500" />Live
        </span>
        <p className="truncate text-sm font-semibold text-navy-700">Sweeping {RADAR_CHANNELS[beam].label.toLowerCase()}</p>
      </div>

      <div className="relative mx-auto mt-4 aspect-square w-full max-w-[268px] overflow-hidden rounded-full bg-navy-50">
        <svg viewBox="0 0 200 200" className="h-full w-full p-2">
          <defs>
            <radialGradient id="hrGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="#14213D" stopOpacity="0.06" />
              <stop offset="100%" stopColor="#14213D" stopOpacity="0" />
            </radialGradient>
            <radialGradient id="hrSweep" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="#FCA311" stopOpacity="0.42" />
              <stop offset="70%" stopColor="#FCA311" stopOpacity="0.14" />
              <stop offset="100%" stopColor="#FCA311" stopOpacity="0" />
            </radialGradient>
          </defs>
          <circle cx="100" cy="100" r="92" fill="url(#hrGlow)" />
          {[92, 70, 48, 26].map((r) => (
            <circle key={r} cx="100" cy="100" r={r} fill="none" stroke="#14213D" strokeOpacity="0.12" strokeWidth="1" strokeDasharray="3 4" />
          ))}
          <line x1="8" y1="100" x2="192" y2="100" stroke="#14213D" strokeOpacity="0.08" />
          <line x1="100" y1="8" x2="100" y2="192" stroke="#14213D" strokeOpacity="0.08" />

          <g className="hr-sweep" style={{ transformOrigin: '100px 100px' }}>
            <path d="M100 100 L100 8 A92 92 0 0 1 165 35 Z" fill="url(#hrSweep)" />
            <line x1="100" y1="100" x2="100" y2="8" stroke="#FCA311" strokeOpacity="0.75" strokeWidth="1.5" strokeLinecap="round" />
          </g>

          {blips.map((b, i) => {
            const rad = (b.a * Math.PI) / 180;
            const cx = 100 + b.r * Math.cos(rad);
            const cy = 100 + b.r * Math.sin(rad);
            return (
              <g key={i}>
                <circle className="hr-blip" cx={cx} cy={cy} r="7" fill="#FCA311" style={{ animationDelay: b.d + 's' }} />
                <circle cx={cx} cy={cy} r="3.4" fill="#14213D" />
              </g>
            );
          })}
          <circle cx="100" cy="100" r="4.5" fill="#14213D" />
        </svg>

      </div>

      <div className="mt-5 border-t border-navy-100 pt-4">
        <div className="flex items-center justify-between gap-3">
          <p className="text-[11px] font-semibold uppercase tracking-[0.08em] text-navy-400">Channels we watch</p>
          <span className="inline-flex items-center gap-1.5 text-[11px] text-navy-400">
            <span aria-hidden="true" className="h-1.5 w-1.5 rounded-full bg-verify-500" />reporting now
          </span>
        </div>
        <div className="mt-3 grid grid-cols-2 gap-2">
        {RADAR_CHANNELS.map((c, i) => {
          const live = !!stats.live[c.key];
          return (
            <span key={c.key}
              title={live ? 'Reporting now' : 'Watched \u2014 nothing new right now'}
              className={'flex items-center gap-2 rounded-control px-2.5 py-1.5 text-[11px] font-medium transition-colors duration-500 ' +
                (i === beam ? 'bg-signal-50 text-navy-700 ring-1 ring-signal-200' : 'bg-canvas text-navy-500 ring-1 ring-navy-100')}>
              <span aria-hidden="true" className={'h-1.5 w-1.5 shrink-0 rounded-full ' + (live ? 'bg-verify-500' : 'bg-navy-200')} />
              <span className="truncate">{c.label}</span>
            </span>
          );
        })}
        </div>
      </div>

      <div className="mt-4 border-t border-navy-100 pt-4" role="status">
        {stats.loading
          ? <p className="text-sm text-navy-400">{'Connecting to the radar\u2026'}</p>
          : stats.total > 0
            ? <div className="flex items-baseline gap-2">
                <span className="text-2xl font-bold leading-none text-navy-700">{stats.total}</span>
                <span className="text-sm text-navy-500">
                  {stats.fresh >= stats.total
                    ? 'on the radar, all found this week'
                    : <React.Fragment>{'on the radar \u00B7 '}<span className="font-semibold text-navy-700">{stats.fresh}</span>{' this week'}</React.Fragment>}
                </span>
              </div>
            : <p className="text-sm text-navy-400">{'The radar is warming up \u2014 the service sleeps when idle.'}</p>}
      </div>
    </div>
  );
}

/* ---------- Landing: the page a visitor lands on first ---------- */
function Landing({ user, hasRadar, onEnter, onSignIn }) {
  const steps = [
    { n: '01', t: 'Calibrate', d: 'Tell us your ceiling, your areas and what actually matters. Three questions, not a form.' },
    { n: '02', t: 'Sweep', d: 'Public portals, agent portals, drawer sales, developer sites, newsletters and permitted social — swept continuously and merged into one feed.' },
    { n: '03', t: 'Understand', d: 'Every opportunity arrives with its lead time, why it fits you, and where the information came from.' }
  ];

  return (
    <div className="min-h-screen bg-canvas">
      <header className="mx-auto flex max-w-6xl items-center justify-between px-6 py-6 sm:px-10">
        <a href="#/" className="flex items-center gap-3 text-navy-700 transition hover:opacity-80">
          <Wordmark size={36} />
        </a>
        {user
          ? <Button onClick={onEnter}>{hasRadar ? 'Go to my radar' : 'Finish setup'}</Button>
          : <Button variant="secondary" onClick={onSignIn}>Sign in</Button>}
      </header>

      <section className="mx-auto grid max-w-6xl items-center gap-12 px-6 pb-20 pt-10 sm:px-10 lg:grid-cols-[1.05fr_0.95fr] lg:gap-16">
        <div>
          <span className="inline-flex items-center gap-2 rounded-full bg-signal-50 px-3 py-1.5 text-xs font-semibold text-signal-700 ring-1 ring-signal-200">
            <RadarGlyph active />Property discovery, not another portal
          </span>
          <h1 className="mt-5 text-4xl font-bold leading-tight tracking-display text-navy-700 sm:text-5xl">
            Every channel a home appears on. One radar.
          </h1>
          <p className="mt-5 max-w-lg text-lg leading-relaxed text-navy-500">
            Public listings, drawer sales and homes still weeks from the market. HomeRadar matches them all against
            your criteria, explains why each one fits, and tells you exactly how early you are.
          </p>
          <div className="mt-8 flex flex-wrap gap-3">
            {user
              ? <Button onClick={onEnter}>{hasRadar ? 'Go to my radar' : 'Finish setup'}</Button>
              : <React.Fragment>
                  <Button onClick={onSignIn}>Start my radar</Button>
                  <Button variant="secondary" onClick={onSignIn}>I already have an account</Button>
                </React.Fragment>}
          </div>
          <p className="mt-6 text-xs text-navy-400">We only use permitted, licensed or submitted sources.</p>
        </div>

        <div className="flex justify-center lg:justify-end">
          <LiveRadar />
        </div>
      </section>

      <section className="border-y border-navy-100 bg-white">
        <div className="mx-auto grid max-w-6xl gap-8 px-6 py-14 sm:px-10 lg:grid-cols-3">
          {steps.map((s) => (
            <div key={s.n}>
              <p className="text-xs font-bold tracking-[0.12em] text-signal-600">{s.n}</p>
              <h2 className="mt-2 text-lg font-bold text-navy-700">{s.t}</h2>
              <p className="mt-2 text-sm leading-relaxed text-navy-500">{s.d}</p>
            </div>
          ))}
        </div>
      </section>

      <section className="mx-auto max-w-6xl px-6 py-14 sm:px-10">
        <div className="grid gap-6 sm:grid-cols-3">
          <div className="hr-card p-6">
            <p className="hr-label">Lead time</p>
            <p className="mt-2 text-sm text-navy-600">Each home says whether it is still off-market, how many days early you are, or that it is already public.</p>
          </div>
          <div className="hr-card p-6">
            <p className="hr-label">Why it matches you</p>
            <p className="mt-2 text-sm text-navy-600">Plain sentences, not a mystery percentage {'\u2014'} including the one trade-off you should know about.</p>
          </div>
          <div className="hr-card p-6">
            <p className="hr-label">Where it came from</p>
            <p className="mt-2 text-sm text-navy-600">A timeline of every sighting across channels, and what each source actually confirmed.</p>
          </div>
        </div>
        <p className="mt-10 text-xs leading-relaxed text-navy-400">{MATCH_DISCLAIMER}</p>
      </section>
    </div>
  );
}

/* ---------- First sweep: the six seconds that explain the product ---------- */
function FirstSweep({ onDone }) {
  const [step, setStep] = useState(0);
  const [counts, setCounts] = useState({});

  const stages = RADAR_CHANNELS.concat([{ key: 'resolve', label: 'Cross-referencing observations' }]);

  useEffect(() => {
    const id = window.setInterval(() => {
      setStep((s) => {
        const next = s + 1;
        if (next > stages.length) { window.clearInterval(id); onDone(); return s; }
        setCounts((c) => Object.assign({}, c, { [s]: 2 + Math.floor(Math.random() * 9) }));
        return next;
      });
    }, 700);
    return () => window.clearInterval(id);
  }, []);

  return (
    <div className="grid min-h-screen place-items-center bg-navy-700 px-6 text-white">
      <div className="w-full max-w-md">
        <div className="relative mx-auto h-44 w-44">
          <svg viewBox="0 0 200 200" className="h-full w-full">
            {[92, 62, 32].map((r) => (
              <circle key={r} cx="100" cy="100" r={r} fill="none" stroke="#fff" strokeOpacity="0.2" strokeWidth="1.5" strokeDasharray="4 5" />
            ))}
            <g className="hr-sweep" style={{ transformOrigin: '100px 100px' }}>
              <path d="M100 100 L100 8 A92 92 0 0 1 165 35 Z" fill="#FCA311" fillOpacity="0.3" />
              <line x1="100" y1="100" x2="100" y2="8" stroke="#FCA311" strokeWidth="2" strokeLinecap="round" />
            </g>
            <circle cx="100" cy="100" r="5" fill="#fff" />
          </svg>
        </div>

        <h1 className="mt-8 text-center text-2xl font-bold tracking-display">Sweeping your channels</h1>

        <ul className="mt-6 space-y-2">
          {stages.map((s, i) => (
            <li key={s.key} className={'flex items-center justify-between rounded-control px-4 py-2.5 text-sm transition ' +
              (i < step ? 'bg-white/10' : 'opacity-35')}>
              <span className="flex items-center gap-3">
                <span aria-hidden="true" className={i < step ? 'text-verify-500' : 'text-navy-200'}>{i < step ? '\u2713' : '\u25CB'}</span>
                {s.label}
              </span>
              {i < step && s.key !== 'resolve' && (
                <span className="text-xs text-navy-100">{counts[i] || 0} observations</span>
              )}
            </li>
          ))}
        </ul>

        <button type="button" onClick={onDone} className="mt-8 w-full text-center text-xs font-semibold text-navy-200 underline underline-offset-2">
          Skip
        </button>
      </div>
    </div>
  );
}

/* ---------- Sign in ---------- */
function SignInPage({ onSignIn, onSignUp, onHome }) {
  const [mode, setMode] = useState('signin');
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    try { mode === 'signin' ? await onSignIn(email, password) : await onSignUp(name, email, password); }
    catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="grid min-h-screen lg:grid-cols-2">
      <section className="relative hidden overflow-hidden bg-navy-700 p-12 text-white lg:block">
        <button type="button" onClick={onHome} className="flex items-center gap-2.5 text-white transition hover:opacity-80" aria-label="HomeRadar home">
          <span className="rounded-[10px] ring-1 ring-white/25"><BrandMark size={36} /></span>
          <span className="font-bold tracking-display">HomeRadar</span>
        </button>
        <h1 className="mt-16 max-w-sm text-4xl font-bold leading-tight tracking-display">Every channel a home appears on. One radar.</h1>
        <p className="mt-4 max-w-sm text-navy-100">
          Public listings, drawer sales and coming-soon homes {'\u2014'} matched to your criteria, explained in plain words,
          with the source and timing behind every one.
        </p>
        <BigRadar />
        <p className="absolute bottom-12 left-12 max-w-sm text-xs text-navy-200">We only use permitted, licensed or submitted sources.</p>
      </section>

      <section className="flex items-center justify-center p-8">
        <form onSubmit={submit} className="w-full max-w-sm">
          <h2 className="text-2xl font-bold tracking-display text-navy-700">{mode === 'signin' ? 'Sign in' : 'Start your radar'}</h2>
          {mode === 'signup' && (
            <label className="mt-6 block">
              <span className="hr-label">Name</span>
              <input value={name} onChange={(e) => setName(e.target.value)} required className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
            </label>
          )}
          <label className="mt-4 block">
            <span className="hr-label">Email</span>
            <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
          </label>
          <label className="mt-4 block">
            <span className="hr-label">Password</span>
            <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength="6" className="mt-1.5 w-full rounded-control border border-navy-200 px-4 py-3 text-sm" />
          </label>
          {error && <p role="alert" className="mt-4 rounded-control bg-red-50 p-3 text-sm text-red-700">{error}</p>}
          <Button type="submit" disabled={busy} className="mt-6 w-full">
            {busy ? 'Working\u2026' : mode === 'signin' ? 'Sign in' : 'Create account'}
          </Button>
          <button type="button" onClick={() => setMode(mode === 'signin' ? 'signup' : 'signin')} className="mt-4 w-full text-sm text-navy-500 hover:text-navy-700">
            {mode === 'signin' ? 'No account? Create one' : 'Already have an account? Sign in'}
          </button>
        </form>
      </section>
    </div>
  );
}

/* ============================================================
   App
   ============================================================ */
function useHashRoute() {
  const read = () => (window.location.hash || '#/').replace(/^#/, '') || '/';
  const [route, setRoute] = useState(read);
  useEffect(() => {
    const onHash = () => setRoute(read());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return [route, (to) => { window.location.hash = to; }];
}

function App() {
  const [route, navigate] = useHashRoute();
  const [user, setUser] = useState(null);
  const [prefs, setPrefs] = useState(null);
  const [ready, setReady] = useState(false);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [savedIds, setSavedIds] = useState(() => {
    try { return JSON.parse(localStorage.getItem('homeradar_saved') || '[]'); } catch (e) { return []; }
  });
  const [toast, setToast] = useState(null);
  const [sweeping, setSweeping] = useState(false);
  const [feedbackPrompt, setFeedbackPrompt] = useState(null);
  const [feedbackLog, setFeedbackLog] = useState(() => {
    try { return JSON.parse(localStorage.getItem('homeradar_feedback') || '[]'); } catch (e) { return []; }
  });
  // Mirrored locally so a dismissal is instant and survives an offline backend.
  const [dismissed, setDismissed] = useState(() => {
    try { return JSON.parse(localStorage.getItem('homeradar_dismissed') || '[]'); } catch (e) { return []; }
  });

  useEffect(() => { localStorage.setItem('homeradar_dismissed', JSON.stringify(dismissed)); }, [dismissed]);

  useEffect(() => { localStorage.setItem('homeradar_feedback', JSON.stringify(feedbackLog)); }, [feedbackLog]);

  useEffect(() => { localStorage.setItem('homeradar_saved', JSON.stringify(savedIds)); }, [savedIds]);

  // Restore session
  const autoRouted = useRef(false);
  useEffect(() => {
    let cancelled = false;
    (async () => {
      if (!getToken()) { setReady(true); return; }
      try {
        const p = await api.profile();
        if (cancelled) return;
        setUser({ id: p.id, email: p.email, first_name: p.first_name, last_name: p.last_name });
        const np = normalisePrefs(p.preferences);
        setPrefs(np);
        // Skip the landing page when the app is opened with no route at all;
        // an explicit #/ (e.g. clicking the logo) always stays on it.
        if (!autoRouted.current && np && window.location.hash === '') {
          autoRouted.current = true;
          window.location.hash = '/home';
        }
      } catch (e) { setToken(null); }
      finally { if (!cancelled) setReady(true); }
    })();
    return () => { cancelled = true; };
  }, []);

  // Server-side dismissals win, so a "not for me" holds across devices.
  useEffect(() => {
    if (!user) return;
    let cancelled = false;
    api.getFeedback()
      .then((d) => {
        if (cancelled || !d || !Array.isArray(d.dismissed)) return;
        setDismissed(d.dismissed.map(String));
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [user]);

  // Load properties for the radar's areas
  const cityKey = prefs ? (prefs.areas || []).join(',') : '';
  useEffect(() => {
    if (!user || !prefs) return;
    let cancelled = false;
    setLoading(true); setError(null);
    const targets = cityQueryTerms(prefs.areas);
    Promise.all((targets.length ? targets : ['']).map((c) => api.properties({ city: c || undefined, limit: 60 }).catch(() => [])))
      .then((batches) => {
        if (cancelled) return;
        const merged = {};
        batches.forEach((b) => b.forEach((r) => { merged[String(r.id)] = r; }));
        setRows(Object.keys(merged).map((k) => merged[k]));
      })
      .catch((e) => { if (!cancelled) setError(e.message); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [user, cityKey, prefs]);

  const data = useMemo(() => {
    if (!prefs) return { loading, error, eligible: [], nearMiss: [], dismissedCount: 0 };
    const all = buildOpportunities(rows, prefs);
    const live = all.filter((o) => dismissed.indexOf(String(o.property.id)) === -1);
    return {
      loading, error,
      dismissedCount: all.length - live.length,
      eligible: sortOpportunities(live.filter((o) => o.match.eligible), 'lead'),
      nearMiss: live.filter((o) => !o.match.eligible).sort((a, b) => b.match.score - a.match.score).slice(0, 12)
    };
  }, [rows, prefs, loading, error, dismissed]);

  const showToast = useCallback((msg, action) => {
    setToast({ msg, action });
    window.setTimeout(() => setToast(null), action ? 7000 : 4000);
  }, []);

  function restoreDismissed(id) {
    setDismissed((cur) => cur.filter((x) => x !== String(id)));
    api.undoFeedback(String(id)).catch(() => {});
  }

  async function handleSignIn(email, password) {
    const res = await api.login(email, password);
    setToken(res.token);
    setUser(res.user);
    const p = await api.profile().catch(() => null);
    const np = p ? normalisePrefs(p.preferences) : null;
    setPrefs(np);
    navigate(np ? '/home' : '/radar/setup');
  }

  async function handleSignUp(name, email, password) {
    const res = await api.register(email, password, name);
    setToken(res.token);
    setUser(res.user);
    setPrefs(null);
    navigate('/radar/setup');
  }

  function handleSignOut() {
    setToken(null); setUser(null); setPrefs(null); setRows([]);
    navigate('/');
  }

  async function handleSavePrefs(next) {
    const firstTime = !prefs;
    setPrefs(next);
    await api.savePreferences(next);
    if (firstTime) {
      setSweeping(true);
      return;
    }
    navigate('/home');
    showToast('Radar updated. Sweeping your channels\u2026');
  }

  function toggleSaved(id) {
    setSavedIds((cur) => cur.indexOf(id) !== -1 ? cur.filter((x) => x !== id) : cur.concat([id]));
  }

  function handleVerdict(o, relevant) {
    setFeedbackPrompt({ opportunity: o, relevant });
  }

  function submitFeedback({ reason, chips, dims }) {
    const prompt = feedbackPrompt;
    if (!prompt) return;
    const o = prompt.opportunity;
    const relevant = prompt.relevant;
    setFeedbackPrompt(null);

    // Fall back to the dimensions the match itself flagged when the user gave no signal.
    const inferred = dims.length ? dims : (relevant
      ? o.match.reasons.filter((r) => !r.isCompromise)
      : o.match.reasons.filter((r) => r.isCompromise)).map((r) => r.dimension);

    if (prefs && prefs.consent.explicitFeedback) {
      // Targeted feedback moves one dimension decisively; vague feedback nudges all four.
      const delta = (relevant ? 1 : -1) * (dims.length ? 0.1 : 0.05);
      const weights = Object.assign({}, prefs.weights);
      (inferred.length ? inferred : Object.keys(weights)).forEach((d) => {
        weights[d] = Math.min(2, Math.max(0.5, (weights[d] || 1) + delta));
      });
      const next = Object.assign({}, prefs, { weights });
      setPrefs(next);
      api.savePreferences(next).catch(() => {});
    }

    const entry = {
      id: String(o.property.id),
      address: o.property.address,
      relevant,
      reason,
      chips,
      dims: inferred,
      at: new Date().toISOString()
    };
    setFeedbackLog((log) => [entry].concat(log).slice(0, 50));

    // Phrased to read correctly whether one dimension or several were named.
    const named = inferred.length ? listPhrase(inferred.map((d) => DIMENSION_NAMES[d] || d)) : null;
    const propId = String(o.property.id);

    if (relevant) {
      showToast(named ? ('Learned: you value ' + named + '. Ranking updated.') : 'Noted. Ranking updated.');
    } else {
      // A rejected listing should leave the feed, not sit there being re-read.
      setDismissed((cur) => cur.indexOf(propId) === -1 ? cur.concat([propId]) : cur);
      showToast(named ? ('Hidden. Noted the issue with ' + named + '.') : 'Hidden from your feed.',
        { label: 'Undo', run: () => restoreDismissed(propId) });
      if (route.indexOf('/opportunity/') === 0) navigate('/discoveries');
    }

    api.feedback({
      propertyId: String(o.property.id),
      relevant,
      reason: reason || chips.join(', '),
      signals: inferred,
      propertySnapshot: o.property
    }).catch(() => {});
  }

  const openOpportunity = (id) => navigate('/opportunity/' + id);

  if (!ready) {
    return (
      <div className="grid min-h-screen place-items-center px-6">
        <div>
          <Spinner label="Waking your radar\u2026" />
          <ColdStartNotice />
        </div>
      </div>
    );
  }
  if (route === '/' || route === '') {
    return <Landing user={user} hasRadar={!!prefs}
      onEnter={() => navigate(prefs ? '/home' : '/radar/setup')}
      onSignIn={() => navigate('/signin')} />;
  }
  if (!user) {
    return <SignInPage onSignIn={handleSignIn} onSignUp={handleSignUp} onHome={() => navigate('/')} />;
  }
  if (sweeping) {
    return <FirstSweep onDone={() => { setSweeping(false); navigate('/home'); }} />;
  }
  if (!prefs || route.indexOf('/radar/setup') === 0) {
    return <RadarPage initial={prefs} setup onSave={handleSavePrefs} />;
  }

  let page;
  if (route.indexOf('/opportunity/') === 0) {
    const id = route.split('/opportunity/')[1];
    const found = data.eligible.concat(data.nearMiss).filter((o) =>
      o.sightings.some((s) => String(s.id) === String(id))
    )[0] || null;
    page = <OpportunityPage opportunity={found}
      prefs={prefs}
      saved={found ? savedIds.indexOf(String(found.property.id)) !== -1 : false}
      onToggleSave={() => found && toggleSaved(String(found.property.id))}
      onVerdict={handleVerdict}
      onBack={() => navigate('/discoveries')} />;
  } else if (route.indexOf('/discoveries') === 0) {
    page = <DiscoveriesPage data={data} savedIds={savedIds} onToggle={toggleSaved} onVerdict={handleVerdict} onOpen={openOpportunity} />;
  } else if (route.indexOf('/shortlist') === 0) {
    page = <ShortlistPage data={data} savedIds={savedIds} onToggle={toggleSaved} onOpen={openOpportunity} />;
  } else if (route.indexOf('/radar') === 0) {
    page = <RadarPage initial={prefs} onSave={handleSavePrefs} feedback={feedbackLog}
      hiddenCount={dismissed.length}
      onRestoreAll={() => {
        const ids = dismissed.slice();
        setDismissed([]);
        ids.forEach((id) => api.undoFeedback(id).catch(() => {}));
        showToast(ids.length + (ids.length === 1 ? ' listing is' : ' listings are') + ' back on your radar.');
      }} />;
  } else {
    page = <HomePage user={user} data={data} onOpen={openOpportunity} />;
  }

  return (
    <React.Fragment>
      <AppShell route={route} user={user} onSignOut={handleSignOut} count={data.eligible.length}>
        {page}
      </AppShell>
      {feedbackPrompt && (
        <FeedbackModal prompt={feedbackPrompt} onClose={() => setFeedbackPrompt(null)} onSubmit={submitFeedback} />
      )}
      <AnimatePresence>
        {toast && (
          <motion.div role="status" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: 20 }}
            className="fixed bottom-24 left-1/2 z-30 flex -translate-x-1/2 items-center gap-4 rounded-control bg-navy-700 px-5 py-3 text-sm font-medium text-white shadow-lift lg:bottom-8">
            <span>{toast.msg}</span>
            {toast.action && (
              <button type="button" onClick={() => { toast.action.run(); setToast(null); }}
                className="shrink-0 font-semibold text-signal-500 underline underline-offset-2">
                {toast.action.label}
              </button>
            )}
          </motion.div>
        )}
      </AnimatePresence>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
